  <link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background:#f5f5f5; }
    .navbar { position:sticky; top:0; background:#003366; color:white; padding:10px 30px; display:flex; justify-content:space-between; align-items:center; z-index:1000; }
    .navbar .logo { display:flex; align-items:center; gap:10px; }
    .navbar .logo img { height:40px; }
    .navbar .menu a { color:white; margin-left:20px; text-decoration:none; font-weight:bold; }
    .overlay { min-height:100vh; padding:20px; max-width:1200px; margin:auto; }
    h2 { margin-bottom:15px; color:#003366; }
    input, select { margin-bottom:15px; padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; }

    .table-container { overflow-x:auto; margin-bottom:20px; }

    table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
    th { background:#003366; color:white; padding:12px 15px; text-align:left; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    td { padding:10px 12px; border-bottom:1px solid #ddd; text-align:left; vertical-align:top; word-break:normal; white-space:nowrap; }

    .estado { display:inline-block; padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap; border:1px solid transparent; }
    .pendiente { background:#fff4cc; color:#b38f00; border-color:#ffe58f; }
    .tramite { background:#e6f0ff; color:#1a5fd0; border-color:#99c2ff; }
    .rechazado { background:#fdecea; color:#c62828; border-color:#f5a5a0; }
    .aprobado { background:#e6f7ec; color:#1e7e34; border-color:#9dd8b1; }

    .footer { text-align:center; padding:20px; color:white; background:#003366; margin-top:30px; }

    .notification { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:12px; color:white; font-weight:bold; z-index:9999; opacity:0.95; }
    .notification.success { background:#28a745; }
    .notification.error { background:#dc3545; }

    .file-icon { font-size:1.2rem; margin-right:5px; cursor:pointer; }
    .file-icon:hover { transform:scale(1.2); }

    #modalAporte { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; }
    #modalAporte .modal-content { background:white; padding:20px; border-radius:12px; width:400px; max-width:90%; }
    #modalAporte textarea, #modalAporte select, #modalAporte input { width:100%; margin-top:10px; padding:8px; border-radius:6px; border:1px solid #ccc; }
    #modalAporte button { margin-top:10px; padding:10px; border:none; border-radius:8px; cursor:pointer; }
    #modalAporte button.cancel { background:#999; color:white; }
    #modalAporte button.send { background:#0072C6; color:white; display:flex; align-items:center; justify-content:center; gap:5px; }

    .spinner { border:2px solid #f3f3f3; border-top:2px solid #fff; border-radius:50%; width:14px; height:14px; animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }

    #aporte_timestamp_display { font-size:0.8rem; color:#666; margin-bottom:5px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <img src="/sop-site/logo.png">
      <span>ARTEMISA MARBLE & CABINETS</span>
    </div>
    <div class="menu">
      <a href="/sop-site/">Inicio</a>
      <a href="/sop-site/registrar-sop/">Registrar SOP</a>
      <a href="/sop-site/Aportes/">Aportes SOP</a>
      <a href="/sop-site/biblioteca/">Biblioteca SOP</a>
      <a href="#" onclick="adminLogin()"><i class="fa-solid fa-user-shield"></i> Admin</a>
    </div>
  </div>

  <div class="overlay">
    <h2>Historial de SOPs - Rev 3.0</h2>
    <input type="text" id="buscarSOP" placeholder="Buscar...">
    <select id="filtroEstado">
      <option value="">Todos los estados</option>
      <option value="Pendiente">Pendiente</option>
      <option value="Trámite">Trámite</option>
      <option value="Rechazado">Rechazado</option>
      <option value="Aprobado">Aprobado</option>
    </select>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Empleado</th>
            <th>Departamento</th>
            <th>Objetivo</th>
            <th>Áreas</th>
            <th>Estado</th>
            <th>Fecha / Hora</th>
            <th>Archivos</th>
            <th>Aportar</th>
          </tr>
        </thead>
        <tbody id="tablaSOP"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">© 2026 ARTEMISA MARBLE & CABINETS</div>

  <!-- MODAL APORTES -->
  <div id="modalAporte">
    <div class="modal-content">
      <h3>Aportar a SOP</h3>
      <div id="aporte_timestamp_display"></div>
      <div id="historialAportes" style="max-height:200px; overflow:auto; border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:10px;">Cargando historial...</div>
      <input type="hidden" id="aporte_id_sop">
      <select id="aporte_employee">
        <option value="">Seleccione empleado</option>
        <option value="Damian Molina|damian@artemisamarble.com|Presidente|Ventas">Damian Molina - Presidente</option>
        <option value="Alberto Molina|frontdesk@artemisamarble.com|Frontdesk|Administracion">Alberto Molina - Frontdesk</option>
        <option value="Gabriel Batista|sales@artemisamarble.com|Ventas|Comercial">Gabriel Batista - Ventas</option>
        <option value="Jenny Perez|jenny@artemisamarble.com|Manager|Ventas">Jenny Perez - Manager</option>
        <option value="Yozusi Urdaneta|wood@artemisamarble.com|Shopdrawing|Diseño">Yozusi Urdaneta - Shopdrawing</option>
        <option value="Yoandry Perez|yoandry@artemisamarble.com|Manager|Producción">Yoandry Perez - Manager</option>
        <option value="Wendy Romanach|accounting@artemisamarble.com|Accounting|Administracion">Wendy Romanach - Accounting</option>
        <option value="Rolando Diaz|rolando@artemisamarble.com|Medidor|Medida">Rolando Diaz - Medidor</option>
        <option value="Krishna Camila Rojas|jobs@artemisamarble.com|Shopdrawing|Diseño">Krishna Camila Rojas - Shopdrawing</option>
        <option value="Gregorio Abreu|stone.production@artemisamarble.com|Medidor|Medida">Gregorio Abreu - Medidor</option>
        <option value="Juan Pablo Molina|sales3@artemisamarble.com|Shopdrawing|Diseño">Juan Pablo Molina - Shopdrawing</option>
        <option value="Kevin Pastor|sales4@artemisamarble.com|Ventas|Comercial">Kevin Pastor - Ventas</option>
        <option value="Eliana Pineda|info@artemisamarble.com|Ventas|Comercial">Eliana Pineda - Ventas</option>
        <option value="Carlos Herrera|control@artemisamarble.com|Controller|Control">Carlos Herrera - Controller</option>
        <option value="Otros|otros|otros|otros">Otros</option>
      </select>
      <textarea id="aporte_comentario" placeholder="Comentario u observación" rows="4"></textarea>
      <input type="file" id="aporte_archivos" multiple>
      <div style="display:flex; gap:10px;">
        <button class="send" id="btnEnviar" onclick="enviarAporte()">Enviar</button>
        <button class="cancel" onclick="cerrarAporte()">Cancelar</button>
      </div>
    </div>
  </div>

<script>
const SCRIPT_URL_SOP_ADMIN = "https://script.google.com/macros/s/AKfycby3ng7kFng6Xc7Zkg9ENkOnzKTMr9wwAZRgI-EebyCR3bsX1g0Tt44ASjvLcP0PQoC9/exec";

document.getElementById("modalAporte").style.display = "none";

function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file=>{
    return new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=()=>resolve({ name:file.name, data:reader.result, type:file.type });
      reader.readAsDataURL(file);
    });
  }));
}

function mostrarNotificacion(msg, tipo) {
  const notif = document.createElement("div");
  notif.className = "notification " + tipo;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 4000);
}

function iconoArchivo(link, nombre="archivo") {
  if (!link) return "";
  return `<a href="${link}" target="_blank" class="file-icon" title="${nombre}">📎</a>`;
}

async function renderTabla() {
  const tabla = document.getElementById("tablaSOP");
  tabla.innerHTML = "";
  const filtroEstado = document.getElementById("filtroEstado").value;
  const buscar = document.getElementById("buscarSOP").value.toLowerCase();

  try {
    const res = await fetch(SCRIPT_URL_SOP_ADMIN);
    const data = await res.json();

    data.forEach(row => {
      const sop = {
        Timestamp: row.Timestamp || row[0] || "",
        empleado: row.empleado || row[1] || "",
        correo: row.correo || row[2] || "",
        departamento: row.departamento || row[3] || "",
        objetivo: row.objetivo || row[4] || "",
        areas: row.areas || row[5] || "",
        resumen: row.resumen || row[6] || "",
        estado: row.estado || row[7] || "Pendiente",
        links: row.links || row[8] || ""
      };

      if (filtroEstado && sop.estado !== filtroEstado) return;
      if (buscar && !(sop.empleado.toLowerCase() + sop.objetivo.toLowerCase() + sop.departamento.toLowerCase()).includes(buscar)) return;

      let estadoClass = "pendiente";
      if (sop.estado === "Trámite") estadoClass = "tramite";
      if (sop.estado === "Rechazado") estadoClass = "rechazado";
      if (sop.estado === "Aprobado") estadoClass = "aprobado";

      const archivosHTML = sop.links ? sop.links.split(",").map(l => iconoArchivo(l.trim())).join(" ") : "";

      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${sop.empleado}</td>
        <td>${sop.departamento}</td>
        <td>${sop.objetivo}</td>
        <td>${sop.areas}</td>
        <td><span class="estado ${estadoClass}">${sop.estado}</span></td>
        <td>${sop.Timestamp}</td>
        <td>${archivosHTML}</td>
        <td>
          ${sop.Timestamp ? `<button onclick="abrirAporte('${sop.Timestamp}')">💬</button>` : ""}
        </td>
      `;
      tabla.appendChild(fila);
    });
  } catch(e) {
    console.error(e);
    mostrarNotificacion("Error cargando los SOPs","error");
  }
}

function abrirAporte(id){
  document.getElementById("modalAporte").style.display = "flex";
  document.getElementById("aporte_id_sop").value = id;
  document.getElementById("aporte_timestamp_display").innerText = "Timestamp: " + id;
  cargarHistorial(id);
}

function cerrarAporte(){
  document.getElementById("modalAporte").style.display = "none";
  document.getElementById("aporte_comentario").value = "";
  document.getElementById("aporte_archivos").value = null;
  document.getElementById("aporte_employee").value = "";
}

async function enviarAporte(){
  const btn = document.getElementById("btnEnviar");
  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';

  const id = document.getElementById("aporte_id_sop").value;
  if(!id){ mostrarNotificacion("Error: SOP no identificado","error"); btn.disabled=false; btn.innerHTML=originalText; return; }

  const valor = document.getElementById("aporte_employee").value;
  if(!valor){ mostrarNotificacion("Seleccione un empleado","error"); btn.disabled=false; btn.innerHTML=originalText; return; }

  const datos = valor.split("|");
  const nombre = datos[0], correo = datos[1], depto = datos[3];

  const comentario = document.getElementById("aporte_comentario").value;
  if(!comentario){ mostrarNotificacion("Debe escribir un comentario","error"); btn.disabled=false; btn.innerHTML=originalText; return; }

  try {
    const archivosInput = document.getElementById("aporte_archivos");
    let archivosBase64 = [];
    if(archivosInput.files.length>0){ archivosBase64 = await archivosA_Base64(archivosInput.files); }

    const res = await fetch(SCRIPT_URL_SOP_ADMIN, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({
        action:"guardarAporte",
        id_sop:id,
        empleado:nombre,
        correo:correo,
        departamento:depto,
        comentario:comentario,
        archivos: JSON.stringify(archivosBase64)
      })
    });

    const result = await res.json();
    console.log("Respuesta:", result);

    if(!result.success){
      mostrarNotificacion(result.error || "Error guardando aporte","error");
      btn.disabled=false; btn.innerHTML=originalText;
      return;
    }

    mostrarNotificacion("Aporte enviado correctamente","success");
    cerrarAporte();
    renderTabla();
  } catch(e){
    console.error(e);
    mostrarNotificacion("Error enviando aporte","error");
  } finally {
    btn.disabled=false;
    btn.innerHTML = 'Enviar';
  }
}

async function cargarHistorial(id){
  const historial = document.getElementById("historialAportes");
  historial.innerHTML = "Cargando...";
  try{
    const res = await fetch(`${SCRIPT_URL_SOP_ADMIN}?aportes=${encodeURIComponent(id)}`);
    const data = await res.json();
    historial.innerHTML = data.length
      ? data.map(a=>{
          const archivos = a.ARCHIVOS ? JSON.parse(a.ARCHIVOS) : [];
          const archivosHTML = archivos.map(f=>`<a href="${f.data}" download="${f.name}" class="file-icon">${f.name}</a>`).join(" ");
          return `<div style="border-bottom:1px solid #eee;padding:6px 0;">
                    <strong>${a.EMPLEADO}</strong><br>
                    <small>${a.FECHA}</small><br>
                    ${a.COMENTARIO || ""}<br>
                    ${archivosHTML}
                  </div>`;
        }).join("")
      : "Sin aportes aún";
  }catch(e){
    historial.innerHTML = "Error cargando historial";
  }
}

document.getElementById("buscarSOP").addEventListener("input", renderTabla);
document.getElementById("filtroEstado").addEventListener("change", renderTabla);

renderTabla();

}
</script>
