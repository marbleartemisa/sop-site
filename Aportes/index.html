<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aportes SOP - ARTEMISA MARBLE & CABINETS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background:#f5f5f5; }
    .navbar { position:sticky; top:0; background:#003366; color:white; padding:10px 30px; display:flex; justify-content:space-between; align-items:center; z-index:1000; }
    .navbar .logo { display:flex; align-items:center; gap:10px; }
    .navbar .logo img { height:40px; }
    .navbar .menu a { color:white; margin-left:20px; text-decoration:none; font-weight:bold; }
    .overlay { min-height:100vh; padding:20px; max-width:1200px; margin:auto; }
    h2 { margin-bottom:15px; color:#003366; }
    input, select { margin-bottom:15px; padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; }
    table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; vertical-align:top; word-break:break-word; }
    th { background:#003366; color:white; }
    .estado { padding:4px 10px; border-radius:12px; font-size:.8rem; font-weight:bold; display:inline-block; }
    .pendiente { background:#fff3cd; color:#856404; }
    .tramite { background:#cce5ff; color:#004085; }
    .rechazado { background:#f8d7da; color:#721c24; }
    .aprobado { background:#d4edda; color:#155724; }
    .footer { text-align:center; padding:20px; color:white; background:#003366; margin-top:30px; }
    .notification { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:12px; color:white; font-weight:bold; z-index:9999; opacity:0.95; }
    .notification.success { background:#28a745; }
    .notification.error { background:#dc3545; }
    .file-icon { font-size:1.2rem; margin-right:5px; cursor:pointer; }
    .file-icon:hover { transform:scale(1.2); }
    #modalAporte { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; }
    #modalAporte .modal-content { background:white; padding:20px; border-radius:12px; width:400px; max-width:90%; }
    #modalAporte textarea, #modalAporte select, #modalAporte input { width:100%; margin-top:10px; padding:8px; border-radius:6px; border:1px solid #ccc; }
    #modalAporte button { margin-top:10px; padding:10px; border:none; border-radius:8px; cursor:pointer; }
    #modalAporte button.cancel { background:#999; color:white; }
    #modalAporte button.send { background:#0072C6; color:white; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <img src="/sop-site/logo.png">
      <span>ARTEMISA MARBLE & CABINETS</span>
    </div>
    <div class="menu">
      <a href="/sop-site/">Inicio</a>
      <a href="/sop-site/registrar-sop/">Registrar SOP</a>
      <a href="/sop-site/Aportes/">Aportes SOP</a>
      <a href="/sop-site/biblioteca/">Biblioteca SOP</a>
      <a href="#" onclick="adminLogin()"><i class="fa-solid fa-user-shield"></i> Admin</a>
    </div>
  </div>

  <div class="overlay">
    <h2>Historial de SOPs - Rev 3.0</h2>
    <input type="text" id="buscarSOP" placeholder="Buscar...">
    <select id="filtroEstado">
      <option value="">Todos los estados</option>
      <option value="Pendiente">Pendiente</option>
      <option value="Trámite">Trámite</option>
      <option value="Rechazado">Rechazado</option>
      <option value="Aprobado">Aprobado</option>
    </select>

    <table>
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Departamento</th>
          <th>Objetivo</th>
          <th>Áreas</th>
          <th>Estado</th>
          <th>Fecha / Hora</th>
          <th>Archivos</th>
          <th>Aportar</th>
        </tr>
      </thead>
      <tbody id="tablaSOP"></tbody>
    </table>
  </div>

  <div class="footer">© 2026 ARTEMISA MARBLE & CABINETS</div>

  <!-- MODAL APORTES -->
  <div id="modalAporte">
    <div class="modal-content">
      <h3>Aportar a SOP</h3>
      <div id="historialAportes" style="max-height:200px; overflow:auto; border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:10px;">Cargando historial...</div>
      <input type="hidden" id="aporte_id_sop">
      <select id="aporte_employee">
        <option value="">Seleccione empleado</option>
        <option value="Eliana Pineda|info@artemisamarble.com|Ventas|Comercial">Eliana Pineda - Ventas</option>
        <option value="Carlos Herrera|control@artemisamarble.com|Controller|Control">Carlos Herrera - Controller</option>
        <option value="Otros|otros|otros|otros">Otros</option>
      </select>
      <textarea id="aporte_comentario" placeholder="Comentario u observación" rows="4"></textarea>
      <input type="file" id="aporte_archivos" multiple>
      <div style="display:flex; gap:10px;">
        <button class="send" onclick="enviarAporte()">Enviar</button>
        <button class="cancel" onclick="cerrarAporte()">Cancelar</button>
      </div>
    </div>
  </div>

<script>
const SCRIPT_URL_SOP_ADMIN = "https://script.google.com/macros/s/AKfycby3ng7kFng6Xc7Zkg9ENkOnzKTMr9wwAZRgI-EebyCR3bsX1g0Tt44ASjvLcP0PQoC9/exec";

// =======================
// NOTIFICACIONES
// =======================
function mostrarNotificacion(msg, tipo) {
  const notif = document.createElement("div");
  notif.className = "notification " + tipo;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 4000);
}

// =======================
// ICONOS DE ARCHIVOS
// =======================
function iconoArchivo(link) {
  if (!link) return "";
  const url = link.toLowerCase();
  let icon = "📎";
  if (url.includes(".pdf")) icon = "📄";
  else if (url.match(/\.(jpg|jpeg|png|gif|webp)$/)) icon = "🖼";
  else if (url.match(/\.(xls|xlsx|csv)$/)) icon = "📊";

  // solo se muestra el icono, no la URL
  return `<a href="${link}" target="_blank" class="file-icon" title="${link.split('/').pop()}">${icon}</a>`;
}

// =======================
// RENDER TABLA SOP
// =======================
async function renderTabla() {
  const tabla = document.getElementById("tablaSOP");
  tabla.innerHTML = "";

  const filtroEstado = document.getElementById("filtroEstado").value;
  const buscar = document.getElementById("buscarSOP").value.toLowerCase();

  try {
    const res = await fetch(SCRIPT_URL_SOP_ADMIN);
    const data = await res.json();

    data.forEach(sop => {
      // FILTRO POR ESTADO
      if (filtroEstado && sop.estado !== filtroEstado) return;

      // FILTRO DE BÚSQUEDA (empleado + objetivo + departamento + areas)
      const texto = (sop.empleado + sop.objetivo + sop.departamento + sop.areas).toLowerCase();
      if (buscar && !texto.includes(buscar)) return;

      // CLASES DE ESTADO
      let estadoClass = "pendiente";
      if (sop.estado === "Trámite") estadoClass = "tramite";
      else if (sop.estado === "Rechazado") estadoClass = "rechazado";
      else if (sop.estado === "Aprobado") estadoClass = "aprobado";

      // ICONOS DE ARCHIVOS
      const archivosHTML = sop.links 
        ? sop.links.split(",").map(l => iconoArchivo(l.trim())).join(" ") 
        : "";

      // CREAR FILA CON ORDEN EXACTO DE ENCABEZADOS
  const fila = document.createElement("tr");
  fila.innerHTML = `
    <td>${sop.empleado || ""}</td>           <!-- empleado -->
    <td>${sop.departamento || ""}</td>     <!-- departamento -->
    <td>${sop.objetivo || ""}</td>         <!-- objetivo -->
    <td>${sop.areas || ""}</td>          <!-- areas -->
    <td>${sop.estado || ""}</td>           <!-- estado -->
    <td>${sop.Fecha || ""}</td>            <!-- fecha/hora -->
    <td>${iconoArchivo(sop.url)}</td>      <!-- archivos -->
    <td><button onclick="abrirAporte('${sop.Fecha}')">💬</button></td> <!-- aportar -->
`;
      tabla.appendChild(fila);
    });
  } catch (e) {
    console.error("Error cargando SOP:", e);
  }
}



// =======================
// MODAL APORTES
// =======================
function abrirAporte(id) {
  document.getElementById("modalAporte").style.display = "flex";
  document.getElementById("aporte_id_sop").value = id;
  cargarHistorial(id);
}

function cerrarAporte() {
  document.getElementById("modalAporte").style.display = "none";
  document.getElementById("aporte_comentario").value = "";
  document.getElementById("aporte_archivos").value = null;
  document.getElementById("aporte_employee").value = "";
}

// =======================
// ENVIAR APORTE
// =======================
async function enviarAporte() {
  const id = document.getElementById("aporte_id_sop").value;
  if (!id) { mostrarNotificacion("Error: SOP no identificado", "error"); return; }

  const valor = document.getElementById("aporte_employee").value;
  if (!valor) { mostrarNotificacion("Seleccione un empleado", "error"); return; }
  const datosEmpleado = valor.split("|");
  const nombre = datosEmpleado[0], correo = datosEmpleado[1], depto = datosEmpleado[3];

  const comentario = document.getElementById("aporte_comentario").value;
  if (!comentario) { mostrarNotificacion("Debe escribir un comentario", "error"); return; }

  await fetch(SCRIPT_URL_SOP_ADMIN, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      action:"guardarAporte",
      id_sop: id,
      empleado: nombre,
      correo: correo,
      departamento: depto,
      comentario: comentario,
      archivos: ""
    })
  });

  mostrarNotificacion("Aporte registrado correctamente", "success");
  cerrarAporte();
  renderTabla();
}

// =======================
// CARGAR HISTORIAL DE APORTES
// =======================
async function cargarHistorial(id) {
  const historial = document.getElementById("historialAportes");
  historial.innerHTML = "Cargando...";

  try {
    const res = await fetch(SCRIPT_URL_SOP_ADMIN + "?aportes=" + encodeURIComponent(id));
    const data = await res.json();

    if (!data.length) { historial.innerHTML = "Sin aportes aún"; return; }

    historial.innerHTML = data.map(a => `
      <div style="border-bottom:1px solid #eee; padding:6px 0;">
        <strong>${a.EMPLEADO}</strong><br>
        <small>${a.FECHA}</small><br>
        ${a.COMENTARIO || ""}
      </div>
    `).join("");
  } catch(e) {
    historial.innerHTML = "Error cargando historial";
  }
}

// =======================
// EVENTOS DE BÚSQUEDA Y FILTRO
// =======================
document.getElementById("buscarSOP").addEventListener("input", renderTabla);
document.getElementById("filtroEstado").addEventListener("change", renderTabla);

// =======================
// ADMIN LOGIN
// =======================
function adminLogin() {
  const password = prompt("Ingrese contraseña de administrador");
  if(password === "Artemisa2026") {
    window.location.href="/sop-site/admin/";
  } else {
    alert("Acceso denegado");
  }
}

// =======================
// INICIALIZACIÓN
// =======================
window.addEventListener("DOMContentLoaded", () => {
  // asegurar que el modal inicie oculto
  document.getElementById("modalAporte").style.display = "none";
  renderTabla();
});
</script>
  
</body>
</html>
