name: Generate SOP Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate SOP_INDEX.json
        run: |

          echo "[]" > SOP_INDEX.json

          # =========================
          # STOPWORDS (PALABRAS BASURA)
          # =========================
          STOPWORDS="and the under into dentro para bajo mayor menor esta esto el la los las de del a en con sin por to of in on at for from by y o"

          for area in */ ; do

            area=${area%/}

            case "$area" in
              .github|images|admin|biblioteca|analisis|Aportes|registrar-sop|sop-viewer-edit)
                continue
                ;;
            esac

            for dir in "$area"/SOP-*; do

              if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then

                sopname=$(basename "$dir")
                title=$(echo "$sopname" | sed 's/SOP-//' | tr '-' ' ')

                url="$dir/index.html"
                department="$area"

                # =========================
                # METAS HTML
                # =========================
                objective=$(grep -i 'meta name="objective"' "$dir/index.html" | sed -E 's/.*content="([^"]+)".*/\1/' || true)
                description=$(grep -i 'meta name="description"' "$dir/index.html" | sed -E 's/.*content="([^"]+)".*/\1/' || true)

                # =========================
                # LIMPIEZA HTML COMPLETA
                # =========================
                clean_text=$(cat "$dir/index.html" \
                  | sed 's/<script[^>]*>.*<\/script>//g' \
                  | sed 's/<style[^>]*>.*<\/style>//g' \
                  | sed 's/<[^>]*>/ /g' \
                  | tr '[:upper:]' '[:lower:]' \
                  | tr -s ' ')

                # =========================
                # SEARCH TEXT (ranking real)
                # =========================
                search_text=$(echo "$clean_text" \
                  | tr ' ' '\n' \
                  | grep -E '^[a-z]{4,}$' \
                  | grep -v -E "$(echo $STOPWORDS | sed 's/ /|/g')" \
                  | sort \
                  | uniq -c \
                  | sort -nr \
                  | head -40 \
                  | awk '{print $2}' \
                  | tr '\n' ' ')

                # =========================
                # KEYWORDS (limpias para filtros UI)
                # =========================
                keywords=$(echo "$search_text" \
                  | tr ' ' '\n' \
                  | sort -u \
                  | head -20 \
                  | tr '\n' ',' \
                  | sed 's/,$//')

                # =========================
                # JSON FINAL
                # =========================
                jq --arg title "$title" \
                   --arg department "$department" \
                   --arg keywords "$keywords" \
                   --arg objective "$objective" \
                   --arg description "$description" \
                   --arg searchText "$search_text" \
                   --arg url "$url" \
                   '. += [{
                      "title": $title,
                      "department": $department,
                      "keywords": $keywords,
                      "objective": $objective,
                      "description": $description,
                      "searchText": $searchText,
                      "url": $url
                   }]' \
                   SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

              fi
            done
          done

          jq 'sort_by(.department, .title)' SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add SOP_INDEX.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update SOP index"

          git pull --rebase origin main

          git push
