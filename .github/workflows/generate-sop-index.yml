name: Generate SOP Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate SOP_INDEX.json
        run: |

          echo "[]" > SOP_INDEX.json

          # buscar carpetas que contengan SOP-*
          for area in */ ; do

            area=${area%/}

            # saltar carpetas del sistema
            case "$area" in
              .github|images|admin|biblioteca|analisis|Aportes|registrar-sop|sop-viewer-edit)
                continue
                ;;
            esac

            # buscar SOP dentro del area
            for dir in "$area"/SOP-*; do

              if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then

                sopname=$(basename "$dir")

                title=$(echo "$sopname" | sed 's/SOP-//' | tr '-' ' ')

                keywords=$(echo "$title $area" | tr 'A-Z' 'a-z' | tr ' ' ',')

                url="$dir/index.html"

                department="$area"

                objective=$(grep -i 'meta name="objective"' "$dir/index.html" | sed -E 's/.*content="([^"]+)".*/\1/' || true)
                description=$(grep -i 'meta name="description"' "$dir/index.html" | sed -E 's/.*content="([^"]+)".*/\1/' || true)
                meta_keywords=$(grep -i 'meta name="keywords"' "$dir/index.html" | sed -E 's/.*content="([^"]+)".*/\1/' || true)

                content=$(cat "$dir/index.html" \
                  | sed 's/<script[^>]*>.*<\/script>//g' \
                  | sed 's/<style[^>]*>.*<\/style>//g' \
                  | sed 's/<[^>]*>/ /g' \
                  | tr '\n' ' ' \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed 's/&nbsp;/ /g' \
                  | tr -s ' ')

                jq --arg title "$title" \
                   --arg department "$department" \
                   --arg keywords "$keywords" \
                   --arg objective "$objective" \
                   --arg description "$description" \
                   --arg content "$content" \
                   --arg url "$url" \
                   '. += [{
                      "title": $title,
                      "department": $department,
                      "keywords": $keywords,
                      "objective": $objective,
                      "description": $description,

                      "search_text": (
                        ($title // "") + " " +
                        ($department // "") + " " +
                        ($keywords // "") + " " +
                        ($objective // "") + " " +
                        ($description // "") + " " +
                        ($content // "")
                      ),

                      "url": $url
                   }]' \
                   SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

              fi
            done
          done

          jq 'sort_by(.department, .title)' SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add SOP_INDEX.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Auto update SOP index"

          git pull --rebase origin main

          git push
