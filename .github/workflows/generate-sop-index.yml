name: Generate SOP Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
  
    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
  
    - name: Generate SOP_INDEX.json
      run: |
  
        echo "[]" > SOP_INDEX.json
  
        for area in $(find . -maxdepth 1 -type d); do
  
          area=${area#./}
  
          [ -z "$area" ] && continue
          [ "$area" = "." ] && continue
  
          case "$area" in
            .github|images|admin|biblioteca|analisis|Aportes|registrar-sop|sop-viewer-edit)
              continue
              ;;
          esac
  
          echo "Scanning area: $area"
  
          for dir in "$area"/SOP-*; do
  
            [ -d "$dir" ] || continue
  
            sopname=$(basename "$dir")
  
            title=$(echo "$sopname" | sed 's/^SOP-//' | tr '-' ' ')
  
            keywords=$(echo "$title $area" \
              | tr '[:upper:]' '[:lower:]' \
              | tr ' ' ',')
  
            url="$dir/index.html"
            department="$area"
  
            revision=$(git log --follow -1 \
              --format="%ad" \
              --date=format:"%Y-%m-%d" \
              -- "$dir/index.html" 2>/dev/null)
  
            [ -z "$revision" ] && revision=$(date +"%Y-%m-%d")
  
            content=$(cat "$dir/index.html" \
              | sed 's/<script[^>]*>.*<\/script>//g' \
              | sed 's/<style[^>]*>.*<\/style>//g' \
              | sed 's/<[^>]*>/ /g' \
              | tr '\n' ' ' \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/&nbsp;/ /g' \
              | tr -s ' ' \
              | cut -c1-10000)
  
            jq \
              --arg title "$title" \
              --arg department "$department" \
              --arg keywords "$keywords" \
              --arg revision "$revision" \
              --arg content "$content" \
              --arg url "$url" \
              '
              . += [{
                title: $title,
                department: $department,
                keywords: $keywords,
                revision: $revision,
                search_text:
                  (($title // "") + " " +
                   ($department // "") + " " +
                   ($keywords // "") + " " +
                   ($content // "")),
                url: $url
              }]
              ' SOP_INDEX.json > tmp.json
  
            mv tmp.json SOP_INDEX.json
  
          done
        done
  
        jq 'sort_by(.department, .title)' SOP_INDEX.json > tmp.json
        mv tmp.json SOP_INDEX.json
  
        echo "SOP_INDEX.json generated successfully"
  
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
  
        git add SOP_INDEX.json
  
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
  
        git commit -m "Update SOP_INDEX.json"
  
        git pull --rebase origin main
        git push
