name: Generate SOP Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate SOP_INDEX.json
        run: |

          echo "Starting SOP index generation..."
          echo "[]" > SOP_INDEX.json

          # Buscar carpetas de nivel 1 del repo
          for area in $(find . -maxdepth 1 -type d); do

            area=${area#./}

            # limpiar basura
            [ -z "$area" ] && continue
            [ "$area" = "." ] && continue

            # excluir carpetas del sistema
            case "$area" in
              .github|images|admin|biblioteca|analisis|Aportes|registrar-sop|sop-viewer-edit)
                continue
                ;;
            esac

            echo "📁 Scanning area: $area"

            # buscar SOPs dentro del area
            for dir in "$area"/SOP-*; do

              # evitar glob vacío o inválido
              [ -d "$dir" ] || continue

              echo "   🔎 Found SOP: $dir"

              sopname=$(basename "$dir")

              title=$(echo "$sopname" | sed 's/SOP-//' | tr '-' ' ')

              keywords=$(echo "$title $area" | tr 'A-Z' 'a-z' | tr ' ' ',')

              url="$dir/index.html"
              department="$area"

              # leer contenido HTML limpio
              content=$(cat "$dir/index.html" \
                | sed 's/<script[^>]*>.*<\/script>//g' \
                | sed 's/<style[^>]*>.*<\/style>//g' \
                | sed 's/<[^>]*>/ /g' \
                | tr '\n' ' ' \
                | tr '[:upper:]' '[:lower:]' \
                | sed 's/&nbsp;/ /g' \
                | tr -s ' ' \
                | cut -c1-10000)

              # construir JSON
              jq --arg title "$title" \
                 --arg department "$department" \
                 --arg keywords "$keywords" \
                 --arg content "$content" \
                 --arg url "$url" \
                 '
                 . += [{
                    "title": $title,
                    "department": $department,
                    "keywords": $keywords,
                    "search_text": (
                      ($title // "") + " " +
                      ($department // "") + " " +
                      ($keywords // "") + " " +
                      ($content // "")
                    ),
                    "url": $url
                 }]
                 ' SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

            done
          done

          # ordenar resultados
          jq 'sort_by(.department, .title)' SOP_INDEX.json > tmp.json && mv tmp.json SOP_INDEX.json

          echo "✅ SOP index generated successfully"

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add SOP_INDEX.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update SOP index"

          git pull --rebase origin main
          git push
