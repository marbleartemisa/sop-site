<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- FontAwesome (puede quedarse igual) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de SOP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* GLOBAL */
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background-image:url('/sop-site/wall0.png');
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;
    color:#1f2937;
}

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1100;
}
.logo{ display:flex; align-items:center; gap:10px; }
.logo img{ height:40px; }
.menu{ display:flex; gap:25px; }
.menu a{ color:white; text-decoration:none; font-weight:bold; transition:.3s; }
.menu a:hover{ color:#00aaff; }
.menu-toggle{ display:none; font-size:1.6rem; cursor:pointer; }
  
  .menu a.active {
  background: #003366;   /* color de fondo destacado */
  color: #fff;           /* texto blanco */
  border-radius: 6px;
  padding: 5px 10px;
}

/* OVERLAY Y TABLA */
.overlay { padding:20px; max-width:1200px; margin:auto;}
h2{ color:#003366; margin-bottom:15px; text-align:center;}
input, select, textarea{ padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; margin-bottom:10px;}
table{ width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
th, td{ padding:10px 12px; text-align:left; border-bottom:1px solid #ddd; vertical-align: middle;}
/* Ajuste columnas para comentarios y estado */
table th:nth-child(5), table td:nth-child(5) {
  width: 35%;       /* Comentarios más ancha */
  min-width: 180px; /* mínimo ancho para escribir */
}

table th:nth-child(6), table td:nth-child(6) {
  width: 15%;       /* Estado más ancho para mostrar completo */
}

td[contenteditable="true"] {
  min-height: 40px;        /* más alto para escribir varios renglones */
  white-space: pre-wrap;   /* permite que el texto haga wrap */
}

/* Que el select de Estado ocupe todo el ancho de la celda */
td select {
  width: 100%;
}
    
th{ background:#003366; color:white;}
button{ padding:8px 12px; border:none; border-radius:6px; cursor:pointer; background:#00aaff; color:white; font-weight:bold; transition:.3s;}
button:hover{ background:#0077aa;}
select{ width:100%;}

/* ESTADOS */
.estado{ display:inline-block; padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; text-transform:uppercase;}
.pendiente{background:#fff4cc; color:#b38f00;}
.aceptado{background:#e6f7ec;color:#1e7e34;}
.rechazado{background:#fdecea;color:#c62828;}
.preseleccionado{background:#fdecea;color:#c62828;}

.btn-filtro {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #00aaff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn-filtro:hover {
  background: #0077aa;
}

.btn-filtro.active {
  background: #003366; /* botón activo */
}
  
/* MODAL COMENTARIO */
#modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  justify-content:center;
  align-items:center;
  z-index:2000;
}
#modal-content{
  background: rgba(0,0,0,0.85);
  border-radius:14px;
  padding:20px;
  width:350px;
  color:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  gap:12px;
  animation: fadeIn 0.3s ease;
}
#modal h3{ margin:0; font-weight:600; text-align:center; color:#00aaff; }
#comentario-text{
  width:100%;
  height:120px;
  padding:12px;
  border:none;
  border-radius:10px;
  background: rgba(255,255,255,0.15);
  color:#fff;
  resize:vertical;
  font-size:15px;
  transition: all 0.2s ease;
}
#comentario-text:focus{ background: rgba(255,255,255,0.25); outline:none; }
#comentario-text::placeholder{ color: #ddd; font-style:italic; }
#btn-save, #btn-cancel{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition: all 0.2s ease;
}
#btn-save{ background:#00d1ff; color:white; }
#btn-save:hover{ background:#00a8cc; }
#btn-cancel{ background:#555; color:white; }
#btn-cancel:hover{ background:#333; }

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}
  th{
  cursor:pointer;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>

  <div class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </div>

<div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a> 
    <a href="/sop-site/analisis/">Análisis SOP</a> 
    <a href="#" onclick="editSOP()">Editar SOP</a>
    <a href="https://marbleartemisa.github.io/artemisamarbleandcabinet/#">Portal-Web</a> 
  </div>

  <!-- ✅ Mover user-info fuera de menu -->
  <div class="user-info" id="userInfo" style="display:none;">
    <span id="userName"></span>
    <button onclick="logout()" title="Cerrar sesión" style="background:none;border:none;color:white;cursor:pointer;margin-left:10px;">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>

</div>


<!-- OVERLAY ANALISIS -->
<div class="overlay">
  <h2>Análisis de SOP - Rev 1.0</h2>

  <label for="selectSOP">Seleccionar SOP:</label>
  <select id="selectSOP">
    <option value="">Seleccione SOP</option>
  </select>
  
<div class="table-container">

  <!-- BOTONES DE FILTRO -->
 <div id="filtrosEstado" style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
    <button class="btn-filtro" data-estado="">Todos</button>
    <button class="btn-filtro" data-estado="Pendiente">Pendiente</button>
    <button class="btn-filtro" data-estado="Aceptado">Aprobado</button>
    <button class="btn-filtro" data-estado="Rechazado">Rechazado</button>
    <button class="btn-filtro" data-estado="Preseleccionado">Preseleccionado</button>
  </div>
    <table>
      <thead>
        <tr>
          <th onclick="sortTable(0)">#</th>
          <th onclick="sortTable(1)">Punto (Español)</th>
          <th onclick="sortTable(2)">Punto (Inglés)</th>
          <th onclick="sortTable(3)">Usuario</th>
          <th onclick="sortTable(4)">Comentarios</th>
          <th onclick="sortTable(5)">Estado</th>
        </tr>
      </thead>
      <tbody id="tablaPuntos"></tbody>
    </table>
  </div>

</div>

<!-- MODAL COMENTARIO -->
<div id="modal">
  <div id="modal-content">
    <h3>Editar Comentario</h3>
    <textarea id="comentario-text" placeholder="Escribe tu comentario..."></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:9999;">
  <div style="background:#1e1e2f;padding:30px;border-radius:12px;width:90%;max-width:350px;text-align:center;color:white;">
    <h3>Iniciar sesión</h3>
    <select id="loginUser" style="width:100%;padding:10px;margin-bottom:10px;border-radius:6px;"></select>
    <input type="password" id="loginPass" placeholder="Clave" style="width:100%;padding:10px;margin-bottom:10px;border-radius:6px;">
    <div id="loginError" style="color:red;display:none;">Datos incorrectos</div>
    <button onclick="login()">Entrar</button>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

let currentUser = null;
const usuarios = [
  {usuario:"Damian Molina", clave:"Dam1975", rol:"editor", correo:"damian@artemisamarble.com"},
  {usuario:"Alberto Molina", clave:"Alb1975", rol:"editor", correo:"frontdesk@artemisamarble.com"},
  {usuario:"Wendy Romanach", clave:"Wen1975", rol:"editor", correo:"accounting@artemisamarble.com"},
  {usuario:"Carlos Herrera", clave:"Art2026", rol:"admin", correo:"control@artemisamarble.com"},
  {usuario:"Jenny Perez", clave:"Jen1975", rol:"editor", correo:"jenny@artemisamarble.com"},
  {usuario:"Yozusi Urdaneta", clave:"Yoz1975", rol:"editor", correo:"wood@artemisamarble.com"}
];


let puntos = [];
let currentSOP = null;
let currentSortColumn = null;
let sortDirection = 1;

// POPULAR SELECT USUARIOS
function populateUsers(){
  const select = document.getElementById("loginUser");
  select.innerHTML = '<option value="">Seleccione usuario</option>';
  usuarios.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.usuario;
    opt.textContent = u.usuario;
    select.appendChild(opt);
  });
}

// LOGIN
function login(){
  const userName = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const user = usuarios.find(u=>u.usuario===userName && u.clave===pass);
  if(user){
    currentUser = user;
    localStorage.setItem("usuario", user.usuario);
    localStorage.setItem("correo", user.correo);
    closeLogin();
    mostrarUsuario(user);
  }else{
    document.getElementById("loginError").style.display = "block";
  }
}
function openLogin(){ document.getElementById("loginModal").style.display = "flex"; }
function closeLogin(){ document.getElementById("loginModal").style.display = "none"; }
function mostrarUsuario(user){
  const userInfo = document.getElementById("userInfo");
  const userName = document.getElementById("userName");
  if(user){ userName.textContent = user.usuario; userInfo.style.display="flex"; }
  else userInfo.style.display="none";
}

  function logout(){
  currentUser = null;
  localStorage.removeItem("usuario");
  document.getElementById("userInfo").style.display = "none";
window.location.href = "https://marbleartemisa.github.io/sop-site/";
}

// CARGAR SOPS

    async function cargarSOPs(){
  try{
    const res = await fetch(`${SHEET_API}?listarSOPs=true`);
    const data = await res.json();
    const select = document.getElementById("selectSOP");
    select.innerHTML = '<option value="">Seleccione SOP</option>';
    data.forEach(row=>{
      if(row.Id_Sop_Analisis){   // usa exactamente el nombre de columna
        const opt = document.createElement("option");
        opt.value = row.Id_Sop_Analisis;  
        opt.textContent = row.Nombre_SOP; 
        select.appendChild(opt);
      }
    });
  }catch(e){ console.error(e); alert("Error cargando SOPs"); }
}

// CARGAR PUNTOS PARA EL SOP SELECCIONADO
async function cargarPuntos(idSOP){
  currentSOP = idSOP;
  const tabla = document.getElementById("tablaPuntos");
  tabla.innerHTML = ""; // limpiar tabla

  if(!idSOP) return;

  try{
    const res = await fetch(`${SHEET_API}?analisis=${idSOP}`);

    puntos = (await res.json()).map(p => ({
      ...p,
      Id_Punto: (p.Id_Punto || p.ID_Punto || "").toString().trim()
    }));

    console.log("Puntos recibidos del backend:", puntos);

    if(!puntos || puntos.length === 0){
      tabla.innerHTML = `<tr><td colspan="7" style="text-align:center;">No hay puntos para este SOP</td></tr>`;
      return;
    }

    // ✅ AQUÍ está el cambio clave
    renderTabla();

  }catch(e){
    console.error("Error cargando puntos:", e);
    tabla.innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Error cargando puntos</td></tr>`;
  }
}


// EVENTOS
document.getElementById("selectSOP").addEventListener("change",(e)=>cargarPuntos(e.target.value));
window.addEventListener("DOMContentLoaded", ()=>{
  populateUsers();
  cargarSOPs();
  const savedUser = localStorage.getItem("usuario");
  if(savedUser){
    currentUser = usuarios.find(u=>u.usuario===savedUser);
    if(currentUser) mostrarUsuario(currentUser);
  }else openLogin();
});    


// 🔹 GUARDAR CAMBIOS DE UNA FILA
document.getElementById("tablaPuntos").addEventListener("click", async (e) => {
  if (!e.target.closest(".btn-save-row")) return;

  const fila = e.target.closest("tr");
  const idPunto = fila.dataset.id;

  const punto = puntos.find(p =>
      String(p.Id_Punto).trim() === String(idPunto).trim()
    );
  if (!punto) {
  console.error("Id_Punto no encontrado:", idPunto);
  return alert("Error: Id_Punto inválido");
}

  if (!punto) return alert("Fila no encontrada");
  if (!currentUser) return alert("Debes iniciar sesión");
  if (!punto.Id_Punto && !punto.ID_Punto) return alert("Error: Id_Punto no existe");

const dataFila = {
  Id_Punto: punto.Id_Punto,
  Id_Sop_Analisis: currentSOP,

  // ❌ YA NO mandes Usuario original
  // Usuario: currentUser.usuario,

  // ❌ YA NO mandes Fecha original
  // Fecha: new Date(),

  // ✅ NUEVO
  Usuario_Update: currentUser.usuario,
  Fecha_Update: new Date().toLocaleString(),

  Texto_Punto: fila.cells[1].innerText.trim(),
   Texto_Ingles: fila.cells[2].innerText.trim(),
  Comentarios: fila.cells[4].innerText.trim(),
  Estado: fila.cells[5].querySelector("select").value
};

  console.log("📤 Enviando ID:", punto.Id_Punto);



  
  try {
    const res = await fetch(SHEET_API,{
  method:"POST",
  body: JSON.stringify({
    tipo:"analisis",
    id_sop: currentSOP,
    puntos: [dataFila]
  })
});
    const result = await res.json();
    console.log("📥 Respuesta backend:", result);

   if (res.ok && result.success) {

  // 🔹 Actualizar el estado en memoria
  punto.Estado = dataFila.Estado;
  punto.Texto_Punto = dataFila.Texto_Punto;
  punto.Texto_Ingles = dataFila.Texto_Ingles;
  punto.Comentarios = dataFila.Comentarios;

  // 🔹 Re-render tabla
  renderTabla();

  alert("Fila guardada correctamente!");
} else {
      console.error("❌ Error guardando fila:", result);
      alert("Error guardando fila, revisa consola");
    }

  } catch (err) {
    console.error("🚨 Error en fetch POST:", err);
    alert("Error guardando fila (fetch fallido)");
  }
});  



  
// MODAL COMENTARIO
function cerrarModal(){ document.getElementById("modal").style.display="none"; }


  function renderTabla(){
  const tabla = document.getElementById("tablaPuntos");
  tabla.innerHTML = "";

 // 🔹 FILTRAR según botón activo
const visibles = puntos.filter(p => {
  if (!filtroEstadoActual) return true; // todos
  return p.Estado === filtroEstadoActual;
});

  // 🔹 Si no hay datos visibles
  if(visibles.length === 0){
    tabla.innerHTML = `<tr><td colspan="7" style="text-align:center;">No hay registros activos</td></tr>`;
    return;
  }

  visibles.forEach((punto, idx)=>{
    const fila = document.createElement("tr");
    fila.dataset.id = punto.Id_Punto;

    fila.innerHTML = `
      <td>${idx+1}</td>
      <td contenteditable="true" spellcheck="false">${punto.Texto_Punto || ''}</td>
      <td contenteditable="true" spellcheck="false">${punto.Texto_Ingles || ''}</td>
      <td>${punto.Usuario || ''}</td>
      <td contenteditable="true" spellcheck="false">${punto.Comentarios || ''}</td>
      <td>
        <select>
          <option value="Pendiente" ${punto.Estado==='Pendiente'?'selected':''}>Pendiente</option>
          <option value="Aceptado" ${punto.Estado==='Aceptado'?'selected':''}>Aceptado</option>
          <option value="Rechazado" ${punto.Estado==='Rechazado'?'selected':''}>Rechazado</option>
          <option value="Preseleccionado" ${punto.Estado==='Preseleccionado'?'selected':''}>Preseleccionado</option>
        </select>
      </td>
      <td>
        <button class="btn-save-row">
          <i class="fa-solid fa-floppy-disk"></i>
        </button>
      </td>
    `;

    tabla.appendChild(fila);
  });
}


  
  function sortTable(colIndex){

  if(currentSortColumn === colIndex){
    sortDirection *= -1;
  }else{
    currentSortColumn = colIndex;
    sortDirection = 1;
  }

  puntos.sort((a,b)=>{

    let valA="", valB="";

    if(colIndex===1){ valA = a.Texto_Punto || ""; valB = b.Texto_Punto || ""; }
    if(colIndex===2){ valA = a.Texto_Ingles || ""; valB = b.Texto_Ingles || ""; }
    if(colIndex===3){ valA = a.Usuario || ""; valB = b.Usuario || ""; }
    if(colIndex===4){ valA = a.Comentarios || ""; valB = b.Comentarios || ""; }
    if(colIndex===5){ valA = a.Estado || ""; valB = b.Estado || ""; }

    valA = valA.toString().toLowerCase();
    valB = valB.toString().toLowerCase();

    if(valA < valB) return -1 * sortDirection;
    if(valA > valB) return 1 * sortDirection;
    return 0;
  });

  renderTabla();
}

  // 🔹 Destacar opción de menú según URL
function destacarMenu() {
  const links = document.querySelectorAll(".menu a");
  const path = window.location.pathname; // ruta actual
  links.forEach(link => {
    if (link.getAttribute("href") === path) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  destacarMenu();
});

  let filtroEstadoActual = ""; // estado seleccionado por los botones

const botones = document.querySelectorAll(".btn-filtro");
botones.forEach(btn => {
  btn.addEventListener("click", () => {
    filtroEstadoActual = btn.dataset.estado; // actualizar filtro

    // quitar clase active de todos
    botones.forEach(b => b.classList.remove("active"));
    // marcar este como activo
    btn.classList.add("active");

    renderTabla();
  });
});
  
</script>
</body>
</html>
