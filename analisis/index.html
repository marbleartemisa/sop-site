<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Análisis de SOP Rev 1.0</title>

<link rel="stylesheet" href="style.css?v=20260402-1015">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="overlay">
  <h2>Análisis de SOP - Rev 1.0</h2>

  <select id="selectSOP">
    <option value="">Seleccione SOP</option>
  </select>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Español</th>
        <th>Inglés</th>
        <th>Usuario</th>
        <th>Comentarios</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tablaPuntos"></tbody>
  </table>

  <button onclick="guardarAnalisis()">💾 Guardar</button>
</div>

<script>
const SHEET_API = "TU_URL_APPS_SCRIPT";

let puntos = [];
let currentSOP = null;

/* =========================
   CARGAR SOPS
========================= */
async function cargarSOPs(){
  try{
    const res = await fetch(`${SHEET_API}?listarSOPs=true`);
    const data = await res.json();

    const select = document.getElementById("selectSOP");
    select.innerHTML = '<option value="">Seleccione SOP</option>';

    data.forEach(row=>{
      if(row.Id_Sop_Analisis){
        const opt = document.createElement("option");
        opt.value = row.Id_Sop_Analisis;
        opt.textContent = row.Nombre_SOP;
        select.appendChild(opt);
      }
    });

  }catch(e){
    console.error(e);
    alert("Error cargando SOPs");
  }
}

/* =========================
   CARGAR PUNTOS
========================= */
async function cargarPuntos(idSOP){
  currentSOP = idSOP;
  const tabla = document.getElementById("tablaPuntos");
  tabla.innerHTML = "";

  if(!idSOP) return;

  try{
    const res = await fetch(`${SHEET_API}?analisis=${idSOP}`);
    puntos = await res.json();

    if(!puntos || puntos.length === 0){
      tabla.innerHTML = `<tr><td colspan="6">No hay puntos</td></tr>`;
      return;
    }

    puntos.forEach((p, i)=>{
      const fila = document.createElement("tr");

      fila.innerHTML = `
        <td>${i+1}</td>
        <td contenteditable="true">${p.Texto_Punto || ''}</td>
        <td contenteditable="true">${p.Texto_Ingles || ''}</td>
        <td>${p.Usuario || ''}</td>
        <td contenteditable="true">${p.Comentarios || ''}</td>
        <td>
          <select>
            <option ${p.Estado==="Pendiente"?"selected":""}>Pendiente</option>
            <option ${p.Estado==="Aceptado"?"selected":""}>Aceptado</option>
            <option ${p.Estado==="Rechazado"?"selected":""}>Rechazado</option>
          </select>
        </td>
      `;

      tabla.appendChild(fila);
    });

  }catch(e){
    console.error(e);
    tabla.innerHTML = `<tr><td colspan="6">Error cargando</td></tr>`;
  }
}

/* =========================
   GUARDAR
========================= */
async function guardarAnalisis(){

  if(!currentSOP){
    alert("Selecciona un SOP");
    return;
  }

  if(!puntos || puntos.length === 0){
    alert("No hay datos");
    return;
  }

  const filas = document.querySelectorAll("#tablaPuntos tr");
  const puntosAGuardar = [];

  filas.forEach((fila, idx)=>{

    const punto = puntos[idx];
    if(!punto) return;

    const selectEstado = fila.cells[5]?.querySelector("select");

    puntosAGuardar.push({
      Id_Punto: punto?.ID_Punto || punto?.Id_Punto || "",
      Id_Sop_Analisis: currentSOP,
      Usuario: punto.Usuario || "",
      Fecha: punto.Fecha || "",
      Texto_Punto: fila.cells[1]?.innerText.trim() || "",
      Texto_Ingles: fila.cells[2]?.innerText.trim() || "",
      Comentarios: fila.cells[4]?.innerText.trim() || "",
      Estado: selectEstado ? selectEstado.value : "Pendiente"
    });

  });

  console.log("Payload:", puntosAGuardar);

  try{
    const res = await fetch(SHEET_API,{
      method:"POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tipo:"analisis",
        id_sop: currentSOP,
        puntos: puntosAGuardar
      })
    });

    const text = await res.text();
    console.log("RAW:", text);

    let result;
    try{
      result = JSON.parse(text);
    }catch(e){
      alert("Respuesta inválida del servidor");
      return;
    }

    if(result.success){
      alert("Guardado correcto");
    }else{
      console.error(result);
      alert("Error guardando");
    }

  }catch(e){
    console.error(e);
    alert("Error conexión");
  }
}

/* =========================
   EVENTOS
========================= */
document.getElementById("selectSOP")
  .addEventListener("change", e => cargarPuntos(e.target.value));

window.addEventListener("DOMContentLoaded", cargarSOPs);
</script>

</body>
</html>
