<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar SOP - ARTEMISA MARBLE & CABINETS</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:30px;}
label{display:block;margin-top:15px;font-weight:bold;}
input,textarea,select{width:100%;padding:10px;margin-top:5px;border-radius:5px;border:1px solid #ccc;}
button{margin-top:20px;padding:12px 20px;background:#0072C6;color:white;border:none;border-radius:5px;cursor:pointer;}
.notification{position:fixed;top:20px;right:20px;padding:15px;border-radius:8px;color:white;font-weight:bold;z-index:9999;opacity:0.95;}
.notification.success{background:#28a745;}
.notification.error{background:#dc3545;}
.spinner{display:none;margin-left:10px;}
</style>
</head>
<body>

<h2>Registrar Solicitud de SOP</h2>
<form id="sopForm" enctype="multipart/form-data">
  <label>Empleado</label>
  <input type="text" id="employee" placeholder="Nombre completo" required>
  <label>Correo</label>
  <input type="email" id="correo" placeholder="Correo electrónico" required>
  <label>Cargo</label>
  <input type="text" id="cargo" placeholder="Cargo" required>
  <label>Departamento</label>
  <input type="text" id="departamento" placeholder="Departamento" required>
  <label>Objetivo</label>
  <input type="text" id="objetivo" placeholder="Objetivo del SOP" required>
  <label>Áreas involucradas</label>
  <input type="text" id="areas" placeholder="Áreas o roles" required>
  <label>Resumen</label>
  <textarea id="resumen" rows="4" placeholder="Resumen de instrucciones" required></textarea>
  <label>Adjuntar archivos (PDF o imágenes)</label>
  <input type="file" id="archivos" multiple>
  <button type="submit">Enviar <span class="spinner">⏳</span></button>
</form>

<script>
emailjs.init("iR8ieJnOkI4_sr8TH"); // tu clave EmailJS
const SCRIPT_URL = "TU_SCRIPT_DOPOST_URL_AQUI"; // Script viejo que funciona

// Convertir archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file=>{
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve({name:file.name,data:reader.result,type:file.type});
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }));
}

document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = this.querySelector("button");
  const spinner = btn.querySelector(".spinner");
  btn.disabled = true; spinner.style.display="inline-block";

  const employee = document.getElementById("employee").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const cargo = document.getElementById("cargo").value.trim();
  const departamento = document.getElementById("departamento").value.trim();
  const objetivo = document.getElementById("objetivo").value.trim();
  const areas = document.getElementById("areas").value.trim();
  const resumen = document.getElementById("resumen").value.trim();
  const fecha = new Date().toLocaleString();
  const filesInput = document.getElementById("archivos");

  let files = [];
  if(filesInput.files.length > 0){
    files = await archivosA_Base64(filesInput.files);
  }

  // Enviar a Google Apps Script
  let links = [];
  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      body: JSON.stringify({employee, correo, cargo, departamento, objetivo, areas, resumen, date: fecha, files}),
    });
    const data = await res.json();
    links = data.links || [];
  }catch(err){
    alert("Error subiendo archivos al Drive.");
    console.error(err);
    btn.disabled = false; spinner.style.display="none";
    return;
  }

  // Enviar EmailJS
  let filesHTML = links.map(link=>`<p>📎 <a href="${link}">${link}</a></p>`).join("");
  emailjs.send("service_vkt5xuo","template_vc7447e",{employee, department:departamento, cargo, objective:objetivo, areas, summary:resumen, date:fecha, files:filesHTML})
  .then(()=>alert("Solicitud enviada correctamente!"))
  .catch(err=>{console.error(err); alert("Error enviando correo.");});

  btn.disabled = false; spinner.style.display="none";
  this.reset();
});
</script>
</body>
</html>
