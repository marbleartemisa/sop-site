<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  h2 { text-align:center; margin-top:20px; }

  #sop-container {
    position: relative;
    width: 90%;
    max-width: 1200px;
    margin: 20px auto;
    border: 1px solid #ccc;
    background:#fff;
    overflow:auto;
    padding:20px;
  }

  #sop-content { position: relative; }

  .comentario {
    position: absolute;
    color: #2563eb;
    background: rgba(255,255,255,0.9);
    padding:4px 6px;
    border-radius:5px;
    font-size:12px;
    font-style: italic;
    border:1px solid #2563eb;
    cursor: pointer;
    max-width: 200px;
    word-wrap: break-word;
  }

  /* Modal comentario */
  #modal {
    display:none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:1000;
  }
  #modal-content {
    background:#fff;
    padding:20px;
    border-radius:5px;
    width:300px;
  }
  #comentario-text { width:100%; height:80px; }

  #btn-save, #btn-cancel { margin-top:10px; margin-right:5px; padding:6px 12px; cursor:pointer; }

  /* Overlay click para comentario */
  #click-overlay {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    cursor: crosshair;
    z-index:900;
    display:none;
  }
</style>
</head>
<body>

<h2>Leer y Comentar SOP</h2>

<div id="sop-container">
  <div id="sop-content"></div>
  <div id="click-overlay"></div>
</div>

<!-- Modal para escribir comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

// Configura aquí el SOP que quieres cargar
const SOP_URL = "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html"; 
const ID_SOP = "SOP-1774461381359-0";
const USUARIO = "TuNombre"; 
const CORREO = "tucorreo@empresa.com";

let clickX = 0;
let clickY = 0;
let overlay = document.getElementById("click-overlay");
let modal = document.getElementById("modal");
let sopContent = document.getElementById("sop-content");

// Cargar SOP
async function cargarSOP() {
  try {
    const res = await fetch(SOP_URL);
    const html = await res.text();
    sopContent.innerHTML = html;

    // Activar overlay de click
    sopContent.parentElement.addEventListener("click", activarComentario);

    // Cargar comentarios existentes
    cargarComentariosExistentes();
  } catch(err) {
    sopContent.innerHTML = "<p style='color:red;'>No se pudo cargar el SOP.</p>";
    console.error(err);
  }
}

// Activar modal para comentario
function activarComentario(e) {
  if(e.target.classList.contains("comentario")) return; // no abrir modal sobre comentario existente

  const rect = sopContent.getBoundingClientRect();
  clickX = e.clientX - rect.left + sopContent.parentElement.scrollLeft;
  clickY = e.clientY - rect.top + sopContent.parentElement.scrollTop;

  modal.style.display = "flex";
}

// Guardar comentario
document.getElementById("btn-save").addEventListener("click", async () => {
  const texto = document.getElementById("comentario-text").value.trim();
  if(!texto) return alert("Escribe algo antes de guardar");

  const div = document.createElement("div");
  div.className = "comentario";
  div.style.left = clickX + "px";
  div.style.top = clickY + "px";
  div.textContent = texto;
  sopContent.appendChild(div);

  modal.style.display = "none";
  document.getElementById("comentario-text").value = "";

  // Guardar en Sheet
  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: clickX,
        y: clickY,
        page: 1,
        url_doc: SOP_URL
      })
    });
    console.log("Comentario guardado en Sheet");
  } catch(err) {
    console.error("Error guardando comentario:", err);
  }
});

// Cancelar comentario
document.getElementById("btn-cancel").addEventListener("click", () => {
  modal.style.display = "none";
  document.getElementById("comentario-text").value = "";
});

// Cargar comentarios existentes
async function cargarComentariosExistentes() {
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    data.forEach(c => {
      const div = document.createElement("div");
      div.className = "comentario";
      div.style.left = c.x + "px";
      div.style.top = c.y + "px";
      div.textContent = c.comentario;
      sopContent.appendChild(div);
    });
  } catch(err) {
    console.error("Error cargando comentarios:", err);
  }
}

// Iniciar
cargarSOP();
</script>

</body>
</html>
