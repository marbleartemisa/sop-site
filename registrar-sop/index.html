<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar SOP - ARTEMISA MARBLE & CABINETS</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;padding:20px;background:#f0f0f0;}
.container{max-width:700px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
input,textarea,select,button{width:100%;margin:8px 0;padding:10px;font-size:1rem;border-radius:8px;border:1px solid #ccc;}
button{background:#0072C6;color:white;font-weight:bold;border:none;cursor:pointer;}
.notification{position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:12px;color:white;z-index:9999;}
.notification.success{background:#28a745;}
.notification.error{background:#dc3545;}
</style>
</head>
<body>
<div class="container">
<h2>Registrar Solicitud de SOP</h2>
<form id="sopForm" enctype="multipart/form-data">
  <label>Empleado</label>
  <select id="employee" required>
    <option value="">Seleccione empleado</option>
    <option value="Yoandry Perez|yoandry@artemisamarble.com|Manager|Producción">Yoandry Perez</option>
    <option value="Otros|otros|otros|otros">Otros</option>
  </select>

  <input type="text" id="departamento" placeholder="Área / Departamento" required>
  <input type="text" id="objetivo" placeholder="Objetivo del SOP" required>
  <input type="text" id="areas" placeholder="Áreas o roles involucrados" required>
  <textarea id="resumen" rows="4" placeholder="Resumen de instrucciones" required></textarea>
  <label>Adjuntar archivos (PDF o imágenes)</label>
  <input type="file" id="archivos" multiple>

  <button type="submit">Enviar Solicitud</button>
</form>
</div>

<script>
emailjs.init("iR8ieJnOkI4_sr8TH"); // tu userID EmailJS
const SCRIPT_URL_DRIVE = "TU_SCRIPT_URL_DRIVE"; // Apps Script para subir archivos
const GOOGLE_FORM_URL = "TU_GOOGLE_FORM_URL"; // Google Form asociado al Sheet

// Autocompleta departamento
document.getElementById("employee").addEventListener("change", function(){
  let datos = this.value.split("|");
  document.getElementById("departamento").value = datos[3] || "";
});

// Archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file => new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve({name:file.name,data:reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  })));
}

// Subir archivos a Drive y obtener links
async function subirArchivosDrive(files, nombre){
  let archivosBase64 = await archivosA_Base64(files);
  let res = await fetch(SCRIPT_URL_DRIVE, {
    method: "POST",
    body: JSON.stringify({employee:nombre, files:archivosBase64})
  });
  let data = await res.json();
  return data.links; // Array de URLs de archivos subidos
}

// Notificaciones
function mostrarNotificacion(msg, tipo){
  const notif = document.createElement("div");
  notif.className = "notification " + tipo;
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(()=>notif.remove(),4000);
}

// Envío formulario
document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault();

  let datosEmpleado = document.getElementById("employee").value.split("|");
  let nombre = datosEmpleado[0], correo = datosEmpleado[1], cargo = datosEmpleado[2], deptoForm = document.getElementById("departamento").value;
  let objetivo = document.getElementById("objetivo").value.trim();
  let areas = document.getElementById("areas").value.trim();
  let resumen = document.getElementById("resumen").value.trim();

  if(!nombre || !deptoForm || !objetivo || !areas || !resumen){
    mostrarNotificacion("Complete todos los campos obligatorios","error"); return;
  }

  // Subir archivos a Drive
  let archivosInput = document.getElementById("archivos");
  let linksDrive = [];
  if(archivosInput.files.length > 0){
    try{
      linksDrive = await subirArchivosDrive(archivosInput.files,nombre);
    }catch(e){ console.error(e); mostrarNotificacion("Error subiendo archivos","error"); return; }
  }

  // Enviar EmailJS
  let filesHTML = linksDrive.map(l => `<p>📎 <a href="${l}">${l}</a></p>`).join("");
  emailjs.send("service_vkt5xuo","template_vc7447e",{
    employee:nombre,
    department:deptoForm,
    cargo:cargo,
    objective:objetivo,
    areas:areas,
    summary:resumen,
    date: new Date().toLocaleString(),
    files:filesHTML
  }).then(()=>mostrarNotificacion("Correo enviado correctamente","success"))
    .catch(e=>{console.error(e); mostrarNotificacion("Error enviando correo","error")});

  // Enviar datos a Google Form
  try{
    const formData = new FormData();
    formData.append("entry.1393360085", nombre);
    formData.append("entry.1363198453", correo);
    formData.append("entry.1941994843", deptoForm);
    formData.append("entry.1015716567", objetivo);
    formData.append("entry.949214050", areas);
    formData.append("entry.619270886", resumen);
    formData.append("entry.1989031957", "Pendiente");
    formData.append("entry.1877018002", linksDrive.join(", "));
    fetch(GOOGLE_FORM_URL, {method:"POST", body:formData, mode:"no-cors"});
  }catch(e){ console.error("Error enviando a Google Form:",e);}

  this.reset();
});
</script>
</body>
</html>
