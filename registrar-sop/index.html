<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar SOP - ARTEMISA MARBLE & CABINETS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
/* --- Tu CSS actual --- */
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:url('/sop-site/wall5.png') no-repeat center top;background-size:cover;}
.overlay{background:rgba(0,0,0,0.25);min-height:100vh;}
.navbar{position:sticky;top:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);padding:10px 30px;color:white;font-weight:bold;display:flex;justify-content:space-between;align-items:center;z-index:999;font-family:'Nuevo','Segoe UI',Arial;}
.logo{display:flex;align-items:center;gap:10px;}
.logo img{height:40px;}
.menu{display:flex;gap:25px;}
.menu a{color:white;text-decoration:none;font-weight:bold;transition:.3s;}
.menu a:hover{color:#00aaff;transform:scale(1.05);}
.menu-toggle{display:none;font-size:1.6rem;cursor:pointer;}
.container{max-width:900px;margin:50px auto;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:30px;border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,0.3);}
h1{text-align:center;margin-bottom:25px;color:#003366;}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;font-size:1rem;height:46px;}
textarea{height:auto;}
button{padding:12px;border:none;border-radius:30px;background:linear-gradient(135deg,#0072C6,#005a9e);color:white;font-weight:bold;cursor:pointer;transition:.3s;}
button:hover{transform:scale(1.05);}
.spinner{margin-left:8px;}
</style>
</head>
<body>
<div class="overlay">

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>
  <div class="menu-toggle" onclick="document.querySelector('.menu').classList.toggle('show')">
    <i class="fa-solid fa-bars"></i>
  </div>
  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/biblioteca/">Biblioteca SOP</a>
  </div>
</div>

<!-- FORMULARIO -->
<div class="container">
<h1>Registrar Solicitud de SOP</h1>
<form id="sopForm" enctype="multipart/form-data">
  <label>Empleado</label>
  <select id="employee" required>
    <option value="">Seleccione empleado</option>
    <option value="Damian Molina|damian@artemisamarble.com|Presidente|Ventas">Damian Molina - Presidente</option>
    <option value="Alberto Molina|frontdesk@artemisamarble.com|Frontdesk|Administracion">Alberto Molina - Frontdesk</option>
    <option value="Gabriel Batista|sales@artemisamarble.com|Ventas|Comercial">Gabriel Batista - Ventas</option>
    <option value="Yoandry Perez|yoandry@artemisamarble.com|Manager|Producción">Yoandry Perez - Manager</option>
    <option value="Otros|otros|otros|otros">Otros</option>
  </select>

  <input type="text" id="departamento" placeholder="Área / Departamento" required>
  <input type="text" id="objetivo" placeholder="Objetivo del SOP" required>
  <input type="text" id="areas" placeholder="Áreas o roles involucrados" required>
  <textarea id="resumen" rows="4" placeholder="Resumen de instrucciones" required></textarea>
  <label>Adjuntar archivos (PDF o imágenes)</label>
  <input type="file" id="archivos" multiple>
  <button type="submit" id="btnEnviar">
    <span class="btn-text">Registrar Solicitud</span>
    <span class="spinner" style="display:none;"><i class="fa fa-spinner fa-spin"></i></span>
  </button>
</form>
</div>

<script>
emailjs.init("iR8ieJnOkI4_sr8TH")  // tu public key EmailJS
const SCRIPT_URL_DRIVE = "https://script.google.com/macros/s/AKfycbxLLA3xgTVKaLAlyDOy8fHwFm5mWzqY4PkfIqd8p_ELB49q4m2He3NxGBW3Op2WWLmnYw/exec"
const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfIpOjZ5UeyaG0qjD43m49iIp_DRuD7l-Eg8feh1OMwMWAS2w/formResponse"

// Convertir archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file => new Promise((resolve,reject)=>{
    const reader = new FileReader()
    reader.onload = () => resolve({name:file.name, data:reader.result})
    reader.onerror = reject
    reader.readAsDataURL(file)
  })))
}

// Subir archivos a Google Drive y retornar links
async function subirArchivosDrive(files, nombre){
  if(files.length === 0) return []
  let archivosBase64 = await archivosA_Base64(files)
  let response = await fetch(SCRIPT_URL_DRIVE, {
    method:"POST",
    body: JSON.stringify({employee:nombre, files:archivosBase64})
  })
  let data = await response.json()
  return data.links
}

// Función para enviar formulario de Google
async function enviarGoogleForm({nombre, correo, depto, objetivo, areas, resumen, estado, linksDrive}){
  const formData = new FormData()
  formData.append("entry.1393360085", nombre)
  formData.append("entry.1363198453", correo)
  formData.append("entry.1941994843", depto)
  formData.append("entry.1015716567", objetivo)
  formData.append("entry.949214050", areas)
  formData.append("entry.619270886", resumen)
  formData.append("entry.1989031957", estado)
  formData.append("entry.1877018002", linksDrive.join(", "))
  
  await fetch(GOOGLE_FORM_URL, {
    method:"POST",
    body: formData,
    mode:"no-cors" // evita problemas CORS
  })
}

// Envío EmailJS con links
function enviarEmailJS({nombre, correo, cargo, depto, objetivo, areas, resumen, fechaActual, linksDrive}){
  let filesHTML = linksDrive.map(link => `<p>📎 <a href="${link}">${link}</a></p>`).join("")
  return emailjs.send("service_vkt5xuo", "template_vc7447e", {
    employee: nombre,
    department: depto,
    cargo: cargo,
    objective: objetivo,
    areas: areas,
    summary: resumen,
    date: fechaActual,
    files: filesHTML
  })
}

// Evento de envío de formulario
document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault()

  const datosEmpleado = document.getElementById("employee").value.split("|")
  const nombre = datosEmpleado[0], correo = datosEmpleado[1], cargo = datosEmpleado[2], deptoEmpleado = datosEmpleado[3]
  const depto = document.getElementById("departamento").value.trim()
  const objetivo = document.getElementById("objetivo").value.trim()
  const areas = document.getElementById("areas").value.trim()
  const resumen = document.getElementById("resumen").value.trim()

  if(!nombre || !depto || !objetivo || !areas || !resumen){
    alert("Complete todos los campos obligatorios")
    return
  }

  const btn = document.getElementById("btnEnviar")
  const btnText = btn.querySelector(".btn-text")
  const spinner = btn.querySelector(".spinner")
  btn.disabled = true; btnText.innerText = "Enviando..."; spinner.style.display = "inline-block"

  const fechaActual = new Date().toLocaleString()
  const archivosInput = document.getElementById("archivos")

  try {
    // 1️⃣ Subir archivos a Drive
    const linksDrive = await subirArchivosDrive(archivosInput.files, nombre)

    // 2️⃣ Llenar Google Form
    await enviarGoogleForm({nombre, correo, depto, objetivo, areas, resumen, estado:"Pendiente", linksDrive})

    // 3️⃣ Enviar EmailJS
    await enviarEmailJS({nombre, correo, cargo, depto, objetivo, areas, resumen, fechaActual, linksDrive})

    alert("Solicitud enviada correctamente")

    // Reset form
    this.reset()
  } catch(err){
    console.error("Error enviando solicitud:", err)
    alert("Ocurrió un error al enviar la solicitud")
  } finally {
    btn.disabled = false; btnText.innerText = "Registrar Solicitud"; spinner.style.display = "none"
  }
})
</script>
</body>
</html>
