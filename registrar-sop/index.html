<script>
emailjs.init("iR8ieJnOkI4_sr8TH"); // tu public key EmailJS

// URLs
const SCRIPT_URL_DRIVE = "https://script.google.com/macros/s/AKfycbxLLA3xgTVKaLAlyDOy8fHwFm5mWzqY4PkfIqd8p_ELB49q4m2He3NxGBW3Op2WWLmnYw/exec";
const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfIpOjZ5UeyaG0qjD43m49iIp_DRuD7l-Eg8feh1OMwMWAS2w/formResponse";

// Archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file => {
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve({name:file.name, data:reader.result, type:file.type});
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }));
}

// Subir archivos a Drive
async function subirArchivosDrive(files, nombre){
  let archivosBase64 = await archivosA_Base64(files);
  let response = await fetch(SCRIPT_URL_DRIVE, {
    method: "POST",
    body: JSON.stringify({employee:nombre, files:archivosBase64})
  });
  let data = await response.json();
  return data.links; // devuelve array de URLs
}

// Enviar formulario
document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const datosEmpleado = document.getElementById("employee").value.split("|");
  const nombre = datosEmpleado[0], correo = datosEmpleado[1], cargo = datosEmpleado[2], departamentoEmpleado = datosEmpleado[3];

  const depto = document.getElementById("departamento").value.trim();
  const objetivo = document.getElementById("objetivo").value.trim();
  const areas = document.getElementById("areas").value.trim();
  const resumen = document.getElementById("resumen").value.trim();

  if(!nombre || !depto || !objetivo || !areas || !resumen){
    alert("Complete todos los campos obligatorios");
    return;
  }

  const btn = document.getElementById("btnEnviar");
  const btnText = btn.querySelector(".btn-text");
  const spinner = btn.querySelector(".spinner");

  btn.disabled = true;
  btnText.innerText = "Enviando...";
  spinner.style.display = "inline-block";

  let archivosInput = document.getElementById("archivos");
  let linksDrive = [];

  // Subir archivos si hay
  if(archivosInput.files.length > 0){
    try{
      linksDrive = await subirArchivosDrive(archivosInput.files, nombre);
    }catch(err){
      console.error("Error subiendo archivos:", err);
      alert("Error subiendo archivos a Drive");
      btn.disabled = false;
      btnText.innerText = "Registrar Solicitud";
      spinner.style.display = "none";
      return;
    }
  }

  // Enviar Google Form
  try{
    const formData = new FormData();
    formData.append("entry.1393360085", nombre);
    formData.append("entry.1363198453", correo);
    formData.append("entry.1941994843", depto);
    formData.append("entry.1015716567", objetivo);
    formData.append("entry.949214050", areas);
    formData.append("entry.619270886", resumen);
    formData.append("entry.1989031957", "Pendiente");
    formData.append("entry.1877018002", linksDrive.join(", "));
    await fetch(GOOGLE_FORM_URL, {method:"POST", body:formData, mode:"no-cors"});
  }catch(err){
    console.error("Error enviando a Google Form:", err);
  }

  // Enviar EmailJS
  try{
    const filesHTML = linksDrive.map(link => `<p>📎 <a href="${link}">${link}</a></p>`).join("");
    await emailjs.send("service_vkt5xuo", "template_vc7447e", {
      employee: nombre,
      department: depto,
      cargo: cargo,
      objective: objetivo,
      areas: areas,
      summary: resumen,
      date: new Date().toLocaleString(),
      files: filesHTML
    });
    alert("Solicitud enviada correctamente");
  }catch(err){
    console.error("Error enviando correo:", err);
    alert("Error enviando correo");
  }

  btn.disabled = false;
  btnText.innerText = "Registrar Solicitud";
  spinner.style.display = "none";
  this.reset();
});
</script>
