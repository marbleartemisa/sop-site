<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar SOP - ARTEMISA MARBLE & CABINETS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('/sop-site/wall5.png') no-repeat center top;
      background-size: cover;
    }
    .overlay {
      background: rgba(0,0,0,0.25);
      min-height: 100vh;
    }
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      padding: 10px 30px;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 999;
      font-family: 'Nuevo', 'Segoe UI', Arial;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo img {
      height: 40px;
    }
    .menu {
      display: flex;
      gap: 25px;
    }
    .menu a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }
    .menu a:hover {
      color: #00aaff;
      transform: scale(1.05);
    }
    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      cursor: pointer;
    }
    .container {
      max-width: 900px;
      margin: 50px auto;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #003366;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      height: 46px;
    }
    textarea {
      height: auto;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg,#0072C6,#005a9e);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .grid-container {
      max-width: 1100px;
      margin: 40px auto;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #003366;
      color: white;
    }
    .estado {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: bold;
    }
    .pendiente { background: #fff3cd; color: #856404; }
    .tramite { background: #cce5ff; color: #004085; }
    .rechazado { background: #f8d7da; color: #721c24; }
    .aprobado { background: #d4edda; color: #155724; }
    .footer {
      text-align: center;
      padding: 30px;
      color: white;
      background: #003366;
      margin-top: 50px;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      opacity: 0.95;
    }
    .notification.success { background: #28a745; }
    .notification.error { background: #dc3545; }
    @media(max-width:768px) {
      .menu {
        display: none;
        flex-direction: column;
        background: rgba(0,0,0,0.9);
        position: absolute;
        top: 60px;
        right: 0;
        width: 200px;
        padding: 20px;
        border-radius: 10px 0 0 10px;
      }
      .menu.show { display: flex; }
      .menu-toggle { display: block; }
    }
    .spinner { margin-left: 8px; }
  </style>
</head>
<body>
  <div class="overlay">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="logo">
        <img src="/sop-site/logo.png">
        <span>ARTEMISA MARBLE & CABINETS</span>
      </div>
      <div class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
      </div>
      <div class="menu">
        <a href="/sop-site/">Inicio</a>
        <a href="/sop-site/registrar-sop/">Registrar SOP</a>
        <a href="/sop-site/biblioteca/">Biblioteca SOP</a>
      </div>
    </div>

    <!-- FORMULARIO -->
    <div class="container">
      <h1>Registrar Solicitud de SOP - Rev 3.0</h1>
      <form id="sopForm" enctype="multipart/form-data">
        <label>Empleado</label>
        <select id="employee" required>
          <option value="">Seleccione empleado</option>
          <option value="Damian Molina|damian@artemisamarble.com|Presidente|Ventas">Damian Molina - Presidente</option>
          <option value="Alberto Molina|frontdesk@artemisamarble.com|Frontdesk|Administracion">Alberto Molina - Frontdesk</option>
          <option value="Gabriel Batista|sales@artemisamarble.com|Ventas|Comercial">Gabriel Batista - Ventas</option>
          <option value="Jenny Perez|jenny@artemisamarble.com|Manager|Ventas">Jenny Perez - Manager</option>
          <option value="Yozusi Urdaneta|wood@artemisamarble.com|Shopdrawing|Diseño">Yozusi Urdaneta - Shopdrawing</option>
          <option value="Yoandry Perez|yoandry@artemisamarble.com|Manager|Producción">Yoandry Perez - Manager</option>
          <option value="Wendy Romanach|accounting@artemisamarble.com|Accounting|Administracion">Wendy Romanach - Accounting</option>
          <option value="Rolando Diaz|rolando@artemisamarble.com|Medidor|Medida">Rolando Diaz - Medidor</option>
          <option value="Krishna Camila Rojas|jobs@artemisamarble.com|Shopdrawing|Diseño">Krishna Camila Rojas - Shopdrawing</option>
          <option value="Gregorio Abreu|stone.production@artemisamarble.com|Medidor|Medida">Gregorio Abreu - Medidor</option>
          <option value="Juan Pablo Molina|sales3@artemisamarble.com|Shopdrawing|Diseño">Juan Pablo Molina - Shopdrawing</option>
          <option value="Kevin Pastor|sales4@artemisamarble.com|Ventas|Comercial">Kevin Pastor - Ventas</option>
          <option value="Eliana Pineda|info@artemisamarble.com|Ventas|Comercial">Eliana Pineda - Ventas</option>
          <option value="Carlos Herrera|control@artemisamarble.com|Controller|Control">Carlos Herrera - Controller</option>
          <option value="Otros|otros|otros|otros">Otros</option>
        </select>
        <input type="text" id="departamento" placeholder="Área / Departamento" required>
        <input type="text" id="objetivo" placeholder="Objetivo del SOP" required>
        <input type="text" id="areas" placeholder="Áreas o roles involucrados" required>
        <textarea id="resumen" rows="4" placeholder="Resumen de instrucciones" required></textarea>
        <label>Adjuntar archivos (PDF o imágenes)</label>
        <input type="file" id="archivos" multiple>

        <!-- Botón con spinner -->
        <button type="submit" id="btnEnviar">
          <span class="btn-text">Registrar Solicitud</span>
          <span class="spinner" style="display:none;">
            <i class="fa fa-spinner fa-spin"></i>
          </span>
        </button>
      </form>
    </div>

    <!-- GRID -->
    <div class="grid-container">
      <h2>Solicitudes SOP</h2>
      <input type="text" id="buscarSOP" placeholder="Buscar..." style="margin-bottom:15px;padding:8px;width:100%;border-radius:8px;border:1px solid #ccc;">
      <select id="filtroEstado" style="margin-bottom:15px;padding:8px;border-radius:8px;border:1px solid #ccc;">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Trámite">Trámite</option>
        <option value="Rechazado">Rechazado</option>
        <option value="Aprobado">Aprobado</option>
      </select>
      <table>
        <thead>
          <tr>
            <th>Empleado</th>
            <th>Departamento</th>
            <th>Objetivo</th>
            <th>Áreas</th>
            <th>Estado</th>
            <th>Fecha / Hora</th>
            <th>Archivos</th>
            <th>Aportar</th>
          </tr>
        </thead>
        <tbody id="tablaSOP"></tbody>
      </table>
    </div>

    <!-- FOOTER -->
    <div class="footer">© 2026 ARTEMISA MARBLE & CABINETS</div>
  </div>

  <!-- MODAL APORTES -->
  <div id="modalAporte" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:9999;">
    <div style="background:white;padding:30px;border-radius:12px;width:400px;max-width:90%;">
      <h3>Aportar a SOP</h3>
      <div id="historialAportes" style="max-height:200px;overflow:auto;margin-bottom:15px;border:1px solid #ddd;padding:10px;border-radius:8px;">
        Cargando historial...
      </div>
      <input type="hidden" id="aporte_id_sop">
      <input type="hidden" id="aporte_empleado">
      <input type="hidden" id="aporte_correo">
      <input type="hidden" id="aporte_departamento">
      <textarea id="aporte_comentario" placeholder="Comentario u observación" style="width:100%;height:100px;margin-top:10px;"></textarea>
      <label>Adjuntar archivos</label>
      <input type="file" id="aporte_archivos" multiple>
      <div style="margin-top:15px;display:flex;gap:10px;">
        <button onclick="enviarAporte()">Enviar</button>
        <button onclick="cerrarAporte()" style="background:#999;">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    emailjs.init("iR8ieJnOkI4_sr8TH");

    const SCRIPT_URL_DRIVE = "https://script.google.com/macros/s/AKfycbwXCmWHuByuduROkUoweCmmYMUCsA-cdizy3twM30OAsZyJInkltKoao4zafWUycVTH/exec";
    const SCRIPT_URL_SOP_ADMIN = "https://script.google.com/macros/s/AKfycby3ng7kFng6Xc7Zkg9ENkOnzKTMr9wwAZRgI-EebyCR3bsX1g0Tt44ASjvLcP0PQoC9/exec";
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfIpOjZ5UeyaG0qjD43m49iIp_DRuD7l-Eg8feh1OMwMWAS2w/formResponse";

    function toggleMenu() {
      document.querySelector('.menu').classList.toggle('show');
    }

    document.getElementById("employee").addEventListener("change", function() {
      let datos = this.value.split("|");
      document.getElementById("departamento").value = datos[3] || "";
    });

    function iconoArchivo(link) {
      const url = link.toLowerCase();
      if (url.includes(".pdf")) return `📄 <a href="${link}" target="_blank">PDF</a>`;
      if (url.match(/\.(jpg|jpeg|png|gif|webp)$/)) return `🖼 <a href="${link}" target="_blank">Imagen</a>`;
      if (url.match(/\.(xls|xlsx|csv)$/)) return `📊 <a href="${link}" target="_blank">Excel</a>`;
      return `📎 <a href="${link}" target="_blank">Archivo</a>`;
    }

    async function archivosA_Base64(files) {
      return Promise.all(
        Array.from(files).map(file => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: file.name, data: reader.result });
          reader.onerror = reject;
          reader.readAsDataURL(file);
        }))
      );
    }

    async function subirArchivosDrive(files, nombre) {
      let archivosBase64 = await archivosA_Base64(files);
      let response = await fetch(SCRIPT_URL_DRIVE, {
        method: "POST",
        body: JSON.stringify({ employee: nombre, files: archivosBase64 })
      });
      let data = await response.json();
      return data.links;
    }

    const btn = document.getElementById("btnEnviar");
    const btnText = btn.querySelector(".btn-text");
    const spinner = btn.querySelector(".spinner");

    document.getElementById("sopForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      let datosEmpleado = document.getElementById("employee").value.split("|");
      let nombre = datosEmpleado[0];
      let correo = datosEmpleado[1];
      let cargo = datosEmpleado[2];
      let depto = document.getElementById("departamento").value.trim();
      let objetivo = document.getElementById("objetivo").value.trim();
      let areas = document.getElementById("areas").value.trim();
      let resumen = document.getElementById("resumen").value.trim();

      if (!nombre || !depto || !objetivo || !areas || !resumen) {
        mostrarNotificacion("Complete todos los campos obligatorios", "error");
        return;
      }

      btn.disabled = true;
      btnText.innerText = "Enviando...";
      spinner.style.display = "inline-block";

      let fechaActual = new Date().toLocaleString();
      let archivosInput = document.getElementById("archivos");
      let linksDrive = [];

      if (archivosInput.files.length > 0)
        linksDrive = await subirArchivosDrive(archivosInput.files, nombre);

      let filesHTML = linksDrive.map(link => `<p>📎 <a href="${link}">${link}</a></p>`).join("");

      emailjs.send("service_vkt5xuo", "template_vc7447e", {
        employee: nombre,
        department: depto,
        cargo: cargo,
        objective: objetivo,
        areas: areas,
        summary: resumen,
        date: fechaActual,
        files: filesHTML
      });

      try {
        const formData = new FormData();
        formData.append("entry.1393360085", nombre);
        formData.append("entry.1363198453", correo);
        formData.append("entry.1941994843", depto);
        formData.append("entry.1015716567", objetivo);
        formData.append("entry.949214050", areas);
        formData.append("entry.619270886", resumen);
        formData.append("entry.1989031957", "Pendiente");
        formData.append("entry.1877018002", linksDrive.join(", "));
        fetch(GOOGLE_FORM_URL, { method: "POST", body: formData, mode: "no-cors" });
      } catch (e) {
        console.error(e);
      }

      mostrarNotificacion("Solicitud enviada correctamente", "success");
      renderTabla();
      btn.disabled = false;
      btnText.innerText = "Registrar Solicitud";
      spinner.style.display = "none";
      this.reset();
    });

    function mostrarNotificacion(msg, tipo) {
      const notif = document.createElement("div");
      notif.className = "notification " + tipo;
      notif.innerText = msg;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 4000);
    }

    async function renderTabla() {
      const tabla = document.getElementById("tablaSOP");
      tabla.innerHTML = "";
      const filtroEstado = document.getElementById("filtroEstado").value;
      const buscar = document.getElementById("buscarSOP").value.toLowerCase();

      try {
        const res = await fetch(SCRIPT_URL_SOP_ADMIN);
        const data = await res.json();

      data.forEach(sop => {

          console.log("ID SOP:", sop.Timestamp); // 👈 AQUÍ

          if (filtroEstado && sop.estado !== filtroEstado) return;
        
          if (buscar) {
            let texto = (sop.empleado + sop.objetivo + sop.departamento).toLowerCase();
            if (!texto.includes(buscar)) return;
          }

          let estadoClass = "pendiente";
          if (sop.estado === "Trámite") estadoClass = "tramite";
          if (sop.estado === "Rechazado") estadoClass = "rechazado";
          if (sop.estado === "Aprobado") estadoClass = "aprobado";

          let archivosHTML = "";
          if (sop.links) {
            let links = sop.links.split(",");
            archivosHTML = links.map(l => iconoArchivo(l.trim())).join("<br>");
          }

          let fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${sop.empleado || ""}</td>
            <td>${sop.departamento || ""}</td>
            <td>${sop.objetivo || ""}</td>
            <td>${sop.areas || ""}</td>
            <td><span class="estado ${estadoClass}">${sop.estado || ""}</span></td>
            <td>${sop.Timestamp || ""}</td>
            <td>${archivosHTML}</td>
            <td><button onclick="abrirAporte('${sop.Timestamp}','${sop.empleado}','${sop.correo}','${sop.departamento}')">💬</button></td>
          `;
          tabla.appendChild(fila);
        });
      } catch (e) {
        console.error("Error cargando SOP:", e);
      }
    }

    function abrirAporte(id, empleado, correo, depto) {
      document.getElementById("modalAporte").style.display = "flex";
      document.getElementById("aporte_id_sop").value = id;
      document.getElementById("aporte_empleado").value = empleado;
      document.getElementById("aporte_correo").value = correo;
      document.getElementById("aporte_departamento").value = depto;
      cargarHistorial(id);
    }

    function cerrarAporte() {
      document.getElementById("modalAporte").style.display = "none";
    }

    async function enviarAporte() {
      let id = document.getElementById("aporte_id_sop").value;
      let empleado = document.getElementById("aporte_empleado").value;
      let correo = document.getElementById("aporte_correo").value;
      let depto = document.getElementById("aporte_departamento").value;
      let comentario = document.getElementById("aporte_comentario").value;
      let archivosInput = document.getElementById("aporte_archivos");
      let linksDrive = [];

      if (archivosInput.files.length > 0)
        linksDrive = await subirArchivosDrive(archivosInput.files, empleado);

      await fetch(SCRIPT_URL_SOP_ADMIN, {
        method: "POST",
        body: JSON.stringify({
          action: "guardarAporte",
          id_sop: id,
          empleado: empleado,
          correo: correo,
          departamento: depto,
          comentario: comentario,
          archivos: linksDrive.join(", ")
        })
      });

      mostrarNotificacion("Aporte registrado", "success");
      cerrarAporte();
    }

    async function cargarHistorial(id) {
      const historial = document.getElementById("historialAportes");
      historial.innerHTML = "Cargando...";
      try {
        const res = await fetch(SCRIPT_URL_SOP_ADMIN + "?aportes=" + encodeURIComponent(id));
        const data = await res.json();
        if (!data.length) {
          historial.innerHTML = "Sin aportes aún";
          return;
        }
        historial.innerHTML = data.map(a => `
          <div style="border-bottom:1px solid #eee;padding:6px 0;">
            <strong>${a.EMPLEADO}</strong><br>
            <small>${a.FECHA}</small><br>
            ${a.COMENTARIO || ""}
          </div>
        `).join("");
      } catch (e) {
        historial.innerHTML = "Error cargando historial";
      }
    }

    document.getElementById("buscarSOP").addEventListener("input", renderTabla);
    document.getElementById("filtroEstado").addEventListener("change", renderTabla);

    renderTabla();
  </script>
</body>
</html>
