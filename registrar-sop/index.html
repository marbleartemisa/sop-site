<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
h2 { text-align:center; margin-top:20px; }
table { border-collapse: collapse; width: 90%; margin: 0 auto 20px auto; background:#fff; }
th, td { border: 1px solid #ccc; padding: 8px; text-align:left; }
th { background:#2563eb; color:white; }
tr:hover { background:#e2e8f0; cursor:pointer; }

#sop-container { display:none; position:fixed; top:50px; left:50%; transform:translateX(-50%); width:80%; height:80%; z-index:1000; border:1px solid #ccc; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.3); overflow:hidden; }
#sop-frame { width:100%; height:100%; border:none; }

#comments-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

.comentario { position:absolute; color:red; font-weight:bold; font-size:14px; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:4px; pointer-events:auto; cursor:pointer; }

#modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:2000; }
#modal-content { background:#fff; padding:20px; border-radius:5px; width:300px; }
#comentario-text { width:100%; height:80px; }
#btn-save, #btn-cancel { margin-top:10px; }
</style>
</head>
<body>

<h2>Leer y Comentar SOP</h2>

<table id="sop-table">
  <thead>
    <tr>
      <th>Empleado</th>
      <th>Objetivo</th>
      <th>Área</th>
      <th>Resumen</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Viewer SOP -->
<div id="sop-container">
  <iframe id="sop-frame"></iframe>
  <div id="comments-layer"></div>
</div>

<!-- Modal para comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
// --- DATOS DE PRUEBA ---
let SOP_LIST = [
  { id_sop: "SOP-001", empleado: "Damian Molina", objetivo: "Optimizar compras", areas: "Compras, Logística", resumen: "Proceso de compra de slabs de mármol", estado: "Pendiente", links: "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html" },
  { id_sop: "SOP-002", empleado: "Alberto Molina", objetivo: "Control de inventario", areas: "Almacén, Producción", resumen: "Registro de entradas y salidas", estado: "Aprobado", links: "https://marbleartemisa.github.io/sop-site/administracion/SOP-INVENTARIO/index.html" }
];

let CURRENT_SOP = null;
let clickX = 0, clickY = 0;
let comentariosData = []; // guardamos los comentarios para recalcular scroll

const sopContainer = document.getElementById("sop-container");
const sopFrame = document.getElementById("sop-frame");
const commentsLayer = document.getElementById("comments-layer");

// --- Rellenar la tabla con SOPs ---
function cargarSOPs() {
  const tbody = document.querySelector("#sop-table tbody");
  tbody.innerHTML = "";
  SOP_LIST.forEach(sop => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${sop.empleado}</td><td>${sop.objetivo}</td><td>${sop.areas}</td><td>${sop.resumen}</td><td>${sop.estado}</td>`;
    tr.addEventListener("click", ()=>abrirSOP(sop));
    tbody.appendChild(tr);
  });
}

// --- Abrir SOP ---
function abrirSOP(sop){
  CURRENT_SOP = sop;
  sopContainer.style.display = "block";
  sopFrame.src = sop.links;
  commentsLayer.innerHTML = "";
  comentariosData = [];
  sopFrame.onload = () => {
    activarClicParaComentario();
  }
}

// --- Detectar clic para comentario ---
function activarClicParaComentario(){
  const iframeWin = sopFrame.contentWindow;
  // Detectar clic dentro del iframe
  iframeWin.document.body.addEventListener("click", e=>{
    clickX = e.pageX; // posición relativa al documento del iframe
    clickY = e.pageY;
    document.getElementById("modal").style.display = "flex";
  });
}

// --- Guardar comentario ---
document.getElementById("btn-save").addEventListener("click", ()=>{
  const texto = document.getElementById("comentario-text").value.trim();
  if(!texto) return alert("Escribe un comentario");

  const div = document.createElement("div");
  div.className = "comentario";
  div.dataset.y = clickY;
  div.dataset.x = clickX;
  div.textContent = texto;
  commentsLayer.appendChild(div);

  // Guardamos para recalcular scroll
  comentariosData.push(div);

  document.getElementById("modal").style.display = "none";
  document.getElementById("comentario-text").value = "";

  // --- Actualizar posición al hacer scroll ---
  const iframeWin = sopFrame.contentWindow;
  iframeWin.addEventListener("scroll", ()=>recalcularComentarios());

  recalcularComentarios();
});

// --- Cancelar ---
document.getElementById("btn-cancel").addEventListener("click", ()=>{
  document.getElementById("modal").style.display = "none";
  document.getElementById("comentario-text").value = "";
});

// --- Recalcular posición de comentarios según scroll ---
function recalcularComentarios(){
  const iframeWin = sopFrame.contentWindow;
  const scrollY = iframeWin.scrollY;
  const scrollX = iframeWin.scrollX;
  comentariosData.forEach(div=>{
    div.style.top = (div.dataset.y - scrollY) + "px";
    div.style.left = (div.dataset.x - scrollX) + "px";
  });
}

cargarSOPs();
</script>
</body>
</html>
