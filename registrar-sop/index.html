<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar SOP - ARTEMISA MARBLE & CABINETS</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('/sop-site/wall5.png') no-repeat center top;
      background-size: cover;
    }

    .overlay {
      background: rgba(0,0,0,0.25);
      min-height: 100vh;
    }

    .navbar {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      padding: 10px 30px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img { height: 40px; }

    .menu {
      display: flex;
      gap: 25px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 18px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px;
      border-radius: 30px;
      background: #0072C6;
      color: white;
      border: none;
      cursor: pointer;
    }

    .spinner { margin-left: 8px; }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      border-radius: 10px;
      color: white;
    }

    .success { background: #28a745; }
    .error { background: #dc3545; }
  </style>
</head>

<body>
<div class="overlay">

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <img src="/sop-site/logo.png">
      <span>ARTEMISA MARBLE & CABINETS</span>
    </div>
    <div class="menu">
      <a href="/sop-site/">Inicio</a>
      <a href="/sop-site/registrar-sop/">Registrar SOP</a>
      <a href="/sop-site/biblioteca/">Biblioteca SOP</a>
    </div>
  </div>

  <!-- FORM -->
  <div class="container">
    <h1>Registrar Solicitud de SOP</h1>

    <form id="sopForm">
      <select id="employee" required>
        <option value="">Seleccione empleado</option>
        <option value="Carlos Herrera|control@artemisamarble.com|Controller|Control">
          Carlos Herrera
        </option>
      </select>

      <input type="text" id="departamento" placeholder="Departamento" required>
      <input type="text" id="objetivo" placeholder="Objetivo" required>
      <input type="text" id="areas" placeholder="Áreas" required>
      <textarea id="resumen" placeholder="Resumen" required></textarea>

      <input type="file" id="archivos" multiple>

      <button type="submit" id="btnEnviar">
        <span class="btn-text">Registrar</span>
        <span class="spinner" style="display:none;">
          <i class="fa fa-spinner fa-spin"></i>
        </span>
      </button>
    </form>
  </div>

</div>

<script>
emailjs.init("iR8ieJnOkI4_sr8TH");

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLLA3xgTVKaLAlyDOy8fHwFm5mWzqY4PkfIqd8p_ELB49q4m2He3NxGBW3Op2WWLmnYw/exec";

// 🔹 Base64
function archivosA_Base64(files) {
  return Promise.all(Array.from(files).map(file => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({
        name: file.name,
        data: reader.result,
        type: file.type
      });
      reader.readAsDataURL(file);
    });
  }));
}

const btn = document.getElementById("btnEnviar");
const btnText = btn.querySelector(".btn-text");
const spinner = btn.querySelector(".spinner");

document.getElementById("sopForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const datos = document.getElementById("employee").value.split("|");

  const nombre = datos[0];
  const correo = datos[1];
  const depto = document.getElementById("departamento").value;
  const objetivo = document.getElementById("objetivo").value;
  const areas = document.getElementById("areas").value;
  const resumen = document.getElementById("resumen").value;

  btn.disabled = true;
  btnText.innerText = "Enviando...";
  spinner.style.display = "inline-block";

  let archivosBase64 = [];
  const inputFiles = document.getElementById("archivos");

  if (inputFiles.files.length > 0) {
    archivosBase64 = await archivosA_Base64(inputFiles.files);
  }

  try {

    // 🔥 SUBIR
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        employee: nombre,
        correo,
        departamento: depto,
        objetivo,
        areas,
        resumen,
        date: new Date().toLocaleString(),
        files: archivosBase64
      })
    });

    const result = await response.json();

    const links = result.links || [];

    // 🔥 FIX CRÍTICO (te rompía TODO)
    let filesHTML = "";
    if (links.length > 0) {
      filesHTML = links.map(l =>
        `<p>📎 <a href="${l}" target="_blank">${l}</a></p>`
      ).join("");
    }

    // 🔹 EMAIL
    await emailjs.send("service_vkt5xuo", "template_vc7447e", {
      employee: nombre,
      department: depto,
      objective: objetivo,
      areas,
      summary: resumen,
      files: filesHTML
    });

    mostrarNotificacion("OK enviado", "success");

  } catch (err) {
    console.error(err);
    mostrarNotificacion("Error", "error");
  } finally {
    btn.disabled = false;
    btnText.innerText = "Registrar";
    spinner.style.display = "none";
  }
});

// 🔹 NOTIFICACIÓN
function mostrarNotificacion(msg, tipo) {
  const div = document.createElement("div");
  div.className = "notification " + tipo;
  div.innerText = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}
</script>

</body>
</html>
