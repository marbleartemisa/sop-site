<style>
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:url('/sop-site/wall5.png') no-repeat center top;background-size:cover;}

.container{max-width:900px;margin:50px auto;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:30px;border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,0.3);}

.grid-container{max-width:1100px;margin:40px auto;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:30px;border-radius:18px;box-shadow:0 15px 35px rgba(0,0,0,0.3);}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;}
th{background:#003366;color:white;}
.estado{padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:bold;}
.pendiente{background:#fff3cd;color:#856404;}
.tramite{background:#cce5ff;color:#004085;}

.aprobado{background:#d4edda;color:#155724;}
.footer{text-align:center;padding:30px;color:white;background:#003366;margin-top:50px;}
.notification{position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:12px;color:white;font-weight:bold;box-shadow:0 5px 20px rgba(0,0,0,0.3);z-index:9999;opacity:0.95;}
.notification.success{background:#28a745;}
.notification.error{background:#dc3545;}
@media(max-width:768px){.menu{display:none;flex-direction:column;background:rgba(0,0,0,0.9);position:absolute;top:60px;right:0;width:200px;padding:20px;border-radius:10px 0 0 10px;}.menu.show{display:flex;}.menu-toggle{display:block;}}

</style>

<!-- FORMULARIO -->
<div class="container">
<h1>Registrar Solicitud de SOP - Rev 4.02</h1>
<form id="sopForm" enctype="multipart/form-data">
<label>Empleado</label>
<select id="employee" required>
<option value="">Seleccione empleado</option>
<option value="Damian Molina|damian@artemisamarble.com|Presidente|Ventas">Damian Molina - Presidente</option>
<option value="Alberto Molina|frontdesk@artemisamarble.com|Frontdesk|Administracion">Alberto Molina - Frontdesk</option>
<option value="Gabriel Batista|sales@artemisamarble.com|Ventas|Comercial">Gabriel Batista - Ventas</option>
<option value="Jenny Perez|jenny@artemisamarble.com|Manager|Ventas">Jenny Perez - Manager</option>
<option value="Yozusi Urdaneta|wood@artemisamarble.com|Shopdrawing|Diseño">Yozusi Urdaneta - Shopdrawing</option>
<option value="Yoandry Perez|yoandry@artemisamarble.com|Manager|Producción">Yoandry Perez - Manager</option>
<option value="Wendy Romanach|accounting@artemisamarble.com|Accounting|Administracion">Wendy Romanach - Accounting</option>
<option value="Rolando Diaz|rolando@artemisamarble.com|Medidor|Medida">Rolando Diaz - Medidor</option>
<option value="Krishna Camila Rojas|jobs@artemisamarble.com|Shopdrawing|Diseño">Krishna Camila Rojas - Shopdrawing</option>
<option value="Gregorio Abreu|stone.production@artemisamarble.com|Medidor|Medida">Gregorio Abreu - Medidor</option>
<option value="Juan Pablo Molina|sales3@artemisamarble.com|Shopdrawing|Diseño">Juan Pablo Molina - Shopdrawing</option>
<option value="Kevin Pastor|sales4@artemisamarble.com|Ventas|Comercial">Kevin Pastor - Ventas</option>
<option value="Eliana Pineda|info@artemisamarble.com|Ventas|Comercial">Eliana Pineda - Ventas</option>
<option value="Carlos Herrera|control@artemisamarble.com|Controller|Control">Carlos Herrera - Controller</option>
<option value="Otros|otros|otros|otros">Otros</option>
</select>

<input type="text" id="departamento" placeholder="Área / Departamento" required>
<input type="text" id="objetivo" placeholder="Objetivo del SOP" required>
<input type="text" id="areas" placeholder="Áreas o roles involucrados" required>
<textarea id="resumen" rows="4" placeholder="Resumen de instrucciones" required></textarea>
<label>Adjuntar archivos (PDF o imágenes)</label>
<input type="file" id="archivos" multiple>

<button type="submit" id="btnEnviar">
  <span class="btn-text">Registrar Solicitud</span>
  <span class="spinner" style="display:none;"><i class="fa fa-spinner fa-spin"></i></span>
</button>

<div class="footer">© 2026 ARTEMISA MARBLE & CABINETS</div>

<script>
emailjs.init("iR8ieJnOkI4_sr8TH"); // tu user ID EmailJS
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxLLA3xgTVKaLAlyDOy8fHwFm5mWzqY4PkfIqd8p_ELB49q4m2He3NxGBW3Op2WWLmnYw/exec";

// Toggle menu
function toggleMenu(){document.querySelector('.menu').classList.toggle('show');}
document.getElementById("employee").addEventListener("change",function(){
  let datos=this.value.split("|");
  document.getElementById("departamento").value=datos[3] || ""
})

// Convertir archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file=>{
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve({name:file.name,data:reader.result,type:file.type});
      reader.onerror=reject;
      reader.readAsDataURL(file);
    })
  }));
}

// Manejo formulario
const btn=document.getElementById("btnEnviar");
const btnText=btn.querySelector(".btn-text");
const spinner=btn.querySelector(".spinner");

document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault();

  let datosEmpleado=document.getElementById("employee").value.split("|");
  let nombre=datosEmpleado[0], correo=datosEmpleado[1], cargo=datosEmpleado[2], departamentoEmpleado=datosEmpleado[3];
  let depto=document.getElementById("departamento").value.trim();
  let objetivo=document.getElementById("objetivo").value.trim();
  let areas=document.getElementById("areas").value.trim();
  let resumen=document.getElementById("resumen").value.trim();

  if(!nombre || !depto || !objetivo || !areas || !resumen){
    mostrarNotificacion("Complete todos los campos obligatorios","error");
    return;
  }

  btn.disabled=true; 
  btnText.innerText="Enviando..."; 
  spinner.style.display="inline-block";

  let fechaActual=new Date().toLocaleString();
  let archivosInput=document.getElementById("archivos");
  let archivosBase64=[];
  if(archivosInput.files.length>0) archivosBase64=await archivosA_Base64(archivosInput.files);

  try{
    // 1️⃣ Subir archivos y obtener URLs
    const response=await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
       employee:nombre,
        correo:correo,
        cargo:cargo,
        departamento:depto,
        objetivo:objetivo,
        areas:areas,
        resumen:resumen,
        date:fechaActual,
        files:archivosBase64
      })
    });


// ================== PREPARAR LINKS ==================
const result = await response.json();

console.log("RESULT COMPLETO:", result);

if(result.status !== "success"){
  console.error("Error Apps Script:", result);
  mostrarNotificacion("Error subiendo archivos","error");
  return;
}

const links = result.links || [];

console.log("LINKS RECIBIDOS:", links);

// ================== GENERAR HTML PARA EMAIL ==================
let filesHTML = "<p>No se adjuntaron archivos</p>";

if (links && links.length > 0) {
  filesHTML = links.map(link => 
    `<p>📎 <a href="${link}" target="_blank">${link}</a></p>`
  ).join("");
}

console.log("HTML enviado al correo:", filesHTML);

// ================== ENVÍO EMAIL ==================
emailjs.send("service_vkt5xuo","template_vc7447e",{
  employee: nombre,
  department: depto,
  cargo: cargo,
  objective: objetivo,
  areas: areas,
  summary: resumen,
  date: fechaActual,
  files: filesHTML
})
.then((response) => {
  console.log("EMAIL ENVIADO:", response);
  mostrarNotificacion("Solicitud enviada correctamente","success");
})
.catch((err) => {
  console.error("ERROR EMAIL:", err);
  mostrarNotificacion("Error enviando correo","error");
});

    
    // 4️⃣ Llenar Google Form con URLs
    try{
      const formData = new FormData();
      formData.append("entry.1393360085", nombre);
      formData.append("entry.1363198453", correo);
      formData.append("entry.1941994843", depto);
      formData.append("entry.1015716567", objetivo);
      formData.append("entry.949214050", areas);
      formData.append("entry.619270886", resumen);
      formData.append("entry.1989031957", "Pendiente");
      formData.append("entry.1877018002", links.join("\n")); // usar saltos de línea para múltiples links

      fetch("https://docs.google.com/forms/d/e/1FAIpQLSfIpOjZ5UeyaG0qjD43m49iIp_DRuD7l-Eg8feh1OMwMWAS2w/formResponse", {
        method:"POST",
        body:formData,
        mode:"no-cors"
      }).catch(err=>console.warn("Google Form falló:", err));

    } catch(err){
      console.warn("Error llenando Google Form:", err);
    }

  }catch(err){
    console.error("Error al registrar SOP:", err);
    mostrarNotificacion("Ocurrió un error al registrar SOP","error");
  }finally{
    btn.disabled=false; 
    btnText.innerText="Registrar Solicitud"; 
    spinner.style.display="none";
    this.reset();
  }
})

  function adminLogin(){

const password = prompt("Ingrese contraseña de administrador");

if(password === "Artemisa2026"){   // puedes cambiar la clave

    window.location.href="/sop-site/admin/";

}else{

    alert("Acceso denegado");

}

}


function mostrarNotificacion(msg,tipo){
  const notif=document.createElement("div");
  notif.className="notification "+tipo;
  notif.innerText=msg;
  document.body.appendChild(notif);
  setTimeout(()=>notif.remove(),4000);
}
</script>
