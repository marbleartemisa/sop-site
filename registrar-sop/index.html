<script>

 const usuarios = [
  {usuario:"Damian Molina", clave:"Dam1975", rol:"editor", depto:"Comercial", correo:"damian@artemisamarble.com"},
  {usuario:"Alberto Molina", clave:"Alb1975", rol:"editor", depto:"Administracion", correo:"frontdesk@artemisamarble.com"},
  {usuario:"Gabriel Batista", clave:"Gab1975", rol:"editor", depto:"Comercial", correo:"sales@artemisamarble.com"},
  {usuario:"Wendy Romanach", clave:"Wen1975", rol:"editor", depto:"Administración", correo:"accounting@artemisamarble.com"},
  {usuario:"Carlos Herrera", clave:"Art2026", rol:"admin", depto:"Control", correo:"control@artemisamarble.com"},
  {usuario:"Jenny Perez", clave:"Jen1975", rol:"editor", depto:"Comercial", correo:"jenny@artemisamarble.com"},
  {usuario:"Yozusi Urdaneta", clave:"Yoz1975", rol:"editor", depto:"Gerencia", correo:"wood@artemisamarble.com"}
];

let currentUser = null;
 
emailjs.init("iR8ieJnOkI4_sr8TH"); // tu user ID EmailJS
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxLLA3xgTVKaLAlyDOy8fHwFm5mWzqY4PkfIqd8p_ELB49q4m2He3NxGBW3Op2WWLmnYw/exec";

// Toggle menu
function toggleMenu(){document.querySelector('.menu').classList.toggle('show');}
document.getElementById("employee").addEventListener("change",function(){
  let datos=this.value.split("|");
  document.getElementById("departamento").value=datos[3] || ""
})

// Convertir archivos a Base64
function archivosA_Base64(files){
  return Promise.all(Array.from(files).map(file=>{
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve({name:file.name,data:reader.result,type:file.type});
      reader.onerror=reject;
      reader.readAsDataURL(file);
    })
  }));
}

// Manejo formulario
const btn=document.getElementById("btnEnviar");
const btnText=btn.querySelector(".btn-text");
const spinner=btn.querySelector(".spinner");

document.getElementById("sopForm").addEventListener("submit", async function(e){
  e.preventDefault();

  let datosEmpleado=document.getElementById("employee").value.split("|");
  let nombre=datosEmpleado[0], correo=datosEmpleado[1], cargo=datosEmpleado[2], departamentoEmpleado=datosEmpleado[3];
  let depto=document.getElementById("departamento").value.trim();
  let objetivo=document.getElementById("objetivo").value.trim();
  let areas=document.getElementById("areas").value.trim();
  let resumen=document.getElementById("resumen").value.trim();

  if(!nombre || !depto || !objetivo || !areas || !resumen){
    mostrarNotificacion("Complete todos los campos obligatorios","error");
    return;
  }

  btn.disabled=true; 
  btnText.innerText="Enviando..."; 
  spinner.style.display="inline-block";

  let fechaActual=new Date().toLocaleString();
  let archivosInput=document.getElementById("archivos");
  let archivosBase64=[];
  if(archivosInput.files.length>0) archivosBase64=await archivosA_Base64(archivosInput.files);

  try{
    // 1️⃣ Subir archivos y obtener URLs
    const response=await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
       employee:nombre,
        correo:correo,
        cargo:cargo,
        departamento:depto,
        objetivo:objetivo,
        areas:areas,
        resumen:resumen,
        date:fechaActual,
        files:archivosBase64
      })
    });
    const result=await response.json();
    const links=result.links || [];

    console.log("Links recibidos del endpoint:", links);

    // 2️⃣ Preparar HTML para email
    let filesHTML = "";
    if(Array.isArray(links) && links.length > 0){
      filesHTML = links.map(l => `<p>📎 <a href="${l}" target="_blank">${l}</a></p>`).join("");
    }

    // 3️⃣ Enviar EmailJS
    emailjs.send("service_vkt5xuo","template_vc7447e",{
      employee:nombre,
      department:depto,
      cargo:cargo,
      objective:objetivo,
      areas:areas,
      summary:resumen,
      date:fechaActual,
      files:filesHTML
    })
    .then(()=>mostrarNotificacion("Solicitud enviada correctamente","success"))
    .catch(err=>{console.error(err); mostrarNotificacion("Error enviando correo","error")});

    // 4️⃣ Llenar Google Form con URLs
    try{
      const formData = new FormData();
      formData.append("entry.1393360085", nombre);
      formData.append("entry.1363198453", correo);
      formData.append("entry.1941994843", depto);
      formData.append("entry.1015716567", objetivo);
      formData.append("entry.949214050", areas);
      formData.append("entry.619270886", resumen);
      formData.append("entry.1989031957", "Pendiente");
      formData.append("entry.1877018002", links.join("\n")); // usar saltos de línea para múltiples links

      fetch("https://docs.google.com/forms/d/e/1FAIpQLSfIpOjZ5UeyaG0qjD43m49iIp_DRuD7l-Eg8feh1OMwMWAS2w/formResponse", {
        method:"POST",
        body:formData,
        mode:"no-cors"
      }).catch(err=>console.warn("Google Form falló:", err));

    } catch(err){
      console.warn("Error llenando Google Form:", err);
    }

  }catch(err){
    console.error("Error al registrar SOP:", err);
    mostrarNotificacion("Ocurrió un error al registrar SOP","error");
  }finally{
    btn.disabled=false; 
    btnText.innerText="Registrar Solicitud"; 
    spinner.style.display="none";
    this.reset();
  }
})

  function adminLogin(){

const password = prompt("Ingrese contraseña de administrador");

if(password === "Artemisa2026"){   // puedes cambiar la clave

    window.location.href="/sop-site/admin/";

}else{

    alert("Acceso denegado");

}

}

 function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

function populateUsers(){
  const select = document.getElementById("loginUser");
  select.innerHTML = '<option value="">Seleccione usuario</option>';
  usuarios.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.usuario;
    opt.textContent = u.usuario;
    select.appendChild(opt);
  });
}

function login(){
  const userName = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;

  const user = usuarios.find(u=>u.usuario===userName && u.clave===pass);

  if(user){
    currentUser = user;
    localStorage.setItem("usuario", user.usuario);
    closeLogin();
    mostrarUsuario(user);
    mostrarBienvenida(user.usuario);
  }else{
    document.getElementById("loginError").style.display = "block";
  }
}

// Mostrar usuario en navbar
function mostrarUsuario(user){
  const userDiv = document.getElementById("userInfo");
  const userNameSpan = document.getElementById("userName");

  userNameSpan.textContent = user.usuario; // mostrar nombre
  userDiv.style.display = "flex";          // mostrar bloque
}
      
function mostrarBienvenida(nombre){
  const msg = document.getElementById("welcome-msg");
  msg.textContent = `Bienvenido, ${nombre}`;
  msg.classList.add("show");
  setTimeout(()=> msg.classList.remove("show"),3000);
}


// Cerrar sesión
function logout(){
  localStorage.removeItem("usuario");
  currentUser = null;
  document.getElementById("userInfo").style.display = "none";
  openLogin();
}

function mostrarNotificacion(msg,tipo){
  const notif=document.createElement("div");
  notif.className="notification "+tipo;
  notif.innerText=msg;
  document.body.appendChild(notif);
  setTimeout(()=>notif.remove(),4000);
}

 /* ===== EDITAR SOP ===== */
function editSOP(){
  if(!currentUser){
    alert("Debe iniciar sesión");
    openLogin();
    return;
  }

  const pass = prompt("Ingrese su clave");
  if(pass === currentUser.clave){
    window.location.href="/sop-site/sop-viewer-edit/";
  }else{
    alert("Clave incorrecta");
  }
}

/* ===== INIT ===== */


 // Al cargar la página, mostrar usuario si está guardado


window.addEventListener("DOMContentLoaded", () => {

  populateUsers(); // 🔥 IMPORTANTE

  const savedUser = localStorage.getItem("usuario");

  if(savedUser){
    currentUser = usuarios.find(u => u.usuario === savedUser);
    if(currentUser){
      mostrarUsuario(currentUser);
    }
  }else{
    openLogin(); // opcional
  }

});

 
</script>
