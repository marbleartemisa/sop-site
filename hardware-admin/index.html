<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARTEMISA - Hardware DB Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */

body{
  background-image:url('/sop-site/wall0.png');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:white;
}

.overlay{
  background:rgba(0,0,0,0.40);
  min-height:100vh;
}

/* ===== VIDEO BG ===== */

.video-background{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:-1;
}

.video-background video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== NAVBAR ===== */

.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.70);
  backdrop-filter:blur(10px);
  padding:10px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:40px;
}

.logo span{
  font-weight:bold;
  font-size:1rem;
}

.menu{
  display:flex;
  align-items:center;
  gap:25px;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.menu a:hover{
  color:#00aaff;
}

.menu a.active{
  background:#003366;
  padding:6px 12px;
  border-radius:8px;
}

/* ===== MOBILE MENU ===== */

.menu-toggle{
  display:none;
  font-size:1.5rem;
  cursor:pointer;
}

@media(max-width:900px){

  .menu-toggle{
    display:block;
  }

  .menu{
    display:none;
    position:absolute;
    top:60px;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.95);
    flex-direction:column;
    padding:20px 0;
  }

  .menu.show{
    display:flex;
  }

  .logo span{
    display:none;
  }

}

/* ===== BANNER ===== */

.banner{
  text-align:center;
  padding:40px 20px 20px;
}

.banner h1{
  margin:0;
  font-size:2.2rem;
}

.banner p{
  margin-top:8px;
  color:#d1d5db;
}

.banner-badge{
  display:inline-block;
  margin-top:15px;
  padding:10px 22px;
  border-radius:30px;
  background:linear-gradient(135deg,#0072C6,#005a9e);
  font-weight:bold;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

/* ===== MAIN ===== */

.admin-container{
  max-width:1450px;
  margin:20px auto 60px;
  padding:20px;
  display:grid;
  grid-template-columns:400px 1fr;
  gap:25px;
}

@media(max-width:1000px){

  .admin-container{
    grid-template-columns:1fr;
  }

}

/* ===== CARD ===== */

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.card h2{
  margin-top:0;
  margin-bottom:20px;
}

/* ===== FORM ===== */

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:.9rem;
  font-weight:500;
}

.form-group input,
.form-group select{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.15);
  color:white;
  outline:none;
  font-size:.95rem;
}

.form-group input::placeholder{
  color:#ddd;
}

.form-group input:focus,
.form-group select:focus{
  border:1px solid #00aaff;
}

/* ===== BUTTONS ===== */

.save-btn,
.export-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
  font-size:.95rem;
}

.save-btn{
  background:linear-gradient(135deg,#0072C6,#005a9e);
  margin-top:10px;
}

.export-btn{
  margin-top:15px;
  background:linear-gradient(135deg,#059669,#047857);
}

.save-btn:hover,
.export-btn:hover{
  transform:translateY(-2px);
}

/* ===== SEARCH ===== */

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.15);
  color:white;
  outline:none;
}

.search-box input::placeholder{
  color:#ddd;
}

/* ===== TABLE ===== */

.table-container{
  overflow:auto;
  border-radius:18px;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  position:sticky;
  top:0;
  background:#0f172a;
  padding:16px;
  text-align:left;
  font-size:.8rem;
  text-transform:uppercase;
  color:#cbd5e1;
}

tbody tr{
  background:rgba(255,255,255,0.05);
  transition:.2s;
}

tbody tr:hover{
  background:rgba(255,255,255,0.10);
}

td{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.thumb{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid rgba(255,255,255,0.15);
}

/* ===== BADGES ===== */

.category-badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:600;
  background:#1d4ed8;
}

/* ===== ACTIONS ===== */

.action-btn{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  color:white;
  transition:.2s;
}

.delete-btn{
  background:#dc2626;
}

.delete-btn:hover{
  transform:scale(1.05);
}

/* ===== FOOTER ===== */

.footer{
  text-align:center;
  color:white;
  padding:30px 20px;
  opacity:.8;
  font-size:.9rem;
}

</style>
</head>

<body>

<div class="overlay">

<!-- VIDEO -->

<div class="video-background">
  <video autoplay muted loop playsinline>
    <source src="/sop-site/wall-video.mp4" type="video/mp4">
  </video>
</div>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>

  <div class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </div>

  <div class="menu">

    <a href="/sop-site/">Inicio</a>

    <a href="/sop-site/hardware-library/">
      Hardware Library
    </a>

    <a href="/sop-site/hardware-selector/">
      Selector
    </a>

    <a href="/sop-site/hardware-admin/" class="active">
      DB Admin
    </a>

  </div>

</div>

<!-- BANNER -->

<div class="banner">

  <h1>Hardware Database Admin</h1>

  <p>
    Administración central del JSON de hardware
  </p>

  <div class="banner-badge">
    DATA-DRIVEN SYSTEM
  </div>

</div>

<!-- MAIN -->

<div class="admin-container">

  <!-- LEFT -->

  <div class="card">

    <h2>
      <i class="fa-solid fa-database"></i>
      Agregar Item
    </h2>

    <div class="form-group">
      <label>Categoría</label>

      <select id="category">
        <option>sink</option>
        <option>faucet</option>
        <option>hardware</option>
        <option>pocket-door</option>
      </select>
    </div>

    <div class="form-group">
      <label>Marca</label>
      <input type="text" id="brand" placeholder="Blum">
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="name" placeholder="Soft Close Hinge">
    </div>

    <div class="form-group">
      <label>SKU</label>
      <input type="text" id="sku" placeholder="BLM-223">
    </div>

    <div class="form-group">
      <label>Finish</label>
      <input type="text" id="finish" placeholder="Matte Black">
    </div>

    <div class="form-group">
      <label>Precio</label>
      <input type="number" id="price" placeholder="45">
    </div>

    <div class="form-group">
      <label>Imagen URL</label>
      <input type="text" id="image" placeholder="https://">
    </div>

    <button class="save-btn" onclick="saveItem()">
      <i class="fa-solid fa-floppy-disk"></i>
      Guardar Item
    </button>

    <button class="export-btn" onclick="exportJSON()">
      <i class="fa-solid fa-file-export"></i>
      Exportar JSON
    </button>

  </div>

  <!-- RIGHT -->

  <div class="card">

    <div class="search-box">

      <input type="text"
      id="search"
      placeholder="Buscar hardware..."
      oninput="renderTable()">

    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Marca</th>
            <th>SKU</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>

</div>

<!-- FOOTER -->

<div class="footer">
  © 2026 ARTEMISA MARBLE & CABINETS — Hardware DB Admin
</div>

</div>

<script>

/* ===== MOBILE MENU ===== */

function toggleMenu(){
  document.querySelector('.menu').classList.toggle('show');
}

/* ===== DB ===== */

let hardwareDB = [];

fetch('hardware-db.json?v=' + Date.now())
.then(res => res.json())
.then(data => {

  hardwareDB = data;

  renderTable();

});

/* ===== SAVE ITEM ===== */

function saveItem(){

  const item = {

    id: Date.now(),

    category: document.getElementById('category').value,

    brand: document.getElementById('brand').value,

    name: document.getElementById('name').value,

    sku: document.getElementById('sku').value,

    finish: document.getElementById('finish').value,

    price: document.getElementById('price').value,

    image: document.getElementById('image').value

  };

  hardwareDB.push(item);

  renderTable();

  clearForm();

  alert("Item agregado correctamente");

}

/* ===== TABLE ===== */

function renderTable(){

  const tbody = document.getElementById('tableBody');

  const search = document
  .getElementById('search')
  .value
  .toLowerCase();

  tbody.innerHTML = '';

  hardwareDB
  .filter(item =>

    item.name.toLowerCase().includes(search) ||

    item.brand.toLowerCase().includes(search)

  )

  .forEach(item => {

    tbody.innerHTML += `

      <tr>

        <td>
          <img src="${item.image}" class="thumb">
        </td>

        <td>${item.name}</td>

        <td>${item.brand}</td>

        <td>${item.sku}</td>

        <td>
          <span class="category-badge">
            ${item.category}
          </span>
        </td>

        <td>$${item.price}</td>

        <td>

          <button class="action-btn delete-btn"
          onclick="deleteItem(${item.id})">

            <i class="fa-solid fa-trash"></i>

          </button>

        </td>

      </tr>

    `;

  });

}

/* ===== DELETE ===== */

function deleteItem(id){

  hardwareDB = hardwareDB.filter(item => item.id !== id);

  renderTable();

}

/* ===== CLEAR ===== */

function clearForm(){

  document.querySelectorAll('input').forEach(i => i.value='');

}

/* ===== EXPORT ===== */

function exportJSON(){

  const dataStr = JSON.stringify(hardwareDB,null,2);

  const blob = new Blob([dataStr], {
    type:'application/json'
  });

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download = 'hardware-db.json';

  a.click();

}

</script>

</body>
</html>
