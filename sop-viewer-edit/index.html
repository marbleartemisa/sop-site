<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
h2 { text-align:center; margin-top:20px; }
table { border-collapse: collapse; width: 90%; margin: 0 auto 20px auto; background:#fff; }
th, td { border: 1px solid #ccc; padding: 8px; text-align:left; }
th { background:#2563eb; color:white; }
tr:hover { background:#e2e8f0; cursor:pointer; }

#sop-container { display:none; position:fixed; top:50px; left:50%; transform:translateX(-50%); width:80%; height:80%; z-index:1000; border:1px solid #ccc; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.3); }
#sop-frame { width:100%; height:100%; border:none; }
#comments-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

.comentario { position:absolute; color:red; font-weight:bold; font-size:14px; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:4px; pointer-events:auto; cursor:pointer; }

#modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:2000; }
#modal-content { background:#fff; padding:20px; border-radius:5px; width:300px; }
#comentario-text { width:100%; height:80px; }
#btn-save, #btn-cancel { margin-top:10px; }
</style>
</head>
<body>

<h2>Leer y Comentar SOP</h2>

<table id="sop-table">
  <thead>
    <tr>
      <th>Empleado</th>
      <th>Objetivo</th>
      <th>Área</th>
      <th>Resumen</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Viewer SOP -->
<div id="sop-container">
  <iframe id="sop-frame"></iframe>
  <div id="comments-layer"></div>
</div>

<!-- Modal para comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
// --- CONFIGURACIONES ---
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
let SOP_LIST = [];   // Lista de SOP
let CURRENT_SOP = null;

// --- VARIABLES DE COMENTARIOS ---
let clickX = 0, clickY = 0;

const sopContainer = document.getElementById("sop-container");
const sopFrame = document.getElementById("sop-frame");
const commentsLayer = document.getElementById("comments-layer");

// --- CARGAR SOP DESDE SHEET ---
async function cargarSOPs() {
  try {
    const res = await fetch(`${SHEET_API}?tipo=fetch_sops`);
    const data = await res.json();
    SOP_LIST = data.sops || [];
    const tbody = document.querySelector("#sop-table tbody");
    tbody.innerHTML = "";
    SOP_LIST.forEach(sop => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${sop.empleado}</td>
        <td>${sop.objetivo}</td>
        <td>${sop.areas}</td>
        <td>${sop.resumen}</td>
        <td>${sop.estado}</td>
      `;
      tr.addEventListener("click", ()=>abrirSOP(sop));
      tbody.appendChild(tr);
    });
  } catch(err) { console.error("Error cargando SOPs:", err); }
}

// --- ABRIR SOP EN IFRAME ---
function abrirSOP(sop){
  CURRENT_SOP = sop;
  sopContainer.style.display = "block";
  sopFrame.src = sop.links;
  commentsLayer.innerHTML = "";
  sopFrame.onload = () => {
    cargarComentariosExistentes();
    activarClicParaComentario();
  }
}

// --- DETECTAR CLIC PARA COMENTARIO ---
function activarClicParaComentario(){
  const iframeDoc = sopFrame.contentDocument || sopFrame.contentWindow.document;
  iframeDoc.body.addEventListener("click", e=>{
    // Evitar clic sobre comentario existente
    if(e.target.classList.contains("comentario")) return;
    const rect = sopFrame.getBoundingClientRect();
    clickX = e.clientX - rect.left;
    clickY = e.clientY - rect.top;
    document.getElementById("modal").style.display = "flex";
  });
}

// --- GUARDAR COMENTARIO ---
document.getElementById("btn-save").addEventListener("click", async ()=>{
  const texto = document.getElementById("comentario-text").value.trim();
  if(!texto) return alert("Escribe un comentario");

  // Crear div flotante
  const div = document.createElement("div");
  div.className = "comentario";
  div.style.left = clickX + "px";
  div.style.top = clickY + "px";
  div.textContent = texto;
  commentsLayer.appendChild(div);

  document.getElementById("modal").style.display = "none";
  document.getElementById("comentario-text").value = "";

  // Guardar en Sheet
  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo:"comentario",
        id_sop: CURRENT_SOP.id_sop,
        usuario:"UsuarioX",
        correo:"usuario@empresa.com",
        comentario:texto,
        x: clickX,
        y: clickY,
        page:1,
        url_doc: CURRENT_SOP.links
      })
    });
  } catch(err){ console.error("Error guardando comentario:", err); }
});

// --- CANCELAR COMENTARIO ---
document.getElementById("btn-cancel").addEventListener("click", ()=>{
  document.getElementById("modal").style.display = "none";
  document.getElementById("comentario-text").value = "";
});

// --- CARGAR COMENTARIOS EXISTENTES ---
async function cargarComentariosExistentes(){
  if(!CURRENT_SOP) return;
  try{
    const res = await fetch(`${SHEET_API}?comments=${CURRENT_SOP.id_sop}`);
    const data = await res.json();
    data.forEach(c=>{
      const div = document.createElement("div");
      div.className="comentario";
      div.style.left = c.x + "px";
      div.style.top = c.y + "px";
      div.textContent = c.comentario;
      commentsLayer.appendChild(div);
    });
  }catch(err){ console.error("Error cargando comentarios:", err); }
}

// --- INICIAR ---
cargarSOPs();
</script>

</body>
</html>
