<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial y Comentarios SOP - Visor Profesional</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ===== GLOBAL ===== */
body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:#eef2f7;
  color:#1f2937;
}

/* ===== NAVBAR ===== */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  padding:12px 30px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1100;
}
.menu a{ color:white; margin-left:20px; text-decoration:none; }
.menu a:hover{ color:#00d1ff; }

/* ===== TABLA ===== */
.overlay { padding:20px; max-width:1200px; margin:auto;}
table{ width:100%; background:white; border-radius:10px; overflow:hidden;}
th{ background:#003366; color:white; padding:10px;}
td{ padding:10px; border-bottom:1px solid #ddd; }

/* ===== VISOR SOP ===== */
#canvas-overlay{
  display:none;
  position:fixed;
  top:50px;
  width:100%;
  height:calc(100% - 50px);
  background:rgba(0,0,0,0.4);
  z-index:1000;
  overflow:auto;
}

#sop-container{
  margin:30px auto;
  width:90%;
  max-width:1000px;
  background:#f9fafb;
  border-radius:14px;
  padding:30px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

#canvas-wrapper{
  position:relative;
}

/* ===== SOP LIMPIO ===== */
.sop-content{
  background:white;
  padding:40px;
  border-radius:10px;
  line-height:1.6;
}

.sop-content h1,h2,h3{
  color:#003366;
  margin-top:20px;
}

.sop-content p{
  margin:10px 0;
}

/* ocultar basura */
.sop-content img:not([src]),
.sop-content img[src=""],
.sop-content iframe:empty,
.sop-content .placeholder{
  display:none !important;
}

/* ===== COMENTARIOS ===== */
.comentario{
  position:absolute;
  background:#fff3a0;
  border:1px solid #ffcc00;
  padding:6px 8px;
  border-radius:6px;
  font-size:13px;
  max-width:200px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.comentario:hover{
  transform:scale(1.03);
}

/* ===== BOTONES ===== */
#btnCerrarSOP{
  position:fixed;
  top:70px;
  right:20px;
  background:#c00;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== MODAL ===== */
#modal{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
}

#modal-content{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:350px;
  color:white;
}

textarea{
  width:100%;
  height:120px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <span>ARTEMISA</span>
  <div class="menu">
    <a href="#">Inicio</a>
  </div>
</div>

<div class="overlay">
  <h2>Historial SOP</h2>
  <table>
    <tbody id="tablaSOP"></tbody>
  </table>
</div>

<!-- VISOR -->
<div id="canvas-overlay">
  <div id="sop-container">
    <button id="btnCerrarSOP" onclick="cerrarCanvas()">Cerrar</button>
    <div id="canvas-wrapper"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-content">
    <h3>Editar comentario</h3>
    <textarea id="comentario-text"></textarea>
    <button onclick="guardarEdicion()">Guardar</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

let comentarios=[],ID_SOP="",editIndex=null;

/* ===== TABLA ===== */
async function cargarTabla(){
  const res=await fetch(API);
  const data=await res.json();
  const tabla=document.getElementById("tablaSOP");

  data.forEach(r=>{
    if(!r.ID_SOP)return;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.objetivo}</td>
      <td><button onclick="abrirSOP('${r.url_doc}','${r.ID_SOP}')">Abrir</button></td>
    `;
    tabla.appendChild(tr);
  });
}
cargarTabla();

/* ===== ABRIR SOP ===== */
async function abrirSOP(url,id){
  ID_SOP=id;
  comentarios=[];

  const wrap=document.getElementById("canvas-wrapper");
  document.getElementById("canvas-overlay").style.display="block";

  const html=await fetch(url).then(r=>r.text());

  const div=document.createElement("div");
  div.className="sop-content";
  div.innerHTML=html;

  // limpiar basura
  div.querySelectorAll("script,style").forEach(e=>e.remove());

  wrap.innerHTML="";
  wrap.appendChild(div);

  wrap.onclick=crearComentario;

  cargarComentarios();
}

/* ===== CREAR ===== */
function crearComentario(e){
  const rect=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  const texto=prompt("Comentario:");
  if(!texto)return;

  comentarios.push({x,y,comentario:texto});
  dibujar();

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      tipo:"comentario",
      id_sop:ID_SOP,
      comentario:texto,
      x,y
    })
  });
}

/* ===== DIBUJAR ===== */
function dibujar(){
  const wrap=document.getElementById("canvas-wrapper");
  wrap.querySelectorAll(".comentario").forEach(e=>e.remove());

  comentarios.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="comentario";
    div.style.left=c.x+"px";
    div.style.top=c.y+"px";
    div.innerText=c.comentario;

    div.onclick=(e)=>{
      e.stopPropagation();
      editIndex=i;
      document.getElementById("comentario-text").value=c.comentario;
      document.getElementById("modal").style.display="flex";
    };

    wrap.appendChild(div);
  });
}

/* ===== EDITAR ===== */
function guardarEdicion(){
  const txt=document.getElementById("comentario-text").value;
  comentarios[editIndex].comentario=txt;
  dibujar();
  document.getElementById("modal").style.display="none";
}

/* ===== CARGAR ===== */
async function cargarComentarios(){
  const res=await fetch(`${API}?comments=${ID_SOP}`);
  const data=await res.json();
  comentarios=data.map(c=>({x:c.x,y:c.y,comentario:c.comentario}));
  dibujar();
}

/* ===== CERRAR ===== */
function cerrarCanvas(){
  document.getElementById("canvas-overlay").style.display="none";
}
</script>

</body>
</html>
