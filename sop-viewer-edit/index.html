<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  h2 { text-align:center; margin:20px 0; }

  #sop-container { 
    position: relative; 
    width: 80%; 
    margin: 20px auto; 
    border: 1px solid #ccc; 
    background:#fff; 
    min-height:600px; 
    overflow: auto; 
    z-index:1;
  }
  #sop-copy { position: relative; padding:20px; min-height:600px; }

  .comentario { 
    position: absolute; 
    color: red; 
    font-weight: bold; 
    cursor: pointer; 
    background: rgba(255,255,255,0.8);
    border-radius:4px;
    padding:2px 4px;
    font-size:13px;
  }

  #modal { 
    display:none; 
    position: fixed; 
    top:0; left:0; 
    width:100%; height:100%; 
    background: rgba(0,0,0,0.6); 
    justify-content:center; align-items:center; 
    z-index:1000;
  }
  #modal-content { 
    background:#fff; padding:20px; border-radius:5px; width:300px; 
  }
  #comentario-text { width:100%; height:80px; margin-bottom:10px; }
  button { cursor:pointer; padding:6px 12px; border:none; border-radius:4px; }
  #btn-save { background:#2563eb; color:white; }
  #btn-cancel { background:#ccc; color:black; margin-left:8px; }

  table { width:80%; margin:20px auto; border-collapse: collapse; background:#fff; }
  th, td { padding:10px; border:1px solid #ccc; text-align:left; font-size:14px; }
  th { background:#f1f1f1; }
  button.read-btn { background:#2563eb; color:white; font-size:13px; }
</style>
</head>
<body>

<h2>Leer y Comentar SOP</h2>

<!-- Tabla SOP -->
<table id="sop-table">
  <thead>
    <tr>
      <th>Empleado</th>
      <th>Departamento</th>
      <th>Objetivo</th>
      <th>Areas</th>
      <th>Resumen</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Contenedor del SOP -->
<div id="sop-container" style="display:none;">
  <div id="sop-copy"></div>
</div>

<!-- Modal comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

// Datos ejemplo, se reemplazan por tu fetch desde SOP_Admin
let SOPs = [
  {empleado:"Juan Pérez", departamento:"Compras", objetivo:"Control Slabs", areas:"Almacén", resumen:"Revisión de slabs", estado:"Activo", links:"https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html", id_sop:"SOP-1774461381359-0"}
];

let currentSOP = null;
let clickX=0, clickY=0;

// Cargar tabla SOP
function cargarTabla() {
  const tbody = document.querySelector("#sop-table tbody");
  tbody.innerHTML="";
  SOPs.forEach(sop=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${sop.empleado}</td>
      <td>${sop.departamento}</td>
      <td>${sop.objetivo}</td>
      <td>${sop.areas}</td>
      <td>${sop.resumen}</td>
      <td>${sop.estado}</td>
      <td><button class="read-btn">Leer</button></td>
    `;
    tr.querySelector("button").addEventListener("click", ()=>{
      currentSOP = sop;
      document.getElementById("sop-container").style.display="block";
      cargarSOP(sop.links);
    });
    tbody.appendChild(tr);
  });
}

// Cargar SOP en el contenedor
async function cargarSOP(url){
  try{
    const res = await fetch(url);
    const html = await res.text();
    const container = document.getElementById("sop-copy");
    container.innerHTML = html;
    container.addEventListener("click", activarComentario);
    cargarComentariosExistentes();
  }catch(err){
    document.getElementById("sop-copy").innerHTML = "<p style='color:red;'>No se pudo cargar el SOP</p>";
    console.error(err);
  }
}

// Activar modal al hacer clic
function activarComentario(e){
  if(e.target.classList.contains("comentario")) return;
  const rect = e.currentTarget.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;
  document.getElementById("modal").style.display="flex";
}

// Guardar comentario
document.getElementById("btn-save").addEventListener("click", async ()=>{
  const texto = document.getElementById("comentario-text").value.trim();
  if(!texto) return alert("Escribe algo");
  const comentarioDiv = document.createElement("div");
  comentarioDiv.className="comentario";
  comentarioDiv.style.left = clickX+"px";
  comentarioDiv.style.top = clickY+"px";
  comentarioDiv.textContent = texto;
  document.getElementById("sop-copy").appendChild(comentarioDiv);
  document.getElementById("modal").style.display="none";
  document.getElementById("comentario-text").value="";

  // Guardar en Sheet
  try{
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: currentSOP.id_sop,
        usuario: "Admin",
        correo: "admin@empresa.com",
        comentario: texto,
        x: clickX,
        y: clickY,
        page:1,
        url_doc: currentSOP.links
      })
    });
  }catch(err){ console.error("Error guardando comentario:",err); }
});

// Cancelar comentario
document.getElementById("btn-cancel").addEventListener("click", ()=>{
  document.getElementById("modal").style.display="none";
  document.getElementById("comentario-text").value="";
});

// Cargar comentarios existentes
async function cargarComentariosExistentes(){
  if(!currentSOP) return;
  try{
    const res = await fetch(`${SHEET_API}?comments=${currentSOP.id_sop}`);
    const data = await res.json();
    const container = document.getElementById("sop-copy");
    data.forEach(c=>{
      const div = document.createElement("div");
      div.className="comentario";
      div.style.left=c.x+"px";
      div.style.top=c.y+"px";
      div.textContent=c.comentario;
      container.appendChild(div);
    });
  }catch(err){ console.error(err); }
}

cargarTabla();
</script>

</body>
</html>
