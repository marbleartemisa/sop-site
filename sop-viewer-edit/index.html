<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial y Comentarios SOP - Artemisa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body { margin:0; font-family:'Inter',sans-serif; background:#f0f0f0; color:#1f2937; }

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
}
.logo{ display:flex; align-items:center; gap:10px; }
.logo img{ height:40px; }
.menu{ display:flex; gap:25px; }
.menu a{ color:white; text-decoration:none; font-weight:bold; transition:.3s; }
.menu a:hover{ color:#00aaff; }

/* OVERLAY Y TABLA */
.overlay { padding:20px; max-width:1200px; margin:auto;}
h2{ color:#003366; margin-bottom:15px; text-align:center;}
input, select{ padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; margin-bottom:10px;}
table{ width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
th, td{ padding:10px 12px; text-align:left; border-bottom:1px solid #ddd; }
th{ background:#003366; color:white;}
.estado{ display:inline-block; padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; text-transform:uppercase;}
.pendiente{background:#fff4cc; color:#b38f00;}
.tramite{background:#e6f0ff;color:#1a5fd0;}
.rechazado{background:#fdecea;color:#c62828;}
.aprobado{background:#e6f7ec;color:#1e7e34;}

/* CANVAS */
#canvas-overlay{ display:none; position:fixed; top:50px; left:0; width:100%; height:calc(100% - 50px); background:rgba(0,0,0,0.3); z-index:1000; overflow:auto; }
#sop-container{ position:relative; margin:20px auto; width:90%; max-width:1200px; background:white; border-radius:12px; padding:20px; }
#canvas-wrapper{ position:relative; width:100%; }

/* COMENTARIOS STICKY NOTES */
.comentario{
  position:absolute;
  border-radius:8px;
  padding:8px 12px;
  font-size:14px;
  color:white;
  max-width:250px;
  cursor:text;
  overflow-wrap:break-word;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  word-break: break-word;
  animation: fadeIn 0.3s;
}
.comentario .close-btn{
  position:absolute;
  top:2px; right:4px;
  font-size:12px;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

/* BOTÓN CERRAR SOP */
#btnCerrarSOP{ 
  position:fixed; 
  top:70px; 
  right:20px; 
  z-index:9999; 
  padding:8px 14px; 
  cursor:pointer; 
  background:#c00; 
  color:white; 
  border:none; 
  border-radius:8px; 
}

/* ANIMACIÓN RESALTADO */
@keyframes fadeIn {
  from { transform: scale(0.9); opacity:0; }
  to { transform: scale(1); opacity:1; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>
  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a>    
    <a href="#" onclick="openLogin('editor')">Editar SOP</a>  
    <a href="#" onclick="openLogin('admin')"><i class="fa-solid fa-user-shield"></i> Admin</a>
    <a href="https://marbleartemisa.github.io/artemisamarbleandcabinet/#">Portal-Web</a>  
  </div>
</div>

<div class="overlay">
  <h2>Historial de SOPs</h2>
  <input type="text" id="buscarSOP" placeholder="Buscar...">
  <select id="filtroEstado">
    <option value="">Todos los estados</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Trámite">Trámite</option>
    <option value="Rechazado">Rechazado</option>
    <option value="Aprobado">Aprobado</option>
  </select>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Departamento</th>
          <th>Objetivo</th>
          <th>Áreas</th>
          <th>Estado</th>
          <th>Fecha / Hora</th>
          <th>Abrir SOP</th>
        </tr>
      </thead>
      <tbody id="tablaSOP"></tbody>
    </table>
  </div>
</div>

<!-- Canvas flotante -->
<div id="canvas-overlay">
  <div id="sop-container">
    <button id="btnCerrarSOP" onclick="cerrarCanvas()">Cerrar SOP</button>
    <div id="canvas-wrapper"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
let comentarios=[], SOP_URL="", ID_SOP="";
const USUARIO = localStorage.getItem("usuario") || "Anonimo";
const CORREO = localStorage.getItem("correo") || "";

// Colores por usuario
const userColors = { "Anonimo":"#1abc9c", "admin":"#e67e22", "editor":"#3498db" };
function getUserColor(user){ return userColors[user]||"#9b59b6"; }

// Render tabla
async function renderTabla(){
  const tabla=document.getElementById("tablaSOP");
  tabla.innerHTML="";
  const filtro=document.getElementById("filtroEstado").value;
  const buscar=document.getElementById("buscarSOP").value.toLowerCase();
  try{
    const res=await fetch(SHEET_API);
    const data=await res.json();
    data.forEach(row=>{
      if(!row.ID_SOP) return;
      const sop={
        Timestamp: row.Timestamp||"",
        empleado: row.empleado||"",
        departamento: row.departamento||"",
        objetivo: row.objetivo||"",
        areas: row.areas||"",
        estado: row.estado||"Pendiente",
        ID_SOP: row.ID_SOP,
        url_doc: row.url_doc||row.links||""
      };
      if(filtro && sop.estado!==filtro) return;
      if(buscar && !(sop.empleado.toLowerCase()+sop.objetivo.toLowerCase()).includes(buscar)) return;
      const fila=document.createElement("tr");
      fila.innerHTML=`
        <td>${sop.empleado}</td>
        <td>${sop.departamento}</td>
        <td>${sop.objetivo}</td>
        <td>${sop.areas}</td>
        <td><span class="estado ${sop.estado.toLowerCase()}">${sop.estado}</span></td>
        <td>${new Date(sop.Timestamp).toLocaleString()}</td>
        <td><button onclick="abrirSOP('${sop.url_doc}','${sop.ID_SOP}')">💬 Abrir</button></td>
      `;
      tabla.appendChild(fila);
    });
  }catch(e){ console.error(e); alert("Error cargando SOPs"); }
}
document.getElementById("buscarSOP").addEventListener("input", renderTabla);
document.getElementById("filtroEstado").addEventListener("change", renderTabla);
renderTabla();

// Abrir SOP
async function abrirSOP(url,id){
  SOP_URL = url; 
  ID_SOP = id; 
  comentarios = [];
  const wrapper = document.getElementById("canvas-wrapper");
  document.getElementById("canvas-overlay").style.display = "block";
  wrapper.innerHTML = "Cargando SOP...";

  try{
    const res = await fetch(url);
    const html = await res.text();
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    tempDiv.querySelectorAll("script").forEach(s => s.remove());

    // Estilos para orden y legibilidad
    tempDiv.style.width = "900px";
    tempDiv.style.margin = "auto";
    tempDiv.style.padding = "20px";
    tempDiv.style.background = "#fff";
    tempDiv.style.fontFamily = "'Inter', sans-serif";
    tempDiv.style.lineHeight = "1.6";
    tempDiv.style.textIndent = "1em";

    // Zebra stripes y eliminar vacíos
    const elements = tempDiv.querySelectorAll("p, li, div");
    elements.forEach((el,i)=>{
      el.style.padding = "4px 6px";
      el.style.background = i % 2 === 0 ? "#f9f9f9" : "#ffffff";
      el.style.borderRadius = "4px";
      if(el.textContent.trim() === "") el.style.display = "none";
    });

    wrapper.innerHTML = "";
    wrapper.appendChild(tempDiv);

    await new Promise(r => setTimeout(r,300));
    const canvas = await html2canvas(tempDiv,{useCORS:true, scale:1});
    canvas.id = "sop-canvas";
    wrapper.innerHTML = "";
    wrapper.appendChild(canvas);
    canvas.addEventListener("click", crearComentarioDirecto);
    cargarComentariosExistentes();

  } catch(err){
    console.error(err);
    wrapper.innerHTML = "<p style='color:red;'>No se pudo cargar el SOP.</p>";
  }
}

// Cerrar SOP
function cerrarCanvas(){ 
  document.getElementById("canvas-overlay").style.display="none"; 
  document.getElementById("canvas-wrapper").innerHTML=""; 
}

// Crear comentario
function crearComentarioDirecto(e){
  const wrapper = document.getElementById("canvas-wrapper");
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const div = document.createElement("div");
  div.className = "comentario";
  div.style.left = x+"px";
  div.style.top = y+"px";
  div.style.background = getUserColor(USUARIO);
  div.contentEditable = "true";
  div.innerHTML = "Nuevo comentario...";
  wrapper.appendChild(div);

  // Seleccionar todo al enfocar
  div.addEventListener("focus", ()=>{
    if(div.getAttribute("data-temp") !== "editing"){
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(div);
      sel.removeAllRanges();
      sel.addRange(range);
      div.setAttribute("data-temp","editing");
    }
  });

  // Guardar comentario con Enter sin shift
  div.addEventListener("keydown",(ev)=>{
    if(ev.key==="Enter" && !ev.shiftKey){
      ev.preventDefault();
      const texto = div.textContent.trim();
      if(!texto){ div.remove(); return; }
      div.removeAttribute("data-temp");
      guardarComentario(div,x,y,texto);
    }
  });

  // Drag & drop
  let offsetX=0, offsetY=0, dragging=false;
  div.addEventListener("mousedown",(ev)=>{ dragging=true; offsetX=ev.offsetX; offsetY=ev.offsetY; });
  document.addEventListener("mousemove",(ev)=>{
    if(dragging){
      div.style.left=(ev.clientX - wrapper.getBoundingClientRect().left - offsetX)+"px";
      div.style.top=(ev.clientY - wrapper.getBoundingClientRect().top - offsetY)+"px";
    }
  });
  document.addEventListener("mouseup",()=>{
    if(dragging){
      dragging=false;
      const newX=parseInt(div.style.left), newY=parseInt(div.style.top);
      actualizarComentario(div.textContent.trim(),newX,newY);
    }
  });

  // Eliminar
  const closeBtn = document.createElement("span");
  closeBtn.className = "close-btn"; closeBtn.innerHTML="×";
  closeBtn.addEventListener("click",()=>{ div.remove(); eliminarComentario(x,y); });
  div.appendChild(closeBtn);
}

// Guardar
async function guardarComentario(div,x,y,texto){
  comentarios.push({x,y,comentario:texto});
  try{
    await fetch(SHEET_API,{
      method:"POST",
      body: JSON.stringify({tipo:"comentario",id_sop:ID_SOP,usuario:USUARIO,correo:CORREO,comentario:texto,x,y,page:1,url_doc:SOP_URL})
    });
  }catch(err){ console.error(err); }
}

// Actualizar posición
async function actualizarComentario(texto,x,y){
  try{
    await fetch(SHEET_API,{
      method:"POST",
      body: JSON.stringify({tipo:"update",id_sop:ID_SOP,usuario:USUARIO,correo:CORREO,comentario:texto,x,y,page:1,url_doc:SOP_URL})
    });
  }catch(err){ console.error(err); }
}

// Eliminar comentario
async function eliminarComentario(x,y){
  try{
    await fetch(SHEET_API,{
      method:"POST",
      body: JSON.stringify({tipo:"delete",id_sop:ID_SOP,x,y})
    });
  }catch(err){ console.error(err); }
}

// Cargar existentes
async function cargarComentariosExistentes(){
  try{
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    comentarios = data.map(c=>({x:c.x,y:c.y,comentario:c.comentario,usuario:c.usuario||"Anonimo"}));
    const wrapper = document.getElementById("canvas-wrapper");
    comentarios.forEach(c=>{
      const div = document.createElement("div");
      div.className = "comentario";
      div.style.left = c.x+"px";
      div.style.top = c.y+"px";
      div.style.background = getUserColor(c.usuario);
      div.textContent = c.comentario;
      wrapper.appendChild(div);
    });
  }catch(err){ console.error(err); }
}
</script>
</body>
</html>
