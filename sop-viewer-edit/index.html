<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca SOP - ARTEMISA MARBLE & CABINETS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f0f0f0; }
table { width:100%; border-collapse: collapse; margin-top:20px; background:#fff; }
th, td { padding:10px; border:1px solid #ccc; text-align:left; }
th { background:#333; color:#fff; }
input[type="text"] { padding:5px; width:200px; margin-bottom:10px; }
.btn-abrir-sop { padding:5px 10px; background:#007bff; color:#fff; border:none; cursor:pointer; border-radius:4px; }
.modal { display:none; position:fixed; z-index:999; left:0; top:0; width:100%; height:100%; overflow:auto; background:rgba(0,0,0,0.5); }
.modal-content { background:#fff; margin:50px auto; padding:20px; border-radius:8px; width:90%; max-width:1000px; position:relative; }
.modal-content iframe { border:0; }
.close { position:absolute; top:10px; right:20px; font-size:28px; font-weight:bold; cursor:pointer; }
.comment-marker { position:absolute; width:10px; height:10px; background:red; border-radius:50%; cursor:pointer; z-index:10; }
</style>
</head>
<body>

<h2>Biblioteca SOP</h2>
<input type="text" id="search-input" placeholder="Buscar SOP por resumen o departamento...">

<table id="sop-table">
  <thead>
    <tr>
      <th>Fecha</th>
      <th>Departamento</th>
      <th>Resumen</th>
      <th>Estado</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Modal SOP -->
<div id="modal-sop" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <iframe id="iframe-sop" src="" width="100%" height="600px"></iframe>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec';

// Cargar SOP
async function cargarSOP() {
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  const tbody = document.querySelector('#sop-table tbody');
  tbody.innerHTML = '';
  data.forEach(sop => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${sop.Timestamp}</td>
      <td>${sop.departamento}</td>
      <td>${sop.resumen}</td>
      <td>${sop.estado}</td>
      <td><button class="btn-abrir-sop" data-link="${sop.links}" data-id="${sop.ID_SOP}">Leer y Comentar</button></td>
    `;
    tbody.appendChild(tr);
  });
  activarBotones();
}

// Filtrado
document.getElementById('search-input').addEventListener('input', function(){
  const val = this.value.toLowerCase();
  document.querySelectorAll('#sop-table tbody tr').forEach(tr => {
    tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none';
  });
});

// Modal
const modal = document.getElementById('modal-sop');
const iframe = document.getElementById('iframe-sop');
document.querySelector('.close').addEventListener('click', () => {
  modal.style.display = 'none';
  iframe.src = '';
});

// Abrir SOP
function activarBotones() {
  document.querySelectorAll('.btn-abrir-sop').forEach(btn => {
    btn.addEventListener('click', () => {
      iframe.src = btn.dataset.link;
      modal.style.display = 'block';
      activarComentarios(btn.dataset.id);
    });
  });
}

// Comentarios flotantes
function activarComentarios(id_sop) {
  iframe.onload = () => {
    const doc = iframe.contentDocument || iframe.contentWindow.document;

    // Hacer clic en el documento para crear comentario
    doc.body.addEventListener('click', e => {
      const x = e.pageX;
      const y = e.pageY;

      const marker = doc.createElement('div');
      marker.className = 'comment-marker';
      marker.style.left = (x - doc.body.getBoundingClientRect().left - 5) + 'px';
      marker.style.top = (y - doc.body.getBoundingClientRect().top - 5) + 'px';
      doc.body.appendChild(marker);

      const texto = prompt('Escribe tu comentario:');
      if(texto) {
        // Guardar comentario en Google Sheets
        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            tipo: 'comentario',
            id_sop: id_sop,
            usuario: 'UsuarioPrueba',
            comentario: texto,
            x: x,
            y: y,
            page: 1,
            url_doc: iframe.src
          })
        }).then(res => res.json()).then(res => {
          if(res.success) alert('Comentario guardado');
        });
      } else {
        marker.remove();
      }
    }, { once: true });
  };
}

// Inicializar
cargarSOP();
</script>
</body>
</html>
