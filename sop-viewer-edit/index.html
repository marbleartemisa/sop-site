<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  h2 { text-align:center; margin:20px 0; }
  
  table { width:90%; margin: 0 auto 20px; border-collapse: collapse; background:#fff; }
  th, td { border:1px solid #ccc; padding:8px 12px; text-align:left; }
  th { background:#2563eb; color:white; }
  tr:hover { background:#e2e8f0; cursor:pointer; }

  /* Viewer */
  #sop-viewer {
    display:none;
    position:fixed;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    height:80%;
    background:#fff;
    border:2px solid #2563eb;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    z-index:100;
    overflow:auto;
    padding:10px;
  }

  /* Comentarios dentro del SOP */
  .comentario {
    position:absolute;
    background: rgba(255,255,0,0.7);
    border:1px solid #aaa;
    border-radius:4px;
    padding:2px 6px;
    font-size:12px;
    cursor:pointer;
    z-index:500;
  }

  /* Modal */
  #modal {
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    justify-content:center; align-items:center;
    z-index:1000;
  }
  #modal-content {
    background:#fff; padding:20px; border-radius:5px;
    width:300px;
  }
  #comentario-text { width:100%; height:80px; }
  #btn-save, #btn-cancel { margin-top:10px; padding:6px 12px; }
</style>
</head>
<body>

<h2>Leer y Comentar SOP</h2>

<table>
  <thead>
    <tr><th>Empleado</th><th>Departamento</th><th>Objetivo</th><th>Resumen</th></tr>
  </thead>
  <tbody id="tabla-body"></tbody>
</table>

<div id="sop-viewer"></div>

<!-- Modal comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea><br>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
let SOPs = [
  { empleado: "Damian Molina", departamento: "Administración", objetivo: "Compra de slabs", resumen: "Resumen 1", links: "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html", id_sop: "SOP-1" },
  { empleado: "Alberto Molina", departamento: "Producción", objetivo: "Control de inventario", resumen: "Resumen 2", links: "https://marbleartemisa.github.io/sop-site/produccion/SOP-INVENTARIO/index.html", id_sop: "SOP-2" }
];

const tbody = document.getElementById("tabla-body");
const viewer = document.getElementById("sop-viewer");
let clickX=0, clickY=0;
let comentarios=[]; // comentarios en memoria
let sopActual=null;

// Llenar tabla
function renderTabla() {
  tbody.innerHTML="";
  SOPs.forEach(sop=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${sop.empleado}</td><td>${sop.departamento}</td><td>${sop.objetivo}</td><td>${sop.resumen}</td>`;
    tr.addEventListener("click", ()=> seleccionarSOP(sop));
    tbody.appendChild(tr);
  });
}

// Abrir SOP en viewer
async function seleccionarSOP(sop) {
  sopActual=sop;
  viewer.innerHTML = "<p>Cargando SOP...</p>";
  viewer.style.display="block";
  try {
    const res = await fetch(sop.links);
    const html = await res.text();
    viewer.innerHTML = html;

    // Permitir agregar comentarios
    viewer.addEventListener("click", activarComentario);
    
    // Renderizar comentarios existentes
    renderComentarios();
  } catch(err) {
    viewer.innerHTML = "<p style='color:red;'>No se pudo cargar el SOP</p>";
    console.error(err);
  }
}

// Activar modal al hacer clic dentro del SOP
function activarComentario(e) {
  if(e.target.classList.contains("comentario")) return;
  const rect = viewer.getBoundingClientRect();
  clickX = e.clientX - rect.left + viewer.scrollLeft;
  clickY = e.clientY - rect.top + viewer.scrollTop;
  document.getElementById("modal").style.display="flex";
}

// Guardar comentario
document.getElementById("btn-save").addEventListener("click", ()=>{
  const text = document.getElementById("comentario-text").value.trim();
  if(!text) return alert("Escribe algo");
  
  const div = document.createElement("div");
  div.className="comentario";
  div.style.left=clickX+"px";
  div.style.top=clickY+"px";
  div.textContent=text;
  viewer.appendChild(div);

  comentarios.push({x:clickX, y:clickY, text});
  document.getElementById("modal").style.display="none";
  document.getElementById("comentario-text").value="";

  console.log("Comentario guardado (simulado):", {sop:sopActual.id_sop, x:clickX, y:clickY, text});
});

// Cancelar comentario
document.getElementById("btn-cancel").addEventListener("click", ()=>{
  document.getElementById("modal").style.display="none";
  document.getElementById("comentario-text").value="";
});

// Renderizar comentarios existentes en viewer
function renderComentarios() {
  comentarios.forEach(c=>{
    const div = document.createElement("div");
    div.className="comentario";
    div.style.left=c.x+"px";
    div.style.top=c.y+"px";
    div.textContent=c.text;
    viewer.appendChild(div);
  });
}

// Iniciar
renderTabla();
</script>

</body>
</html>
