<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer SOP - Comentarios</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nuevo&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background-image:url('/sop-site/wall0.png');
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;
    color:#1f2937;
  }

  .navbar { position:sticky; top:0; background:rgba(0,0,0,0.65); color:white; padding:10px 30px; display:flex; justify-content:space-between; align-items:center; z-index:1000; }
  .navbar .logo { display:flex; align-items:center; gap:10px; }
  .navbar .logo img { height:40px; }
  .navbar .menu a { color:white; margin-left:20px; text-decoration:none; font-weight:bold; }

  .overlay { min-height:100vh; padding:20px; max-width:1200px; margin:auto; }

  h2 { margin-bottom:15px; color:#003366; }

  input, select { margin-bottom:15px; padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; }

  .table-container { overflow-x:auto; margin-bottom:20px; }
  table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
  th { background:#003366; color:white; padding:12px 15px; text-align:left; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; word-break: break-word; white-space: normal; }
  th:nth-child(3), td:nth-child(3) { max-width: 250px; }
  th:nth-child(4), td:nth-child(4) { max-width: 200px; }

  .estado { display:inline-block; padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap; border:1px solid transparent; }
  .pendiente { background:#fff4cc; color:#b38f00; border-color:#ffe58f; }
  .tramite { background:#e6f0ff; color:#1a5fd0; border-color:#99c2ff; }
  .rechazado { background:#fdecea; color:#c62828; border-color:#f5a5a0; }
  .aprobado { background:#e6f7ec; color:#1e7e34; border-color:#9dd8b1; }

  .footer { text-align:center; padding:20px; color:white; background:rgba(0,0,0,0.65); margin-top:10px; }

  .notification { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:12px; color:white; font-weight:bold; z-index:9999; opacity:0.95; }
  .notification.success { background:#28a745; }
  .notification.error { background:#dc3545; }

  .file-icon { font-size:1.2rem; margin-right:5px; cursor:pointer; }
  .file-icon:hover { transform:scale(1.2); }

  #sop-container { position: relative; width:100%; margin:20px 0; border:1px solid #ccc; background:#fff; min-height:600px; }
  #canvas-wrapper { position: relative; }
  canvas { display:block; width:100%; }
  .comentario { position:absolute; background:rgba(255,255,0,0.8); border:1px solid #ccc; padding:4px 6px; border-radius:4px; font-size:12px; pointer-events:none; }

  /* Modal Comentarios */
  #modal { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; }
  #modal-content { background:#fff; padding:20px; border-radius:5px; width:300px; }
  #comentario-text { width:100%; height:80px; margin-top:5px; }
  #btn-save, #btn-cancel { margin-top:10px; margin-right:5px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>
  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a>
    <a href="#" onclick="adminLogin()"><i class="fa-solid fa-user-shield"></i> Admin</a>
  </div>
</div>

<div class="overlay">
  <h2>Lista de SOPs</h2>
  <input type="text" id="buscarSOP" placeholder="Buscar...">
  <select id="filtroEstado">
    <option value="">Todos los estados</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Trámite">Trámite</option>
    <option value="Rechazado">Rechazado</option>
    <option value="Aprobado">Aprobado</option>
  </select>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Departamento</th>
          <th>Objetivo</th>
          <th>Áreas</th>
          <th>Estado</th>
          <th>Fecha / Hora</th>
          <th>Ver SOP</th>
        </tr>
      </thead>
      <tbody id="tablaSOP"></tbody>
    </table>
  </div>

  <div id="sop-container">
    <div id="canvas-wrapper"></div>
  </div>
</div>

<div class="footer">© 2026 ARTEMISA MARBLE & CABINETS</div>

<!-- Modal Comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

let comentarios = [];
let clickX = 0, clickY = 0;
let ID_SOP = "";
let SOP_URL = "";
let USUARIO = "TuNombre";
let CORREO = "tucorreo@empresa.com";

// Render tabla de SOPs
async function renderTabla() {
  const tabla = document.getElementById("tablaSOP");
  tabla.innerHTML = "";
  const filtroEstado = document.getElementById("filtroEstado").value;
  const buscar = document.getElementById("buscarSOP").value.toLowerCase();

  try {
    const res = await fetch(SHEET_API);
    const data = await res.json();

    data.forEach(row => {
      const sop = {
        Timestamp: row.Timestamp || "",
        empleado: row.empleado || "",
        correo: row.correo || "",
        departamento: row.departamento || "",
        objetivo: row.objetivo || "",
        areas: row.areas || "",
        estado: row.estado || "Pendiente",
        links: row.links || "",
        ID_SOP: row.ID_SOP || "",
        url_doc: row.url_doc || ""  // URL del SOP
      };

      if (filtroEstado && sop.estado !== filtroEstado) return;
      if (buscar && !(sop.empleado.toLowerCase() + sop.objetivo.toLowerCase() + sop.departamento.toLowerCase()).includes(buscar)) return;

      let estadoClass = "pendiente";
      if (sop.estado === "Trámite") estadoClass = "tramite";
      if (sop.estado === "Rechazado") estadoClass = "rechazado";
      if (sop.estado === "Aprobado") estadoClass = "aprobado";

      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${sop.empleado}</td>
        <td>${sop.departamento}</td>
        <td>${sop.objetivo}</td>
        <td>${sop.areas}</td>
        <td><span class="estado ${estadoClass}">${sop.estado}</span></td>
        <td>${new Date(sop.Timestamp).toLocaleString()}</td>
        <td><button onclick="cargarSOP('${sop.url_doc}','${sop.ID_SOP}')">💬 Revisar / Comentar</button></td>
      `;
      tabla.appendChild(fila);
    });

  } catch(err) {
    console.error(err);
    alert("Error cargando SOPs");
  }
}

async function cargarSOP(url, id) {
  SOP_URL = url;
  ID_SOP = id;
  comentarios = [];

  try {
    const response = await fetch(SOP_URL);
    const html = await response.text();

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    tempDiv.style.width = "800px";
    tempDiv.style.padding = "20px";
    tempDiv.style.background = "#fff";

    const wrapper = document.getElementById('canvas-wrapper');
    wrapper.innerHTML = "";
    wrapper.appendChild(tempDiv);

    await new Promise(res => setTimeout(res, 500));

    const canvas = await html2canvas(tempDiv, {useCORS:true, scale:1});
    canvas.id = "sop-canvas";

    wrapper.innerHTML = "";
    wrapper.appendChild(canvas);

    canvas.addEventListener('click', activarComentario);

    cargarComentariosExistentes();

  } catch(err) {
    console.error(err);
    document.getElementById('canvas-wrapper').innerHTML = "<p style='color:red;'>No se pudo cargar el SOP.</p>";
  }
}

// Activar modal
function activarComentario(e) {
  const rect = e.target.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;
  document.getElementById('modal').style.display = 'flex';
}

// Guardar comentario
document.getElementById('btn-save').addEventListener('click', async () => {
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo antes de guardar");

  comentarios.push({x:clickX, y:clickY, comentario:texto});
  dibujarComentarios();
  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";

  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: clickX,
        y: clickY,
        page: 1,
        url_doc: SOP_URL
      })
    });
    console.log("Comentario guardado en Sheet");
  } catch(err) {
    console.error("Error guardando comentario:", err);
  }
});

document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";
});

function dibujarComentarios() {
  const wrapper = document.getElementById('canvas-wrapper');
  wrapper.querySelectorAll('.comentario').forEach(el => el.remove());
  comentarios.forEach(c => {
    const div = document.createElement('div');
    div.className = "comentario";
    div.style.left = c.x + "px";
    div.style.top = c.y + "px";
    div.textContent = c.comentario;
    wrapper.appendChild(div);
  });
}

async function cargarComentariosExistentes() {
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    comentarios = data.map(c=>({x:c.x, y:c.y, comentario:c.comentario}));
    dibujarComentarios();
  } catch(err) {
    console.error("Error cargando comentarios:", err);
  }
}

document.getElementById("buscarSOP").addEventListener("input", renderTabla);
document.getElementById("filtroEstado").addEventListener("change", renderTabla);

renderTabla();

function adminLogin(){
  const password = prompt("Ingrese contraseña de administrador");
  if(password==="Artemisa2026") window.location.href="/sop-site/admin/";
  else alert("Acceso denegado");
}
</script>

</body>
</html>
