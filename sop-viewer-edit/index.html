<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP - Artemisa</title>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f7;
}

/* TOPBAR */
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
}
.brand { font-weight: 600; letter-spacing: .4px; font-size: 15px; }
.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}
.tool:hover { background: #2563eb; color: white; }
.tool.disabled { opacity: .5; pointer-events: none; }

/* DOC AREA */
.doc-area { margin-top: 70px; display: flex; justify-content: center; padding: 10px; }
.doc-frame {
    position: relative;
    width: 100%;
    max-width: 1100px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    padding: 20px;
}
.doc-copy { position: relative; }

/* COMENTARIOS FLOTANTES */
.floating-comment {
    position: absolute;
    pointer-events: auto;
    z-index: 999;
}
.floating-comment div {
    background: rgba(255,255,255,0.9);
    border-left: 4px solid #dc2626;
    color: #dc2626;
    padding: 6px;
    border-radius: 6px;
    font-size: 12px;
    font-style: italic;
    max-width: 220px;
    word-wrap: break-word;
}

/* CLICK LAYER */
#clickLayer {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:500;
    cursor: crosshair;
    display:none;
}

/* COMMENT MODAL */
#commentModal {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:400px;
    max-width:90%;
    background:white;
    z-index:1000;
    border-radius:14px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}
#commentModal textarea {
    width:100%;
    height:80px;
    resize:none;
}
#commentModal button { margin-top:10px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <div>
    <button class="tool" onclick="activateCommentMode()">💬 Comentar</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame" id="docFrame">
    <div class="doc-copy" id="docCopy">
      <!-- Aquí se carga la copia del SOP -->
    </div>
    <div id="clickLayer"></div>
  </div>
</div>

<div id="commentModal">
  <h3>💬 Nuevo comentario</h3>
  <textarea id="commentInput" placeholder="Escribe tu comentario..."></textarea>
  <div style="text-align:right;">
    <button onclick="closeCommentModal()">Cancelar</button>
    <button onclick="saveComment()">Guardar</button>
  </div>
</div>

<script>
// ================= GLOBAL =================
let editMode = true; // Por ahora activo
let currentUser = "Yoandry Perez";
let comments = [];

// ================= CARGAR SOP =================
async function loadSOP(url) {
    try {
        const res = await fetch(url);
        const html = await res.text();
        const container = document.getElementById("docCopy");
        container.innerHTML = html; // carga la copia dentro del viewer
    } catch(e) { console.error("Error cargando SOP:", e); }
}
// Ejemplo: reemplaza con tu URL de SOP HTML
loadSOP("https://marbleartemisa.github.io/sop-site/sample-sop.html");

// ================= COMENTARIOS =================
const clickLayer = document.getElementById("clickLayer");
let newCommentPos = {x:0,y:0};

function activateCommentMode() {
    clickLayer.style.display = "block";
    clickLayer.onclick = e => {
        const rect = document.getElementById("docCopy").getBoundingClientRect();
        newCommentPos = { 
            x: e.clientX - rect.left, 
            y: e.clientY - rect.top 
        };
        openCommentModal();
        clickLayer.style.display="none";
    };
}

function openCommentModal() { 
    document.getElementById("commentInput").value = "";
    document.getElementById("commentModal").style.display = "block";
}
function closeCommentModal() {
    document.getElementById("commentModal").style.display = "none";
}

function saveComment() {
    const text = document.getElementById("commentInput").value.trim();
    if(!text) return alert("Comentario vacío");

    const container = document.getElementById("docCopy");
    const div = document.createElement("div");
    div.className = "floating-comment";
    div.style.left = newCommentPos.x + "px";
    div.style.top = newCommentPos.y + "px";
    div.innerHTML = `<div>${text}</div>`;
    container.appendChild(div);

    // Guardar en memoria (puedes enviar a tu backend o Google Sheets)
    comments.push({
        user: currentUser,
        text,
        x: newCommentPos.x,
        y: newCommentPos.y
    });

    closeCommentModal();
}

// ================= REDIMENSION =================
window.addEventListener("resize", () => {
    // Si quieres reposicionar comentarios dinámicamente
});
</script>
</body>
</html>
