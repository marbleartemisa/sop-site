<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca SOP - Artemisa</title>
<style>
body {
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:#eef2f7;
}
.topbar {
    background:#0f172a;
    color:white;
    padding:14px 28px;
    display:flex;
    align-items:center;
    position:fixed;
    width:100%;
    top:0;
    z-index:100;
}
.brand { font-weight:600; font-size:16px; }
.container { max-width:1200px; margin:100px auto 40px; padding:0 15px; }
table { width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,.1); }
th, td { padding:12px 15px; text-align:left; }
th { background:#2563eb; color:white; }
tr:nth-child(even) { background:#f8fafc; }
button { padding:6px 12px; border:none; border-radius:6px; background:#2563eb; color:white; cursor:pointer; transition:.2s; }
button:hover { background:#1e40af; }
input[type="text"] { width:100%; padding:8px 12px; margin-bottom:12px; border-radius:6px; border:1px solid #cbd5e1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • BIBLIOTECA</div>
</div>

<div class="container">
  <h2>Listado de SOPs</h2>
  <input type="text" id="searchInput" placeholder="Buscar SOP por nombre, departamento o área...">

  <table id="sopTable">
    <thead>
      <tr>
        <th>Resumen</th>
        <th>Departamento</th>
        <th>Área</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llena dinámicamente -->
    </tbody>
  </table>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

let sopData = [];

// ===== Cargar SOPs desde Sheet =====
async function loadSOPs() {
    try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        sopData = data || [];
        renderTable(sopData);
    } catch(err) {
        console.error("Error cargando SOPs:", err);
        alert("No se pudieron cargar los SOPs");
    }
}

// ===== Renderizar tabla =====
function renderTable(data) {
    const tbody = document.querySelector("#sopTable tbody");
    tbody.innerHTML = "";
    data.forEach(sop => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${sop.resumen || "--"}</td>
            <td>${sop.departamento || "--"}</td>
            <td>${sop.areas || "--"}</td>
            <td>${sop.estado || "--"}</td>
            <td><button onclick="openViewer('${encodeURIComponent(sop.links)}','${sop.ID_SOP}')">Leer y Comentar</button></td>
        `;
        tbody.appendChild(tr);
    });
}

// ===== Abrir SOP editable =====
function openViewer(doc, id) {
    const url = `viewer-edit.html?doc=${doc}&id=${id}`;
    window.open(url,"_blank");
}

// ===== Buscador =====
document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    const filtered = sopData.filter(sop => 
        (sop.resumen || "").toLowerCase().includes(q) ||
        (sop.departamento || "").toLowerCase().includes(q) ||
        (sop.areas || "").toLowerCase().includes(q)
    );
    renderTable(filtered);
});

// ===== Inicializar =====
loadSOPs();
</script>

</body>
</html>
