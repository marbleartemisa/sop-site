<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  #sop-container { position: relative; width: 80%; margin: 20px auto; border: 1px solid #ccc; background:#fff; overflow: auto; }
  #sop-copy { position: relative; padding:20px; min-height:600px; }
  .comentario { position: absolute; color: red; font-weight: bold; cursor: pointer; }
  #modal { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; }
  #modal-content { background:#fff; padding:20px; border-radius:5px; width:300px; }
  #comentario-text { width:100%; height:80px; }
  #btn-save { margin-top:10px; }
</style>
</head>
<body>

<h2 style="text-align:center;">Leer y Comentar SOP</h2>

<div id="sop-container">
  <div id="sop-copy"></div>
</div>

<!-- Modal para escribir comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

// Configura aquí la URL del SOP desde tu tabla
const SOP_URL = "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html"; 
const ID_SOP = "SOP-1774461381359-0";
const USUARIO = "TuNombre"; // Opcional
const CORREO = "tucorreo@empresa.com";

// Variables para crear comentario
let clickX = 0;
let clickY = 0;

// Función para cargar el SOP dentro de #sop-copy
async function cargarSOP() {
  try {
    const response = await fetch(SOP_URL);
    const html = await response.text();
    const container = document.getElementById('sop-copy');
    container.innerHTML = html;
    container.addEventListener('click', activarComentario);
    cargarComentariosExistentes();
  } catch(err) {
    document.getElementById('sop-copy').innerHTML = "<p style='color:red;'>No se pudo cargar el SOP. Verifica la URL.</p>";
    console.error(err);
  }
}

// Activar modal para comentario
function activarComentario(e) {
  // Evita que al hacer clic en un comentario existente se abra otro modal
  if(e.target.classList.contains('comentario')) return;

  const rect = e.currentTarget.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;

  document.getElementById('modal').style.display = 'flex';
}

// Guardar comentario
document.getElementById('btn-save').addEventListener('click', async () => {
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo antes de guardar");

  const comentarioDiv = document.createElement('div');
  comentarioDiv.className = "comentario";
  comentarioDiv.style.left = clickX + 'px';
  comentarioDiv.style.top = clickY + 'px';
  comentarioDiv.textContent = texto;
  document.getElementById('sop-copy').appendChild(comentarioDiv);

  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";

  // Guardar en Sheet
  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: clickX,
        y: clickY,
        page: 1,
        url_doc: SOP_URL
      })
    });
    console.log("Comentario guardado en Sheet");
  } catch(err) {
    console.error("Error guardando comentario:", err);
  }
});

// Cancelar comentario
document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";
});

// Cargar comentarios existentes desde Sheet
async function cargarComentariosExistentes() {
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    const container = document.getElementById('sop-copy');

    data.forEach(c => {
      const comentarioDiv = document.createElement('div');
      comentarioDiv.className = "comentario";
      comentarioDiv.style.left = c.x + 'px';
      comentarioDiv.style.top = c.y + 'px';
      comentarioDiv.textContent = c.comentario;
      container.appendChild(comentarioDiv);
    });

  } catch(err) {
    console.error("Error cargando comentarios:", err);
  }
}

// Iniciar
cargarSOP();
</script>

</body>
</html>
