<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#f0f0f0;
}

#sop-container {
  width: 90%;
  margin: 20px auto;
  background:#fff;
  border:1px solid #ccc;
}

#sop-wrapper {
  position: relative;
  width: 100%;
  height: 800px;
}

#sop-frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* 🔥 overlay desactivado por defecto */
#overlay {
  position: absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events: none;
}

/* comentarios */
.comentario {
  position: absolute;
  background: #fff;
  border:1px solid red;
  border-radius:6px;
  padding:5px;
  font-size:11px;
  max-width:160px;
  pointer-events: auto;
}

/* modal */
#modal {
  display:none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

#modal-content {
  background:#fff;
  padding:20px;
  border-radius:8px;
  width:320px;
}

#comentario-text {
  width:100%;
  height:100px;
}

button {
  margin-top:10px;
  margin-right:5px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Leer y Comentar SOP</h2>

<div style="text-align:center;">
  <button id="modo-btn">Modo: Leer</button>
</div>

<div id="sop-container">
  <div id="sop-wrapper">
    <iframe id="sop-frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea><br>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

const SOP_URL = "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html";
const ID_SOP = "SOP-1774461381359-0";

let clickX = 0;
let clickY = 0;
let modoComentario = false;

const overlay = document.getElementById('overlay');

/* cargar SOP */
document.getElementById('sop-frame').src = SOP_URL;

/* toggle modo */
document.getElementById('modo-btn').addEventListener('click', () => {
  modoComentario = !modoComentario;

  overlay.style.pointerEvents = modoComentario ? 'auto' : 'none';

  document.getElementById('modo-btn').textContent =
    modoComentario ? "Modo: Comentar" : "Modo: Leer";
});

/* click */
overlay.addEventListener('click', (e) => {
  if(!modoComentario) return;
  if(e.target.classList.contains('comentario')) return;

  const rect = overlay.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;

  document.getElementById('modal').style.display = 'flex';
});

/* guardar */
document.getElementById('btn-save').addEventListener('click', async () => {
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo");

  const xRel = clickX / overlay.clientWidth;
  const yRel = clickY / overlay.clientHeight;

  crearComentario(texto, xRel, yRel);

  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";

  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        comentario: texto,
        x: xRel,
        y: yRel
      })
    });
  } catch(err) {
    console.error(err);
  }
});

/* crear comentario */
function crearComentario(texto, xRel, yRel){
  const div = document.createElement('div');
  div.className = "comentario";

  div.dataset.x = xRel;
  div.dataset.y = yRel;

  div.style.left = (xRel * overlay.clientWidth) + "px";
  div.style.top = (yRel * overlay.clientHeight) + "px";

  div.innerHTML = `<strong>💬</strong><br>${texto}`;

  overlay.appendChild(div);
}

/* cancelar */
document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
});

/* cargar comentarios */
async function cargarComentarios(){
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();

    data.forEach(c => {
      crearComentario(c.comentario, c.x, c.y);
    });

  } catch(err){
    console.error(err);
  }
}

/* resize */
window.addEventListener('resize', () => {
  document.querySelectorAll('.comentario').forEach(div => {
    const x = div.dataset.x;
    const y = div.dataset.y;

    div.style.left = (x * overlay.clientWidth) + "px";
    div.style.top = (y * overlay.clientHeight) + "px";
  });
});

/* iniciar */
cargarComentarios();
</script>

</body>
</html>
