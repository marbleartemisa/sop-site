<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#f0f0f0;
}

#sop-container {
  width: 90%;
  margin: 20px auto;
  background:#fff;
  border:1px solid #ccc;
}

#sop-wrapper {
  position: relative;
  width: 100%;
  height: 800px;
}

#sop-frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* 🔥 overlay desactivado por defecto */
#overlay {
  position: absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events: none;
}

/* comentarios */
.comentario {
  position: absolute;
  background: #fff;
  border:1px solid red;
  border-radius:6px;
  padding:5px;
  font-size:11px;
  max-width:160px;
  pointer-events: auto;
}

/* modal */
#modal {
  display:none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

#modal-content {
  background:#fff;
  padding:20px;
  border-radius:8px;
  width:320px;
}

#comentario-text {
  width:100%;
  height:100px;
}

button {
  margin-top:10px;
  margin-right:5px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Leer y Comentar SOP</h2>

<div style="text-align:center;">
  <button id="modo-btn">Modo: Leer</button>
</div>

<div id="sop-container">
  <div id="sop-wrapper">
    <iframe id="sop-frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea><br>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
// ====================== VARIABLES GLOBALES ======================
let editMode = false;
let currentUser = "";
let selectedTextGlobal = "";
let currentPage = 1;

const params = new URLSearchParams(window.location.search);
let doc = params.get("doc") || "";       // URL del documento
let idSOP = params.get("id") || "";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

const frame = document.getElementById("frame");
if(doc) frame.src = doc;

const users = {
  "Damian Molina":"Dam1975",
  "Alberto Molina":"Alb1975",
  "Gabriel Batista":"Gab1975",
  "Jenny Perez":"Jen1975",
  "Yoandry Perez":"Yoa1975",
  "Wendy Romanach":"Wen1975",
  "Otros":"Otr1975"
};

// ====================== LOGIN ======================
function showLogin(){ document.getElementById("loginOverlay").style.display="flex"; }
function closeLogin(){ document.getElementById("loginOverlay").style.display="none"; }

function checkLogin(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const msg = document.getElementById("loginMessage");
  if(!user){ msg.innerText="Seleccione usuario"; return; }
  if(users[user]!==pass){ msg.innerText="Clave incorrecta"; return; }
  editMode = true; currentUser = user;
  document.getElementById("commentUser").value = user;
  setEditModeUI(true);
  document.getElementById("commentSidebar").classList.add("active");
  loadComments();
  closeLogin();
}

function setEditModeUI(enabled){
  document.getElementById("commentUser").disabled = !enabled;
  document.getElementById("commentType").disabled = !enabled;
  document.getElementById("commentStatus").disabled = !enabled;
  const btn = document.getElementById("commentBtn");
  if(btn) btn.classList.toggle("disabled", !enabled);
}

// Permitir login con Enter
document.getElementById("loginPass").addEventListener("keypress", function(e){
  if(e.key === "Enter") checkLogin();
});

// ====================== SIDEBAR ======================
function closeSidebar(){ document.getElementById("commentSidebar").classList.remove("active"); }
document.getElementById("toggleSidebarBtn").addEventListener("click", ()=>{ document.getElementById("commentSidebar").classList.toggle("active"); });

// ====================== CARGAR DOCUMENTO ======================
function getDocUrlForPage(n){ return doc; } // ajustar si cada página es diferente
function loadSOPPage(n){ currentPage=n; frame.src=getDocUrlForPage(n); }
function prevSOP(){ if(currentPage>1){ currentPage--; loadSOPPage(currentPage); } }
function nextSOP(){ currentPage++; loadSOPPage(currentPage); }

frame.addEventListener("load", ()=> renderCommentsForPage(currentPage));

// ====================== COMENTARIOS ======================
function commentSelectedText() {
  if(!editMode){ alert("Activa modo edición"); return; }
  const clickLayer = document.getElementById("clickLayer");
  clickLayer.style.display="block";
  clickLayer.onclick = (e)=>{
    const rect = document.querySelector(".doc-frame").getBoundingClientRect();
    const x = e.clientX - rect.left + frame.scrollLeft;
    const y = e.clientY - rect.top + frame.scrollTop;
    const text_selected = window.getSelection().toString() || "";
    const context_before = text_selected.substring(0,10);
    const context_after  = text_selected.slice(-10);
    openCommentModal({x,y,text_selected,context_before,context_after,page:currentPage});
    clickLayer.style.display="none";
  };
}

function openCommentModal(data){
  const modal = document.getElementById("commentModal");
  modal.style.display="block";
  modal.dataset.x=data.x;
  modal.dataset.y=data.y;
  modal.dataset.text_selected=data.text_selected;
  modal.dataset.context_before=data.context_before;
  modal.dataset.context_after=data.context_after;
  modal.dataset.page=data.page;
  document.getElementById("commentInput").value="";
}
function closeCommentModal(){ document.getElementById("commentModal").style.display="none"; }

// ====================== GUARDAR COMENTARIO ======================
async function saveComment() {
  const modal = document.getElementById("commentModal");
  const btn = document.getElementById("saveCommentBtn");
  if(btn.disabled) return; // evita doble clic
  btn.disabled = true;

  const text = document.getElementById("commentInput").value.trim();
  if (!text) { alert("Comentario vacío"); btn.disabled = false; return; }

  const newComment = {
    id_comment: Date.now().toString(),
    usuario: currentUser || "Anónimo",
    tipo: document.getElementById("commentType").value,
    estado_revision: "Pendiente",
    comentario: text,
    text_selected: modal.dataset.text_selected,
    context_before: modal.dataset.context_before,
    context_after: modal.dataset.context_after,
    x: parseInt(modal.dataset.x),
    y: parseInt(modal.dataset.y),
    page: parseInt(modal.dataset.page)
  };

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ ...newComment, id_sop: idSOP, tipo: "comentario" })
    });
    const result = await res.json();
    if(result.success){
      if(!window.loadedComments) window.loadedComments=[];
      window.loadedComments.push(newComment);
      renderCommentsForPage(currentPage);
      closeCommentModal();
    } else {
      alert("Error guardando comentario: "+result.error);
    }
  } catch(err){
    alert("Error guardando comentario: "+err);
  } finally {
    btn.disabled = false;
  }
}

// ====================== RENDER COMENTARIOS ======================
function renderCommentsForPage(pageNumber){
  const container = document.getElementById("commentsLayer");
  container.innerHTML = "";
  if(!window.loadedComments) return;

  window.loadedComments
    .filter(c => Number(c.page) === pageNumber && c.estado_revision !== "Revisado")
    .forEach(c => {
      const el = document.createElement("div");
      el.className = "floating-comment";
      el.style.left = (parseInt(c.x) || 0) + "px";
      el.style.top = (parseInt(c.y) || 0) + "px";
      el.innerHTML = `<div>${c.comentario}</div>`;
      container.appendChild(el);
    });
}

// ====================== CARGAR COMENTARIOS DESDE SHEET ======================
async function loadComments(){
  const loader = document.getElementById("commentsLoader");
  loader.style.display="block";
  try{
    const res = await fetch(SCRIPT_URL + "?comments=" + idSOP);
    const data = await res.json();
    window.loadedComments = data || [];
    renderCommentsForPage(currentPage);
  } catch(err){
    console.error("Error cargando comentarios:", err);
  } finally {
    loader.style.display="none";
  }
}

// ====================== DOC FUNCIONES ======================
function openNew(){ window.open(doc,"_blank"); }
function downloadDoc(){ window.open(doc,"_blank"); }
function printDoc(){ frame.contentWindow.print(); }
</script>

</body>
</html>
