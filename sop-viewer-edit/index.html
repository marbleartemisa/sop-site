  {usuario:"Krishna Rojas", clave:"Kri1975", rol:"editor", depto:"Diseño", correo:"jobs@artemisamarble.com"},
  {usuario:"Juan Pablo", clave:"Jua1975", rol:"editor", depto:"Diseño", correo:"sales3@artemisamarble.com"},
  {usuario:"Gregorio Abreu", clave:"Gre1975", rol:"editor", depto:"Diseño", correo:"stone@artemisamarble.com"},

];
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

// VARIABLES
let comentarios=[], clickX=0, clickY=0, SOP_URL="", ID_SOP="";
let modoComentario = false;
const USUARIO = localStorage.getItem("usuario") || "";
const CORREO = localStorage.getItem("correo") || "";
  
const deptMap = {
  instalacion: "Stone",
  produccion: "Carpinteria",
  comercial: "Comercial",
  administracion: "Administración",
  maquinarias: "Maquinarias",
  vehiculos: "Vehículos"
};
  
function normalizarDepartamento(dep){
  if(!dep) return "";

  const mapa = {
    "instalacion": "stone",
    "produccion": "carpinteria"
  };

  return mapa[dep.toLowerCase()] || dep.toLowerCase();
}

function capitalizar(texto){
  if(!texto) return "";
  return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
}

// TABLA SOP
async function cargarDatos(){
  const res = await fetch(SHEET_API);
  const data = await res.json();
  cacheSOP = data;
  renderTabla();
}

async function renderTabla(){
  const tabla = document.getElementById("tablaSOP");
  tabla.innerHTML = "";

  const filtro = document.getElementById("filtroEstado").value;
  const filtroDepto = document.getElementById("filtroDepartamento")?.value || "";
  const buscar = document.getElementById("buscarSOP").value.toLowerCase().trim();

  try{

    const data = cacheSOP || [];

    // 🔥 PROTECCIÓN: evita renders desordenados
    const token = ++renderToken;

    const unicosMap = new Map();

    // 🔥 LIMPIEZA DE DUPLICADOS
    for (const row of data) {

      if (!row || !row.ID_SOP) continue;

      const key = String(row.ID_SOP).trim();
      if (!key) continue;

      const existente = unicosMap.get(key);

      if (!existente) {
        unicosMap.set(key, row);
        continue;
      }

      const fechaNueva = new Date(row.Timestamp || 0).getTime();
      const fechaVieja = new Date(existente.Timestamp || 0).getTime();

      if (fechaNueva >= fechaVieja) {
        unicosMap.set(key, row);
      }
    }

    const dataLimpia = Array.from(unicosMap.values());

    for (const row of dataLimpia) {

      if (token !== renderToken) return; // 🔥 cancela renders viejos

      const sop = {
        Timestamp: row.Timestamp || "",
        empleado: row.empleado || "",
        departamento: row.departamento || "",
        objetivo: row.objetivo || "",
        areas: row.areas || "",
        estado: row.estado || "Pendiente",
        ID_SOP: row.ID_SOP,
        url_doc: row.url_doc || row.links || ""
      };

      // 🔥 FILTRO DEPARTAMENTO
      if (filtroDepto && sop.departamento.toLowerCase() !== filtroDepto.toLowerCase()) {
        continue;
      }

      // 🔥 FILTRO ESTADO
      if (filtro && sop.estado !== filtro) {
        continue;
      }

      // 🔥 TEXTO BUSQUEDA
      const textoBusqueda = [
          sop.objetivo,
          sop.departamento,
          sop.areas,
          sop.empleado
        ].join(" ").toLowerCase();

        if (buscar) {
          const query = buscar.trim().toLowerCase();
          const palabras = query.split(/\s+/).filter(Boolean);
          const texto = textoBusqueda.toLowerCase();
        
          const coincide = palabras.every(p => texto.includes(p));
          if (!coincide) continue;
        }

      const depKey = (sop.departamento || "").toLowerCase();
      const areaKey = (sop.areas || "").toLowerCase();

      const depLabel = deptMap[depKey] || sop.departamento;
      const areaLabel = deptMap[areaKey] || sop.areas;

      const fila = document.createElement("tr");

      fila.innerHTML = `
        <td>${sop.empleado}</td>

        <td>
          <span class="badge dept-${depKey}">
            ${depLabel}
          </span>
        </td>

        <td>${sop.objetivo}</td>

        <td>
          <span class="badge dept-${areaKey}">
            ${areaLabel}
          </span>
        </td>

        <td>
          <span class="estado ${sop.estado.toLowerCase()}">
            ${sop.estado}
          </span>
        </td>

        <td>
          ${sop.Timestamp ? new Date(sop.Timestamp).toLocaleString() : ""}
        </td>

        <td>
          <button class="btn-icon"
            onclick="abrirSOP('${sop.url_doc}','${sop.ID_SOP}')">
            <i class="fa-solid fa-comment-dots"></i>
          </button>
        </td>
      `;

      tabla.appendChild(fila);
    }

  }catch(e){
    console.error(e);
    alert("Error cargando SOPs");
  }
}

// 🔥 EVENTOS
    document.getElementById("buscarSOP").addEventListener("input", () => {
      clearTimeout(timeout);
      timeout = setTimeout(renderTabla, 300);

    document.getElementById("filtroEstado").addEventListener("change", renderTabla);

cargarDatos();


// ABRIR SOP
async function abrirSOP(url,id){
  SOP_URL=url; ID_SOP=id; comentarios=[];
  const wrapper=document.getElementById("canvas-wrapper");
  document.getElementById("canvas-overlay").style.display="block";
  wrapper.innerHTML="Cargando SOP...";
  try{
    const res = await fetch(url);
    const html = await res.text();
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    tempDiv.querySelectorAll("script").forEach(s=>s.remove());
    tempDiv.style.width="900px"; tempDiv.style.margin="auto"; tempDiv.style.padding="20px"; tempDiv.style.background="#fff";
    wrapper.innerHTML=""; wrapper.appendChild(tempDiv);
    await new Promise(r=>setTimeout(r,300));
    const canvas = await html2canvas(tempDiv,{useCORS:true, scale:1});
    canvas.id="sop-canvas";
    wrapper.innerHTML=""; wrapper.appendChild(canvas);
//  canvas.addEventListener("click", activarComentario);
    cargarComentariosExistentes();
  }catch(err){
    console.error(err);
    wrapper.innerHTML="<p style='color:red;'>No se pudo cargar el SOP.</p>";
  }
}

// CERRAR
function cerrarCanvas(){
  document.getElementById("canvas-overlay").style.display="none";
  document.getElementById("canvas-wrapper").innerHTML="";
}

  function activarModoComentario(){

    modoComentario = true;
    alert(
      "Haz clic en el lugar del SOP donde deseas colocar el comentario"
    );
    const canvas =
      document.getElementById("sop-canvas");
    if(canvas){
        canvas.addEventListener(
          "click",
          seleccionarPosicionComentario,
          { once:true }
        );
    }
}

  function seleccionarPosicionComentario(e){

    modoComentario = false;

    const rect = e.target.getBoundingClientRect();

    clickX = e.clientX - rect.left;

    clickY = e.clientY - rect.top;

    document.getElementById("comentario-text").value = "";

    document.getElementById("modal").style.display =
      "flex";

}

  // 🔹 Destacar opción de menú según URL
function destacarMenu() {
  const links = document.querySelectorAll(".menu a");
  const path = window.location.pathname; // ruta actual
  links.forEach(link => {
    if (link.getAttribute("href") === path) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  destacarMenu();
});

// COMENTARIOS

function activarComentario(e){
    const rect = e.target.getBoundingClientRect();
    clickX = e.clientX - rect.left;
    clickY = e.clientY - rect.top;

    // Crear un div editable
    const wrapper = document.getElementById("canvas-wrapper");
    const editDiv = document.createElement("div");
    editDiv.contentEditable = "true";
    editDiv.className = "comentario editable";
    editDiv.style.left = clickX + "px";
    editDiv.style.top = clickY + "px";
    editDiv.style.pointerEvents = "auto"; // para que se pueda escribir
    editDiv.style.background = "rgba(255,255,100,0.9)";
    editDiv.style.border = "1px solid #ffaa00";
    editDiv.style.padding = "6px 8px";
    editDiv.style.borderRadius = "6px";
    editDiv.style.maxWidth = "200px";
    editDiv.style.wordWrap = "break-word";
    editDiv.style.fontWeight = "600";
    editDiv.style.color = "#000";
    
    // Agregar la X para eliminar
    const btnX = document.createElement("span");
    btnX.innerHTML = "✖";
    btnX.style.cursor = "pointer";
    btnX.style.marginLeft = "6px";
    btnX.style.float = "right";
    btnX.addEventListener("mousedown",(e)=>{
        e.preventDefault();
        e.stopPropagation();
    
        if(editDiv.parentNode){
            editDiv.parentNode.removeChild(editDiv);
        }
    });
    editDiv.appendChild(btnX);

    wrapper.appendChild(editDiv);
    editDiv.focus();

    // Guardar cuando se pierde el foco
    editDiv.addEventListener("blur", async ()=>{
        const texto = editDiv.innerText.replace("✖","").trim();
        if(!texto){
        
            if(editDiv.parentNode){
                editDiv.parentNode.removeChild(editDiv);
            }
        
            return;
        }

        comentarios.push({x:clickX, y:clickY, comentario:texto});
        editDiv.classList.remove("editable");
        editDiv.innerHTML = texto + `<span style="float:right; cursor:pointer;">✖</span>`;
        
        // Guardar en Sheet
        try{
           await fetch(SHEET_API, {
                  method:"POST",
                  body: JSON.stringify({
                      tipo:"comentario",
                      id_sop: ID_SOP,
                      usuario: currentUser ? currentUser.usuario : "Anonimo",
                      correo: currentUser ? currentUser.correo : "",
                      comentario: texto,
                      x: clickX,
                      y: clickY,
                      page:1,
                      url_doc: SOP_URL
                  })
              });
            console.log("Comentario guardado");
        }catch(err){ console.error(err); }
    });
}

function hacerArrastrable(div, comentario, idx){

    let moviendo = false;
    let offsetX = 0;
    let offsetY = 0;

    div.addEventListener("mousedown",(e)=>{

        if(e.target.classList.contains("fa-xmark")){
            return;
        }

        moviendo = true;

        const rect = div.getBoundingClientRect();

        offsetX = e.offsetX;
        offsetY = e.offsetY;

        div.classList.add("dragging");

        e.preventDefault();
        e.stopPropagation();

    });

    document.addEventListener("mousemove",(e)=>{

        if(!moviendo) return;

        const wrapper =
            document.getElementById("canvas-wrapper");

        const wrapperRect =
            wrapper.getBoundingClientRect();

        let x =
            e.clientX -
            wrapperRect.left -
            offsetX;

        let y =
            e.clientY -
            wrapperRect.top -
            offsetY;

        // límites del viewer
        x = Math.max(
            0,
            Math.min(
                x,
                wrapper.clientWidth - div.offsetWidth
            )
        );

        y = Math.max(
            0,
            Math.min(
                y,
                wrapper.clientHeight - div.offsetHeight
            )
        );
          console.log({
             x,
             y,
             offsetX,
             offsetY
          });
        div.style.left = x + "px";
        div.style.top  = y + "px";

    });

    document.addEventListener("mouseup", async ()=>{

        if(!moviendo) return;

        moviendo = false;

        div.classList.remove("dragging");

        comentario.x = parseInt(div.style.left);
        comentario.y = parseInt(div.style.top);

        try{

            await fetch(SHEET_API,{
                method:"POST",
                body:JSON.stringify({
                    tipo:"mover",
                    id_sop:ID_SOP,
                    comentario_idx:idx,
                    x:comentario.x,
                    y:comentario.y
                })
            });

        }catch(err){
            console.error(err);
        }

    });

}

// DIBUJAR COMENTARIOS
function dibujarComentarios(){
  const wrapper = document.getElementById("canvas-wrapper");

  // Limpiar comentarios anteriores
  wrapper.querySelectorAll(".comentario").forEach(el => {

    if(el.parentNode){
        el.parentNode.removeChild(el);
    }
});
  comentarios.forEach((c, idx) => {
    // Contenedor del comentario
    const div = document.createElement("div");
    div.className = "comentario";
    div.style.left = c.x + "px";
    div.style.top = c.y + "px";

    // Texto del comentario
    const spanText = document.createElement("span");
    spanText.textContent = c.comentario;

    const btnEdit = document.createElement("i");
    btnEdit.className = "fa-solid fa-pen-to-square";
    btnEdit.style.cursor = "pointer";
    btnEdit.style.marginLeft = "6px";
    btnEdit.style.color = "#003366";
    btnEdit.title = "Editar comentario";


    // Evento para editar comentario
    btnEdit.addEventListener("click", (e) => {
    
      e.stopPropagation(); // evita abrir un nuevo comentario
      clickX = c.x;
      clickY = c.y;
      const txt = document.getElementById("comentario-text");
      txt.value = c.comentario;
      document.getElementById("modal").style.display = "flex";

      // Guardar cambios: sobreescribimos el comentario actual
      const btnSave = document.getElementById("btn-save");
      
      // Desvincular posibles listeners anteriores
      btnSave.replaceWith(btnSave.cloneNode(true));
      const newBtnSave = document.getElementById("btn-save");

      newBtnSave.addEventListener("click", async () => {
        const nuevoTexto = document.getElementById("comentario-text").value.trim();
        if(!nuevoTexto) return alert("Escribe algo antes de guardar");
        comentarios[idx].comentario = nuevoTexto;
        dibujarComentarios();
        document.getElementById("modal").style.display = "none";
        document.getElementById("comentario-text").value = "";

        // Guardar edición en Sheet
        try{
           await fetch(SHEET_API,{
                method:"POST",
                body: JSON.stringify({
                  tipo:"editar",
                  id_sop: ID_SOP,
                  comentario_idx: idx,
                  comentario: nuevoTexto,
                  usuario: currentUser ? currentUser.usuario : "Anonimo",
                  correo: currentUser ? currentUser.correo : ""
                })
            });
          console.log("Comentario editado en Sheet");
        }catch(err){ console.error(err); }
      });
    });

    
    // Botón X para eliminar
    const btnClose = document.createElement("i");
    btnClose.className = "fa-solid fa-trash";
    btnClose.style.cursor = "pointer";
    btnClose.style.marginLeft = "6px";
    btnClose.style.color = "#c00";
    btnClose.title = "Eliminar comentario";

    btnClose.addEventListener("click", (e) => {
      e.stopPropagation(); 
      comentarios.splice(idx, 1); 
      dibujarComentarios();      
      fetch(SHEET_API, {
        method: "POST",
        body: JSON.stringify({
          tipo: "eliminar",
          id_sop: ID_SOP,
          comentario_idx: idx
        })
      }).catch(err => console.error(err));
    });

    div.appendChild(spanText);
    div.appendChild(btnEdit);
    div.appendChild(btnClose);
    
    hacerArrastrable(div, c, idx);
    div.addEventListener("mousedown",()=>{
   console.log("CLICK EN COMENTARIO");
      });
    wrapper.appendChild(div);
  });
}

  try{

  function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

  function showLoader(){
  document.getElementById("loader").style.display = "block";
}

function hideLoader(){
  document.getElementById("loader").style.display = "none";
}

function populateUsers(){
  const select = document.getElementById("loginUser");
  select.innerHTML = '<option value="">Seleccione usuario</option>';
  usuarios.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.usuario;
    opt.textContent = u.usuario;
    select.appendChild(opt);
  });
}

function login(){
  const userName = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;

  const user = usuarios.find(u=>u.usuario===userName && u.clave===pass);

  if(user){
    currentUser = user;
    localStorage.setItem("usuario", user.usuario);
    localStorage.setItem("correo", user.correo);

    closeLogin();
    mostrarUsuario(user);
  }else{
    document.getElementById("loginError").style.display = "block";
  }
}
  // Mostrar usuario en navbar
function mostrarUsuario(user){
  const userInfo = document.getElementById("userInfo");
  const userName = document.getElementById("userName");

  if(user){
    userName.textContent = user.usuario;
    userInfo.style.display = "flex";
  }else{
    userInfo.style.display = "none";
  }
}

// Cerrar sesión

function logout(){
  currentUser = null;
  localStorage.removeItem("usuario");
  document.getElementById("userInfo").style.display = "none";
window.location.href = "https://marbleartemisa.github.io/sop-site/";
}

// Al cargar la página, mostrar usuario si está guardado

window.addEventListener("DOMContentLoaded", () => {

  populateUsers(); // 🔥 clave

  const savedUser = localStorage.getItem("usuario");

  if(savedUser){
    currentUser = usuarios.find(u => u.usuario === savedUser);
    if(currentUser){
      mostrarUsuario(currentUser);
    }
  }else{
    openLogin(); // opcional
  }

});
