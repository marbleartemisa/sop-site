<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Comentarios PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body { margin:0; font-family:'Inter',sans-serif; background:#f0f0f0; }

/* NAVBAR */
.navbar{
  position:sticky; top:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  display:flex; justify-content:space-between; align-items:center;
  z-index:2000;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo img{height:40px;}
.menu{display:flex;gap:20px;}
.menu a{color:white;text-decoration:none;font-weight:bold;}
.menu a:hover{color:#00aaff;}

/* TABLA */
.overlay { padding:20px; max-width:1200px; margin:auto;}
input,select{width:100%;padding:8px;margin-bottom:10px;border-radius:6px;}
table{width:100%;background:white;border-radius:10px;overflow:hidden;}
th{background:#003366;color:white;padding:10px;}
td{padding:10px;border-bottom:1px solid #ddd;}

/* CANVAS */
#canvas-overlay{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  z-index:1500;
}
#sop-container{
  margin:70px auto;
  width:90%; max-width:1100px;
  background:white;
  padding:20px;
  border-radius:12px;
}
#canvas-wrapper{position:relative;}
canvas{width:100%;}

/* COMENTARIOS */
.comentario{
  position:absolute;
  padding:10px;
  border-radius:10px;
  color:white;
  font-size:13px;
  max-width:250px;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
  animation:pop 0.3s ease;
}
@keyframes pop{
  from{transform:scale(0.5);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(6px);
  justify-content:center;
  align-items:center;
  z-index:3000;
}
#modal-content{
  background:rgba(0,0,0,0.8);
  padding:20px;
  border-radius:12px;
  width:320px;
  color:white;
}
#comentario-text{
  width:100%;
  height:100px;
  background:rgba(255,255,255,0.1);
  border:none;
  border-radius:8px;
  color:white;
  padding:10px;
}
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
#btn-save{background:#00aaff;color:white;}
#btn-cancel{background:#555;color:white;}

#btnCerrarSOP{
  position:fixed;
  top:70px;
  right:20px;
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  z-index:5000;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA</span>
  </div>
</div>

<div class="overlay">
  <input type="text" id="buscarSOP" placeholder="Buscar...">
  <table>
    <thead><tr><th>Empleado</th><th>Acción</th></tr></thead>
    <tbody id="tablaSOP"></tbody>
  </table>
</div>

<div id="canvas-overlay">
  <button id="btnCerrarSOP" onclick="cerrarCanvas()">Cerrar</button>
  <div id="sop-container">
    <div id="canvas-wrapper"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-content">
    <h3>Nuevo comentario</h3>
    <textarea id="comentario-text">Nuevo comentario...</textarea>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const SHEET_API="TU_URL_AQUI";

let comentarios=[], clickX=0, clickY=0, ID_SOP="", SOP_URL="";

const USUARIO = localStorage.getItem("usuario");
const CORREO = localStorage.getItem("correo");

// 🔴 VALIDACIÓN USUARIO
if(!USUARIO || !CORREO){
  alert("Debe iniciar sesión");
  window.location.href="/sop-site/";
}

// COLORES
const colores={
  "Carlos Herrera":"#e67e22",
  "default":"#3498db"
};
function getColor(u){ return colores[u]||colores.default; }

// TABLA DEMO
document.getElementById("tablaSOP").innerHTML=`
<tr>
<td>SOP Ejemplo</td>
<td><button onclick="abrirSOP('sop.html','1')">Abrir</button></td>
</tr>`;

// ABRIR SOP
async function abrirSOP(url,id){
  ID_SOP=id; SOP_URL=url;
  document.getElementById("canvas-overlay").style.display="block";

  const res=await fetch(url);
  const html=await res.text();

  const div=document.createElement("div");
  div.innerHTML=html;
  div.querySelectorAll("script").forEach(s=>s.remove());

  const wrapper=document.getElementById("canvas-wrapper");
  wrapper.innerHTML="";
  wrapper.appendChild(div);

  await new Promise(r=>setTimeout(r,300));

  const canvas=await html2canvas(div,{useCORS:true});
  wrapper.innerHTML="";
  wrapper.appendChild(canvas);

  canvas.onclick=(e)=>{
    const rect=canvas.getBoundingClientRect();
    clickX=e.clientX-rect.left;
    clickY=e.clientY-rect.top;
    abrirModal();
  };

  cargarComentarios();
}

// MODAL
function abrirModal(){
  const txt=document.getElementById("comentario-text");
  txt.value="Nuevo comentario...";
  document.getElementById("modal").style.display="flex";

  txt.focus();
  txt.select();

  txt.onfocus=()=>{ if(txt.value==="Nuevo comentario...") txt.value=""; };
}

// GUARDAR
document.getElementById("btn-save").onclick=async()=>{
  const texto=document.getElementById("comentario-text").value.trim();
  if(!texto) return alert("Escribe algo");

  comentarios.push({x:clickX,y:clickY,comentario:texto,usuario:USUARIO});
  dibujar();

  document.getElementById("modal").style.display="none";

  await fetch(SHEET_API,{
    method:"POST",
    body:JSON.stringify({
      tipo:"comentario",
      id_sop:ID_SOP,
      usuario:USUARIO,
      correo:CORREO,
      comentario:texto,
      x:clickX,
      y:clickY,
      url_doc:SOP_URL
    })
  });
};

// CANCELAR
document.getElementById("btn-cancel").onclick=()=>{
  document.getElementById("modal").style.display="none";
};

// DIBUJAR
function dibujar(){
  const wrapper=document.getElementById("canvas-wrapper");
  wrapper.querySelectorAll(".comentario").forEach(e=>e.remove());

  comentarios.forEach(c=>{
    const d=document.createElement("div");
    d.className="comentario";
    d.style.left=c.x+"px";
    d.style.top=c.y+"px";
    d.style.background=getColor(c.usuario);
    d.textContent=c.comentario;
    wrapper.appendChild(d);
  });
}

// CARGAR
async function cargarComentarios(){
  const res=await fetch(`${SHEET_API}?comments=${ID_SOP}`);
  const data=await res.json();
  comentarios=data;
  dibujar();
}

// CERRAR
function cerrarCanvas(){
  document.getElementById("canvas-overlay").style.display="none";
}
</script>

</body>
</html>
