<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial y Comentarios SOP - Artemisa Rev Mejorada</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* GLOBAL */
body { margin:0; font-family:'Inter',sans-serif; background:#f0f0f0; color:#1f2937; }

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1100;
}
.logo{ display:flex; align-items:center; gap:10px; }
.logo img{ height:40px; }
.menu{ display:flex; gap:25px; }
.menu a{ color:white; text-decoration:none; font-weight:bold; transition:.3s; }
.menu a:hover{ color:#00aaff; }
.menu-toggle{ display:none; font-size:1.6rem; cursor:pointer; }

/* OVERLAY Y TABLA */
.overlay { padding:20px; max-width:1200px; margin:auto;}
h2{ color:#003366; margin-bottom:15px; text-align:center;}
input, select{ padding:8px; border-radius:6px; border:1px solid #ccc; width:100%; margin-bottom:10px;}
table{ width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
th, td{ padding:10px 12px; text-align:left; border-bottom:1px solid #ddd; }
th{ background:#003366; color:white;}
.estado{ display:inline-block; padding:6px 12px; border-radius:20px; font-size:0.75rem; font-weight:600; text-transform:uppercase;}
.pendiente{background:#fff4cc; color:#b38f00;}
.tramite{background:#e6f0ff;color:#1a5fd0;}
.rechazado{background:#fdecea;color:#c62828;}
.aprobado{background:#e6f7ec;color:#1e7e34;}

/* CANVAS */
#canvas-overlay{
  display:none;
  position:fixed;
  top:50px;
  left:0;
  width:100%;
  height:calc(100% - 50px);
  background:rgba(0,0,0,0.35);
  z-index:1000;
  overflow:auto;
}
#sop-container{
  position:relative;
  margin:30px auto;
  width:90%;
  max-width:1200px;
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
#canvas-wrapper{ position:relative; width:100%; }
canvas{ display:block; width:100%; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.2);}

  .comentario{
  position: absolute;
  min-width: 120px;
  max-width: 220px;
  padding: 10px 12px;
  padding-right: 28px; /* espacio para la X sin que choque con el texto */
  border-radius: 10px;
  background: rgba(255,255,180,0.95);
  border: 1px solid #ffcc00;
  font-size: 14px;
  font-weight: 500;
  color: #000;
  box-shadow: 0 6px 15px rgba(0,0,0,0.25);
  cursor: grab;
  outline: none;
  transition: 0.2s;
  overflow-wrap: break-word;
}

.comentario:focus{
  background: #fff8a6;
  box-shadow: 0 0 0 2px #00aaff;
}

.cerrar-comentario{
  position: absolute;
  top: 4px;
  right: 4px;
  width: 18px;
  height: 18px;
  background: #ff3b3b;
  color: #fff;
  font-size: 12px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  z-index: 10; /* para que esté siempre encima */
  user-select: none; /* evita que selecciones la X al escribir */
}

.cerrar-comentario{
  position:absolute;
  top:2px;
  right:4px;
}


.cerrar-comentario{
  position:absolute;
  top:-8px;
  right:-8px;
  width:18px;
  height:18px;
  background:#ff3b3b;
  color:#fff;
  font-size:12px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

  
  .comentario.editable {
    pointer-events: auto;
    outline: 2px dashed #00aaff;
}

  

/* BOTÓN CERRAR SOP */
#btnCerrarSOP{ 
  position:fixed; 
  top:70px; 
  right:20px; 
  z-index:9999; 
  padding:10px 16px; 
  cursor:pointer; 
  background:#c00; 
  color:white; 
  border:none; 
  border-radius:10px; 
  font-weight:bold;
  box-shadow:0 3px 8px rgba(0,0,0,0.3);
}

/* MODAL MODERNO */
#modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  justify-content:center;
  align-items:center;
  z-index:2000;
}
#modal-content{
  background: rgba(0,0,0,0.85);
  border-radius:14px;
  padding:20px;
  width:350px;
  color:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  gap:12px;
  animation: fadeIn 0.3s ease;
}
#modal h3{ margin:0; font-weight:600; text-align:center; color:#00aaff; }
#comentario-text{
  width:100%;
  height:120px;
  padding:12px;
  border:none;
  border-radius:10px;
  background: rgba(255,255,255,0.15);
  color:#fff;
  resize:vertical;
  font-size:15px;
  transition: all 0.2s ease;
}
#comentario-text:focus{ background: rgba(255,255,255,0.25); outline:none; }
#comentario-text::placeholder{ color: #ddd; font-style:italic; }
#btn-save, #btn-cancel{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition: all 0.2s ease;
}
#btn-save{ background:#00d1ff; color:white; }
#btn-save:hover{ background:#00a8cc; }
#btn-cancel{ background:#555; color:white; }
#btn-cancel:hover{ background:#333; }

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>
  <div class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </div>
  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a>
    <a href="#" onclick="openLogin('editor')">Editar SOP</a>
    <a href="#" onclick="openLogin('admin')"><i class="fa-solid fa-user-shield"></i> Admin</a>
    <a href="https://marbleartemisa.github.io/artemisamarbleandcabinet/#">Portal-Web</a>
  </div>
</div>

<!-- HISTORIAL SOP -->
<div class="overlay">
  <h2>Historial de SOPs</h2>
  <input type="text" id="buscarSOP" placeholder="Buscar...">
  <select id="filtroEstado">
    <option value="">Todos los estados</option>
    <option value="Pendiente">Pendiente</option>
    <option value="Trámite">Trámite</option>
    <option value="Rechazado">Rechazado</option>
    <option value="Aprobado">Aprobado</option>
  </select>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Departamento</th>
          <th>Objetivo</th>
          <th>Áreas</th>
          <th>Estado</th>
          <th>Fecha / Hora</th>
          <th>Abrir SOP</th>
        </tr>
      </thead>
      <tbody id="tablaSOP"></tbody>
    </table>
  </div>
</div>

<!-- Canvas flotante -->
<div id="canvas-overlay">
  <div id="sop-container">
    <button id="btnCerrarSOP" onclick="cerrarCanvas()">Cerrar SOP</button>
    <div id="canvas-wrapper"></div>
  </div>
</div>

<!-- Modal comentarios -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text" placeholder="Nuevo comentario..."></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

// VARIABLES
let comentarios=[], clickX=0, clickY=0, SOP_URL="", ID_SOP="";
const USUARIO = localStorage.getItem("usuario") || "";
const CORREO = localStorage.getItem("correo") || "";

// TABLA SOP
async function renderTabla(){
  const tabla = document.getElementById("tablaSOP");
  tabla.innerHTML="";
  const filtro = document.getElementById("filtroEstado").value;
  const buscar = document.getElementById("buscarSOP").value.toLowerCase();
  try{
    const res = await fetch(SHEET_API);
    const data = await res.json();
    data.forEach(row=>{
      if(!row.ID_SOP) return;
      const sop = {
        Timestamp: row.Timestamp||"",
        empleado: row.empleado||"",
        departamento: row.departamento||"",
        objetivo: row.objetivo||"",
        areas: row.areas||"",
        estado: row.estado||"Pendiente",
        ID_SOP: row.ID_SOP,
        url_doc: row.url_doc||row.links||""
      };
      if(filtro && sop.estado!==filtro) return;
      if(buscar && !(sop.empleado.toLowerCase()+sop.objetivo.toLowerCase()).includes(buscar)) return;
      const fila = document.createElement("tr");
      fila.innerHTML=`
        <td>${sop.empleado}</td>
        <td>${sop.departamento}</td>
        <td>${sop.objetivo}</td>
        <td>${sop.areas}</td>
        <td><span class="estado ${sop.estado.toLowerCase()}">${sop.estado}</span></td>
        <td>${new Date(sop.Timestamp).toLocaleString()}</td>
        <td><button onclick="abrirSOP('${sop.url_doc}','${sop.ID_SOP}')">💬 Abrir</button></td>
      `;
      tabla.appendChild(fila);
    });
  }catch(e){ console.error(e); alert("Error cargando SOPs"); }
}
document.getElementById("buscarSOP").addEventListener("input", renderTabla);
document.getElementById("filtroEstado").addEventListener("change", renderTabla);
renderTabla();

// ABRIR SOP
async function abrirSOP(url,id){
  SOP_URL=url; ID_SOP=id; comentarios=[];
  const wrapper=document.getElementById("canvas-wrapper");
  document.getElementById("canvas-overlay").style.display="block";
  wrapper.innerHTML="Cargando SOP...";
  try{
    const res = await fetch(url);
    const html = await res.text();
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    tempDiv.querySelectorAll("script").forEach(s=>s.remove());
    tempDiv.style.width="900px"; tempDiv.style.margin="auto"; tempDiv.style.padding="20px"; tempDiv.style.background="#fff";
    wrapper.innerHTML=""; wrapper.appendChild(tempDiv);
    await new Promise(r=>setTimeout(r,300));
    const canvas = await html2canvas(tempDiv,{useCORS:true, scale:1});
    canvas.id="sop-canvas";
    wrapper.innerHTML=""; wrapper.appendChild(canvas);
    canvas.addEventListener("click", activarComentario);
    cargarComentariosExistentes();
  }catch(err){
    console.error(err);
    wrapper.innerHTML="<p style='color:red;'>No se pudo cargar el SOP.</p>";
  }
}

// CERRAR
function cerrarCanvas(){
  document.getElementById("canvas-overlay").style.display="none";
  document.getElementById("canvas-wrapper").innerHTML="";
}

// COMENTARIOS
function activarComentario(e){
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  crearComentarioEditable(x, y, "");
}

  function crearComentarioEditable(x, y, textoInicial, existente = null){

  const wrapper = document.getElementById("canvas-wrapper");

  const div = document.createElement("div");
  div.className = "comentario";
  div.style.left = x + "px";
  div.style.top = y + "px";
  div.contentEditable = true;
  div.spellcheck = false;
  div.innerText = textoInicial;

  // BOTÓN X
  const btnX = document.createElement("div");
  btnX.innerHTML = "×";
  btnX.className = "cerrar-comentario";

  btnX.addEventListener("click", async (e)=>{
    e.stopPropagation();
    div.remove();
    comentarios = comentarios.filter(c => c.div !== div);

    await fetch(SHEET_API,{
      method:"POST",
      body: JSON.stringify({
        tipo:"eliminar",
        id_sop: ID_SOP,
        comentario: textoInicial
      })
    });
  });

    wrapper.appendChild(div);
    wrapper.appendChild(btnX);
    btnX.style.position = "absolute";
    btnX.style.left = (x + 200) + "px"; // ajusta según ancho
    btnX.style.top = (y - 8) + "px";

  // GUARDAR AL SALIR
  div.addEventListener("blur", async ()=>{
    const texto = div.innerText.replace("×","").trim();
    if(!texto){
      div.remove();
      return;
    }

if (existente) {
  // Actualizamos comentario existente
  existente.comentario = texto;
  existente.x = parseInt(div.style.left);
  existente.y = parseInt(div.style.top);
} else {
  // Creamos comentario nuevo y lo marcamos como 'nuevo' para guardarlo
  const nuevo = { x: parseInt(div.style.left), y: parseInt(div.style.top), comentario: texto, div, nuevo: true };
  comentarios.push(nuevo);
  existente = nuevo; // para que el fetch sepa que este es el existente
}

// Solo guardamos en Sheet si es nuevo
if (existente.nuevo) {
  try {
    await fetch(SHEET_API, {
      method: "POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: parseInt(div.style.left),
        y: parseInt(div.style.top),
        url_doc: SOP_URL
      })
    });
    existente.nuevo = false; // marcamos como guardado para no duplicar
  } catch (err) {
    console.error("Error guardando comentario:", err);
  }
}


    
  // DRAG & DROP
  let offsetX = 0, offsetY = 0, dragging = false;

  div.addEventListener("mousedown",(e)=>{
    if(e.target === btnX) return;
    dragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
    div.style.cursor = "grabbing";
  });

  document.addEventListener("mousemove",(e)=>{
    if(!dragging) return;
    const rect = wrapper.getBoundingClientRect();

    let newX = e.clientX - rect.left - offsetX;
    let newY = e.clientY - rect.top - offsetY;

    div.style.left = newX + "px";
    div.style.top = newY + "px";
  });

  document.addEventListener("mouseup", async ()=>{
    if(dragging){
      dragging = false;
      div.style.cursor = "grab";

      if(existente){
        existente.x = parseInt(div.style.left);
        existente.y = parseInt(div.style.top);

        // guardar nueva posición
        try{
          await fetch(SHEET_API,{
            method:"POST",
            body: JSON.stringify({
              tipo:"mover",
              id_sop: ID_SOP,
              comentario: existente.comentario,
              x: existente.x,
              y: existente.y
            })
          });
        }catch(err){ console.error(err); }
      }
    }
  });

  wrapper.appendChild(div);
  div.focus();
}

// DIBUJAR COMENTARIOS
function dibujarComentarios(){
  const wrapper = document.getElementById("canvas-wrapper");
  wrapper.querySelectorAll(".comentario").forEach(el=>el.remove());

  comentarios.forEach(c=>{
    crearComentarioEditable(c.x, c.y, c.comentario, c);
  });
}
  
  
// CARGAR COMENTARIOS EXISTENTES
async function cargarComentariosExistentes(){
  try{
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    comentarios = data.map(c=>({x:c.x,y:c.y,comentario:c.comentario}));
    dibujarComentarios();
  }catch(err){ console.error("Error cargando comentarios",err);}
}
</script>
</body>
</html>
