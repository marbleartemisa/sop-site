<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor y Comentarios SOP - ARTEMISA MARBLE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
  h1 { text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #eee; }
  tr:hover { background: #fafafa; cursor: pointer; }
  #viewer-wrapper { position: relative; width: 100%; height: 800px; margin-bottom: 20px; border:1px solid #ccc; }
  #sop-iframe { width: 100%; height: 100%; border: none; }
  #overlay-comments { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .comment-dot { position:absolute; width:10px; height:10px; background:red; border-radius:50%; cursor:pointer; }
  /* Modal */
  #comment-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  #comment-modal .modal-content { background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%; }
  #comment-modal textarea { width:100%; height:100px; margin-bottom:10px; }
  #comment-modal button { padding:8px 16px; }
</style>
</head>
<body>

<h1>Biblioteca SOP - ARTEMISA MARBLE</h1>

<table id="sop-table">
  <thead>
    <tr>
      <th>Departamento</th>
      <th>Resumen</th>
      <th>Estado</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="viewer-wrapper">
  <iframe id="sop-iframe" src=""></iframe>
  <div id="overlay-comments"></div>
</div>

<div id="comment-modal">
  <div class="modal-content">
    <h3>Agregar Comentario</h3>
    <textarea id="comment-text" placeholder="Escribe tu comentario aquí..."></textarea>
    <button id="save-comment">Guardar</button>
    <button id="cancel-comment">Cancelar</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
let selectedSOP = null;
let newComment = null;

// 1️⃣ Cargar SOPs en la tabla
async function loadSOPs() {
  const res = await fetch(SCRIPT_URL + "?");
  const data = await res.json();
  const tbody = document.querySelector("#sop-table tbody");
  tbody.innerHTML = "";
  data.forEach(sop => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${sop.departamento}</td>
      <td>${sop.resumen}</td>
      <td>${sop.estado}</td>
      <td><button onclick="openSOP('${sop.links}','${sop.id_sop}')">Leer y Comentar</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// 2️⃣ Abrir SOP en el iframe
function openSOP(url, id_sop) {
  selectedSOP = id_sop;
  document.getElementById("sop-iframe").src = url;
  loadComments(id_sop);
}

// 3️⃣ Cargar comentarios existentes
async function loadComments(id_sop) {
  const overlay = document.getElementById("overlay-comments");
  overlay.innerHTML = "";
  try {
    const res = await fetch(SCRIPT_URL + "?comments=" + id_sop);
    const data = await res.json();
    data.forEach(c => {
      if(c.x && c.y) {
        const dot = document.createElement("div");
        dot.className = "comment-dot";
        dot.style.left = c.x + "px";
        dot.style.top = c.y + "px";
        dot.title = c.comentario;
        overlay.appendChild(dot);
      }
    });
  } catch(e) { console.log(e); }
}

// 4️⃣ Agregar comentario sobre iframe
const overlay = document.getElementById("overlay-comments");
overlay.addEventListener("click", e => {
  if(!selectedSOP) return;
  const rect = overlay.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  newComment = {x,y};
  document.getElementById("comment-modal").style.display = "flex";
});

// 5️⃣ Guardar comentario
document.getElementById("save-comment").addEventListener("click", async () => {
  const text = document.getElementById("comment-text").value.trim();
  if(!text || !newComment) return;
  
  // dibujar en overlay
  const dot = document.createElement("div");
  dot.className = "comment-dot";
  dot.style.left = newComment.x + "px";
  dot.style.top = newComment.y + "px";
  dot.title = text;
  overlay.appendChild(dot);

  // guardar en Sheet
  await fetch(SCRIPT_URL, {
    method:"POST",
    body: JSON.stringify({
      tipo: "comentario",
      id_sop: selectedSOP,
      comentario: text,
      x: newComment.x,
      y: newComment.y
    })
  });

  document.getElementById("comment-text").value = "";
  newComment = null;
  document.getElementById("comment-modal").style.display = "none";
});

// Cancelar
document.getElementById("cancel-comment").addEventListener("click", () => {
  newComment = null;
  document.getElementById("comment-text").value = "";
  document.getElementById("comment-modal").style.display = "none";
});

loadSOPs();
</script>

</body>
</html>
