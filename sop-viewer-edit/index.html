<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leer y Comentar SOP</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#f0f0f0;
}

/* CONTENEDOR PRINCIPAL */
#sop-container {
  width: 90%;
  margin: 20px auto;
  background:#fff;
  border:1px solid #ccc;
}

/* WRAPPER */
#sop-wrapper {
  position: relative;
  width: 100%;
  height: 800px;
}

/* IFRAME (DOCUMENTO REAL) */
#sop-frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* CAPA DE COMENTARIOS */
#overlay {
  position: absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  cursor: crosshair;
}

/* COMENTARIOS */
.comentario {
  position: absolute;
  color: red;
  font-weight: bold;
  background: rgba(255,255,255,0.9);
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  border:1px solid red;
}

/* MODAL */
#modal {
  display:none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

#modal-content {
  background:#fff;
  padding:20px;
  border-radius:8px;
  width:320px;
}

#comentario-text {
  width:100%;
  height:100px;
}

button {
  margin-top:10px;
  margin-right:5px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Leer y Comentar SOP</h2>

<div id="sop-container">
  <div id="sop-wrapper">
    <iframe id="sop-frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea><br>
    <button id="btn-save">Guardar</button>
    <button id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

const SOP_URL = "https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html";
const ID_SOP = "SOP-1774461381359-0";
const USUARIO = "TuNombre";
const CORREO = "tucorreo@empresa.com";

let clickX = 0;
let clickY = 0;

const overlay = document.getElementById('overlay');

/* CARGAR SOP EN IFRAME */
document.getElementById('sop-frame').src = SOP_URL;

/* CLICK PARA CREAR COMENTARIO */
overlay.addEventListener('click', (e) => {
  if(e.target.classList.contains('comentario')) return;

  const rect = overlay.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;

  document.getElementById('modal').style.display = 'flex';
});

/* GUARDAR COMENTARIO */
document.getElementById('btn-save').addEventListener('click', async () => {
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo");

  const xRel = clickX / overlay.clientWidth;
  const yRel = clickY / overlay.clientHeight;

  crearComentario(texto, xRel, yRel);

  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";

  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: xRel,
        y: yRel,
        page: 1,
        url_doc: SOP_URL
      })
    });
  } catch(err) {
    console.error(err);
  }
});

/* CREAR COMENTARIO EN PANTALLA */
function crearComentario(texto, xRel, yRel){
  const div = document.createElement('div');
  div.className = "comentario";

  div.style.left = (xRel * overlay.clientWidth) + "px";
  div.style.top = (yRel * overlay.clientHeight) + "px";

  div.textContent = "💬";

  div.title = texto;

  overlay.appendChild(div);
}

/* CANCELAR */
document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
});

/* CARGAR COMENTARIOS */
async function cargarComentarios(){
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();

    data.forEach(c => {
      crearComentario(c.comentario, c.x, c.y);
    });

  } catch(err){
    console.error(err);
  }
}

/* REAJUSTAR POSICIONES AL REDIMENSIONAR */
window.addEventListener('resize', () => {
  const comentarios = document.querySelectorAll('.comentario');

  comentarios.forEach((div, i) => {
    const data = div.dataset;

    if(data.x && data.y){
      div.style.left = (data.x * overlay.clientWidth) + "px";
      div.style.top = (data.y * overlay.clientHeight) + "px";
    }
  });
});

/* INICIAR */
cargarComentarios();
</script>

</body>
</html>
