<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artemisa ERP - Production Control Center</title>

  <!-- ================= CORE UI (GLOBAL DESIGN SYSTEM) ================= -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">

  <!-- ================= DASHBOARD LAYOUT ================= -->
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- =========================================================
 NAVBAR (GLOBAL SYSTEM - SOP + ERP UNIFIED)
========================================================= -->
<div class="navbar">

  <!-- LOGO -->
  <div class="logo">
    <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>

  <!-- MOBILE TOGGLE -->
  <div class="menu-toggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </div>

  <!-- MENU -->
  <div class="menu">

    <a href="/sop-site/">SOP Library</a>

    <a href="/sop-site/dashboard/" class="active">
      Production ERP
    </a>

    <a href="/sop-site/dashboard/#projects">
      Projects
    </a>

    <a href="/sop-site/dashboard/#gantt">
      Gantt
    </a>

    <a href="/sop-site/dashboard/#resources">
      Resources
    </a>

  </div>

  <!-- USER INFO -->
  <div class="user-info" id="userInfo" style="display:none;">
    <span id="userName"></span>
    <button onclick="logout()" title="Logout">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>

</div>

<!-- =========================================================
 ERP HEADER (CONTROL CENTER)
========================================================= -->
<header class="erp-header">

  <div class="erp-title">
    <h1>Production Control Center</h1>
    <p>Live scheduling · Resource queues · Project tracking</p>
  </div>

  <div class="actions">
    <button onclick="refreshData()">Refresh</button>
    <button onclick="runScheduler()">Recalculate</button>
    <button onclick="openNewProject()">New Project</button>
  </div>

</header>

<!-- =========================================================
 KPI / SUMMARY SECTION
========================================================= -->
<section id="summary" class="summary-grid"></section>

<!-- =========================================================
 MAIN ERP VIEW (DYNAMIC RENDERING SYSTEM)
========================================================= -->
<section id="view-container"></section>

<!-- =========================================================
 MODAL SYSTEM (CREATE / EDIT / DETAILS)
========================================================= -->
<div id="modal-container"></div>

<!-- =========================================================
 FOOTER
========================================================= -->
<footer class="footer">
  ARTEMISA ERP © 2026 · Production System
</footer>

<!-- =========================================================
 CORE ERP SCRIPTS (MODULAR ARCHITECTURE)
========================================================= -->

<script src="/sop-site/core/ui-core.js"></script>

<!-- INIT SYSTEM -->
<script>
async function submitProject() {

  const project = {
    id: "PRJ-" + Date.now(),
    customer: document.getElementById("m_customer").value,
    material: document.getElementById("m_material").value,
    ft2: Number(document.getElementById("m_ft2").value),
    priority: document.getElementById("m_priority").value,
    readyDate: document.getElementById("m_date").value
  };

  await createProject(project);

  closeModal();

  await renderProjects();
}

window.submitProject = submitProject;
  document.addEventListener("DOMContentLoaded", () => {
  if (typeof initERP === "function") {
    initERP();
  }
});

  function openProjectModal() {

  const container = document.getElementById("modal-container");

  container.innerHTML = `
    <div class="modal-backdrop" onclick="closeModal()"></div>

    <div class="modal">

      <h2>New Project</h2>

      <input id="m_customer" placeholder="Customer">
      <input id="m_material" placeholder="Material">
      <input id="m_ft2" type="number" placeholder="Ft2">
      <input id="m_priority" placeholder="Priority">
      <input id="m_date" type="date">

      <button onclick="submitProject()">Create</button>

    </div>
  `;
}

function closeModal() {
  document.getElementById("modal-container").innerHTML = "";
}

window.closeModal = closeModal;
</script>
<script type="module" src="/sop-site/js/app.js"></script>
</body>
</html>
