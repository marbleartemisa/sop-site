<!DOCTYPE html>
<html>
<head>
  <title>Artemisa Production Control</title>
  <style>

    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      padding: 15px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 10px 15px;
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td, th {
      padding: 8px;
      border-bottom: 1px solid #374151;
      font-size: 12px;
    }

  </style>
</head>

<body>

<header>
  <h2>🧠 Production Control Center</h2>

  <button onclick="openCreateProject()">
    + Create Project
  </button>
</header>

<div class="container">

  <div class="card">
    <h3>📦 Projects</h3>
    <div id="projects"></div>
  </div>

  <div class="card">
    <h3>🧩 Tasks</h3>
    <div id="tasks"></div>
  </div>

</div>

<div class="container">

  <div class="card" style="grid-column: span 2;">
    <h3>📅 Schedule</h3>
    <div id="schedule"></div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
