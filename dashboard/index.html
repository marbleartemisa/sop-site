<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artemisa ERP - Production Control Center</title>

  <link rel="stylesheet" href="/sop-site/core/ui-core.css">
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="erp-app">

  <!-- ================= NAVBAR ================= -->
  <div class="navbar">
    <div class="logo">
      <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
      <span>ARTEMISA MARBLE & CABINETS</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </div>

    <div class="menu">
      <a href="/sop-site/">SOP Library</a>
      <a href="/sop-site/dashboard/" class="active">Production ERP</a>
      <a href="/sop-site/dashboard/#projects">Projects</a>
      <a href="/sop-site/dashboard/#gantt">Gantt</a>
      <a href="/sop-site/dashboard/#resources">Resources</a>
    </div>
  </div>

  <!-- ================= LAYOUT ================= -->
  <div class="app">

    <aside class="sidebar">
      <div class="logo">⚙️ SOP ERP</div>

      <nav>
        <a class="active">📦 Projects</a>
        <a>📊 Dashboard</a>
        <a>🧠 Planning</a>
        <a>⚙️ Settings</a>
      </nav>
    </aside>

    <main class="main">

      <header class="topbar">
        <h1>Production Control Center</h1>

        <button class="primary" onclick="openCreateForm()">
          ➕ New Project
        </button>
      </header>

      <section class="content"></section>

    </main>
  </div>

  <!-- ================= ERP HEADER ================= -->
  <header class="erp-header">

    <div class="erp-title">
      <h1>Production Control Center</h1>
      <p>Live scheduling · Resource queues · Project tracking</p>
    </div>

    <div class="actions">
      <button onclick="refreshData()">Refresh</button>
      <button onclick="runScheduler()">Recalculate</button>
      <button onclick="openCreateForm()">New Project</button>
    </div>

  </header>

  <!-- ================= MAIN VIEW ================= -->
  <section id="summary" class="summary-grid"></section>
  <section id="view-container"></section>

  <!-- ================= MODAL ================= -->
  <div id="modal-container"></div>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    ARTEMISA ERP © 2026 · Production System
  </footer>

</div> <!-- ✅ ERP APP END -->

<!-- ================= CORE ================= -->
<script src="/sop-site/core/ui-core.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (typeof initERP === "function") {
    initERP();
  }
});

function closeModal() {
  document.getElementById("modal-container").innerHTML = "";
}
window.closeModal = closeModal;
</script>

<script type="module" src="/sop-site/js/app.js"></script>

</body>
</html>
