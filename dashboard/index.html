<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Artemisa ERP - Production Control Center</title>

  <!-- CORE STYLES -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">
  <link rel="stylesheet" href="/sop-site/dashboard/css/project-modal.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   APP LAYOUT
========================= */

.app{
  display:flex;
  min-height:calc(100vh - 70px);
  background:#0b1220;
}

.sidebar{
  width:270px;
  min-width:270px;
  background:#151d33;
  border-right:1px solid rgba(255,255,255,.06);
  padding:20px 16px;
}

.main{
  flex:1;
  min-width:0;
  padding:22px;
}

/* =========================
   NAVBAR
========================= */

.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  height:34px;
  width:auto;
}

.logo span{
  font-size:24px;
  font-weight:700;
  color:white;
}

.menu{
  display:flex;
  justify-content:center;
  align-items:center;
  flex:1;
  gap:16px;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:600;
  padding:10px 16px;
  border-radius:12px;
  transition:.2s;
}

.menu a:hover{
  background:rgba(255,255,255,.08);
}

.menu a.active{
  background:#4f83f1;
  color:white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar::before{
  display:block;

  font-size:26px;
  font-weight:700;

  color:white;

  margin-bottom:24px;
}

.sidebar nav{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sidebar nav a{
  display:flex;
  align-items:center;

  gap:12px;

  padding:14px 16px;

  border-radius:10px;

  color:#cfd8ea;
  text-decoration:none;
  font-size:18px;

  background:transparent;

  transition:.2s;
}

.sidebar nav a:hover{
  background:#223156;
  color:white;
}

.sidebar nav a.active{
  background:#223156;
  color:white;
}

/* =========================
   TOP HEADER
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#151d33;

  padding:20px 28px;

  border-radius:12px;

  margin-bottom:22px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.25);
}

.topbar h1{
  margin:0;

  color:white;

  font-size:24px;
  font-weight:700;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.actions button{
  border:none;

  background:#3366e8;

  color:white;

  padding:12px 18px;

  border-radius:10px;

  font-weight:600;

  cursor:pointer;

  transition:.2s;
}

.actions button:hover{
  background:#4678f0;
  transform:translateY(-1px);
}

/* =========================
   CONTENT
========================= */

#view-container,
#summary{
  background:#0b1220;
}

/* =========================
   FOOTER
========================= */

.footer{
  padding:16px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.05);
}

/* =========================
   MOBILE
========================= */

@media (max-width:900px){

  .app{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-width:100%;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    flex-wrap:wrap;
  }

  .topbar h1{
    font-size:30px;
  }
}
  .sidebar-title{
  color:white;
  font-size:24px;
  font-weight:700;
  margin-bottom:24px;
}

</style>
</head>

<body>

  <!-- APP ROOT -->
  <div id="erp-app">

    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
        <span>ARTEMISA ERP</span>
      </div>

      <nav class="menu">
        <a href="/sop-site/">SOP Library</a>
        <a href="/sop-site/dashboard/" class="active">Production ERP</a>
        <a href="#">Projects</a>
        <a href="#">Gantt</a>
      </nav>

      <button class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- LAYOUT -->
    <div class="app">

      <!-- SIDEBAR -->
      <aside class="sidebar">
          <div class="sidebar-title">
            ⚙ SOP ERP
          </div> 
       <nav>
          <a class="active">📦 Projects</a>
          <a>📊 Dashboard</a>
          <a>🧠 Planning</a>
          <a>⚙️ Settings</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
          <h1>Production Control Center</h1>

          <div class="actions">
            <button onclick="refreshData()">Refresh</button>
            <button onclick="runScheduler()">Recalculate</button>
            <button id="btn-new-project">New Project</button>
          </div>
        </header>

        <!-- VIEW -->
        <section id="view-container"></section>
        <section id="summary"></section>

      </main>

    </div>

    <div id="modal-container"></div>

    <footer class="footer">
      ARTEMISA ERP © 2026
    </footer>

  </div>

  <script src="/sop-site/core/ui-core.js"></script>
  <script type="module" src="/sop-site/dashboard/js/app.js"></script>

</body>
</html>
