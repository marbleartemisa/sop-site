<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Artemisa ERP - Production Control Center</title>

  <!-- CORE STYLES -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">
  <link rel="stylesheet" href="/sop-site/dashboard/css/project-modal.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


  <!-- =========================
       FIX LAYOUT (ONLY MENU FIX)
  ========================== -->
  <style>

    /* APP LAYOUT FIX */
    .app{
      display:flex;
      min-height:calc(100vh - 70px);
    }

    .sidebar{
      width:240px;
      flex-shrink:0;
    }

    .main{
      flex:1;
      padding:24px;
      min-width:0;
    }

    /* NAVBAR FIX (CENTER MENU + ALIGN) */
    .navbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 20px;
      background: rgba(30, 58, 138, 0.85); /* azul más claro tipo el de la imagen */
      backdrop-filter: blur(10px);
    }

    /* convertimos navbar en barra principal real */
      .navbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
      }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }

    /* 🔥 FIX CLAVE: MENU CENTRADO REAL */
    .menu{
      display:flex;
      gap:14px;
      justify-content:flex-start;
      justify-content:center;
      flex:1;
      gap:20px;
    }


      /* 🔥 DERECHA: vamos a "enganchar" el topbar dentro visualmente */
      .app{
        margin-top:10px;
      }


    .menu a{
      text-decoration:none;
      color:white;
      font-weight:600;
      padding:6px 10px;
      border-radius:8px;
      transition:0.2s;
      white-space:nowrap;
      background:rgba(255,255,255,0.08);
    }

    .menu a:hover{
      background:rgba(255,255,255,0.08);
    }

    .menu a.active{
      background:#1d4ed8;
      color:white;
    }

    /* 🔥 FIX TOPBAR (ESTO ES LO QUE SE ROMPIÓ) */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:20px;
    }

    .topbar h1{
      margin:0;
      font-size:22px;
    }

    /* 🔥 FIX ACTIONS (BOTONES A LA DERECHA REAL) */
    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      margin-left:auto;
    }

    .actions button{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      background:#1d4ed8;
      color:white;
      cursor:pointer;
      font-weight:600;
      white-space:nowrap;
      transition:0.2s;
    }

    .actions button:hover{
      background:#2563eb;
      transform:translateY(-1px);
    }

    
    /* TOPBAR se vuelve extensión de la navbar */
    .topbar{
      background: rgba(30, 58, 138, 0.65);
      padding:12px 16px;
      border-radius:10px;
    
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    
    /* botones derecha */
    .actions{
      display:flex;
      gap:10px;
      margin-left:auto;
    }
      

    /* MOBILE FIX */
    @media (max-width:900px){

      .app{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

      .menu{
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
      }

      .actions{
        margin-left:0;
        flex-wrap:wrap;
      }
    }

  </style>
</head>

<body>

  <!-- APP ROOT -->
  <div id="erp-app">

    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
        <span>ARTEMISA ERP</span>
      </div>

      <nav class="menu">
        <a href="/sop-site/">SOP Library</a>
        <a href="/sop-site/dashboard/" class="active">Production ERP</a>
        <a href="#">Projects</a>
        <a href="#">Gantt</a>
      </nav>

      <button class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- LAYOUT -->
    <div class="app">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <nav>
          <a class="active">📦 Projects</a>
          <a>📊 Dashboard</a>
          <a>🧠 Planning</a>
          <a>⚙️ Settings</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
          <h1>Production Control Center</h1>

          <div class="actions">
            <button onclick="refreshData()">Refresh</button>
            <button onclick="runScheduler()">Recalculate</button>
            <button id="btn-new-project">New Project</button>
          </div>
        </header>

        <!-- VIEW -->
        <section id="view-container"></section>
        <section id="summary"></section>

      </main>

    </div>

    <div id="modal-container"></div>

    <footer class="footer">
      ARTEMISA ERP © 2026
    </footer>

  </div>

  <script src="/sop-site/core/ui-core.js"></script>
  <script type="module" src="/sop-site/dashboard/js/app.js"></script>

</body>
</html>
