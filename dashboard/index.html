<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Artemisa ERP - Production Control Center</title>

  <!-- CORE STYLES -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">
  <link rel="stylesheet" href="/sop-site/dashboard/css/project-modal.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <!-- APP ROOT -->
  <div id="erp-app">

    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
        <span>ARTEMISA ERP</span>
      </div>

      <nav class="menu">
        <a href="/sop-site/">SOP Library</a>
        <a href="/sop-site/dashboard/" class="active">Production ERP</a>
        <a href="#">Projects</a>
        <a href="#">Gantt</a>
      </nav>

      <button class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- LAYOUT -->
    <div class="app">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <nav>
          <a class="active">📦 Projects</a>
          <a>📊 Dashboard</a>
          <a>🧠 Planning</a>
          <a>⚙️ Settings</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
          <h1>Production Control Center</h1>

          <div class="actions">
            <button onclick="refreshData()">Refresh</button>
            <button onclick="runScheduler()">Recalculate</button>
            <button id="btn-new-project">New Project</button>
          </div>
        </header>

        <!-- VIEW -->
        <section id="view-container"></section>

        <section id="summary"></section>

      </main>

    </div>

    <!-- MODAL PORTAL (IMPORTANTE: solo este) -->
    <div id="modal-container"></div>

    <!-- FOOTER -->
    <footer class="footer">
      ARTEMISA ERP © 2026
    </footer>

  </div>

  <!-- SCRIPTS -->
  <script src="/sop-site/core/ui-core.js"></script>

  <script type="module" src="/sop-site/dashboard/js/app.js"></script>

</body>
</html>
