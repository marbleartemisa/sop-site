<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ARTEMISA MARBLE & CABINETS</title>

  <!-- CORE STYLES -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">
  <link rel="stylesheet" href="/sop-site/dashboard/css/project-modal.css">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
   BASE
========================= */

body{
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
  margin:0;
  background:#0b1220;
  color:#e5e7eb;
}

/* =========================
   APP LAYOUT
========================= */

.app{
  display:flex;
  min-height:calc(100vh - 60px);
}

.sidebar{
  width:270px;
  min-width:270px;
  background:#151d33;
  border-right:1px solid rgba(255,255,255,.06);
  padding:20px 16px;
}

.main{
  flex:1;
  min-width:0;
  padding:20px;
  background:#0b1220;
}

/* =========================
   NAVBAR
========================= */

.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 20px;

  background:#0f172a;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  height:34px;
  width:auto;
}

.logo span{
  font-size:16px;
  font-weight:600;
  color:#e5e7eb;
  letter-spacing:.3px;
}

/* MENU */

.menu{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
  gap:16px;
}

.menu a{
  color:#cbd5e1;
  text-decoration:none;
  font-weight:500;

  padding:8px 12px;
  border-radius:10px;

  font-size:14px;

  transition:.2s;
}

.menu a:hover{
  background:rgba(255,255,255,.06);
  color:white;
}

.menu a.active{
  background:#2563eb;
  color:white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar-title{
  color:#94a3b8;
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  margin-bottom:16px;
}

.sidebar nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sidebar nav a{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 12px;

  border-radius:10px;

  color:#cbd5e1;

  text-decoration:none;

  font-size:14px;

  transition:.2s;
}

.sidebar nav a:hover{
  background:rgba(37,99,235,.12);
  color:white;
}

.sidebar nav a.active{
  background:#2563eb;
  color:white;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#151d33;

  padding:18px 20px;

  border-radius:12px;

  margin-bottom:20px;

  border:1px solid rgba(255,255,255,.06);
}

.topbar h1{
  margin:0;
  color:white;

  font-size:24px;
  font-weight:700;
}

/* =========================
   ACTIONS / BUTTONS
========================= */

.actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.actions button{
  border:none;

  padding:9px 12px;

  border-radius:10px;

  font-size:13px;
  font-weight:600;

  cursor:pointer;

  background:rgba(255,255,255,.06);
  color:#e5e7eb;

  transition:.2s;
}

.actions button:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.10);
}

/* PRIMARY BUTTON */

#btn-new-project{
  background:#2563eb;
  color:white;
}

/* =========================
   CONTENT
========================= */

#view-container,
#summary{
  background:#0b1220;
}

/* =========================
   FOOTER
========================= */

.footer{
  padding:16px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.05);
  color:#94a3b8;
}

/* =========================
   MOBILE
========================= */

@media (max-width:900px){

  .app{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    min-width:100%;
    padding:14px;
  }

  .actions{
    flex-wrap:wrap;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .topbar h1{
    font-size:18px;
    font-weight:600;
  }
}

</style>
</head>

<body>

  <!-- APP ROOT -->
  <div id="erp-app">

    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="/sop-site/assets/logo.png" alt="Artemisa Logo">
        <span>ARTEMISA MARBLE & CABINETS ERP</span>
      </div>

      <nav class="menu">
        <a href="/sop-site/">SOP Library</a>
        <a href="/sop-site/dashboard/" class="active">Production ERP</a>
        <a href="#">Projects</a>
        <a href="#">Gantt</a>
      </nav>

      <button class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
    </header>

    <!-- LAYOUT -->
    <div class="app">

      <!-- SIDEBAR -->
      <aside class="sidebar">
          <div class="sidebar-title">
            ⚙ SOP ERP
          </div> 
       <nav>
          <a class="active">📦 Projects</a>
          <a>📊 Dashboard</a>
          <a>🧠 Planning</a>
          <a>⚙️ Settings</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
          <h1>Production Control Center</h1>

          <div class="actions">
            <button onclick="refreshData()">Refresh</button>
            <button onclick="runScheduler()">Recalculate</button>
            <button id="btn-new-project">New Project</button>
          </div>
        </header>

        <!-- VIEW -->
        <section id="view-container"></section>
        <section id="summary"></section>

      </main>

    </div>

    <div id="modal-container"></div>

    <footer class="footer">
      ARTEMISA ERP © 2026
    </footer>

  </div>

  <script src="/sop-site/core/ui-core.js"></script>
  <script type="module" src="/sop-site/dashboard/js/app.js"></script>

</body>
</html>
