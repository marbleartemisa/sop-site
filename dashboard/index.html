<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artemisa Production Dashboard</title>

  <!-- CORE UI GLOBAL -->
  <link rel="stylesheet" href="/sop-site/core/ui-core.css">

  <!-- DASHBOARD STYLE -->
  <link rel="stylesheet" href="/sop-site/css/dashboard.css">
</head>

<body>

  <!-- NAVBAR (MISMO QUE SOP) -->
  <div class="navbar">
    <div class="logo">
      <img src="/sop-site/assets/logo.png">
      <span>ARTEMISA MARBLE & CABINETS</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </div>

    <div class="menu">
      <a href="/sop-site/">SOP</a>
      <a href="/sop-site/dashboard/">Dashboard</a>
    </div>

    <div class="user-info" id="userInfo" style="display:none;">
      <span id="userName"></span>
      <button onclick="logout()">⎋</button>
    </div>
  </div>

  <!-- HEADER DASHBOARD -->
  <header>
    <h1>🏭 Artemisa Production Dashboard</h1>
    <button onclick="loadData()">🔄 Refresh</button>
  </header>

  <!-- SUMMARY -->
  <section id="summary"></section>

  <!-- GRID -->
  <section class="grid">

    <div class="panel">
      <h2>BRETON QUEUE</h2>
      <table id="breton"></table>
    </div>

    <div class="panel">
      <h2>MANUAL QUEUE</h2>
      <table id="manual"></table>
    </div>

  </section>

  <section class="panel full">
    <h2>ALL SCHEDULE</h2>
    <table id="all"></table>
  </section>

  <!-- SCRIPTS -->
  <script src="/sop-site/core/ui-core.js"></script>
  <script src="/sop-site/js/dashboard.js"></script>

</body>
</html>
