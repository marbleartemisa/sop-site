<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEMISA MARBLE & CABINETS - Biblioteca SOP Rev 4.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

      /* ===== BODY ===== */
      *{
        box-sizing:border-box;
      }
      html, body{
        overflow-x:hidden;
      }

    
      body{
        margin:0;
        font-family:'Inter',sans-serif;
        background-image:url('/sop-site/wall0.png');
        background-position:center;
        background-repeat:no-repeat;
        background-size:cover;
        background-attachment:fixed;
        color:#1f2937;
      }
      
      .overlay{
        background:rgba(0,0,0,0.25);
        min-height:100vh;
      }
      
      /* ===== NAVBAR ===== */
      .navbar{
        position:sticky;
        top:0;
        background:rgba(0,0,0,0.65);
        backdrop-filter:blur(8px);
        padding:10px 30px;
        color:white;
        font-weight:bold;
        display:flex;
        justify-content:space-between;
        align-items:center;
        z-index:999;
      }
      
      .logo{
        display:flex;
        align-items:center;
        gap:10px;
      }
      
      .logo img{
        height:40px;
      }
      

      .menu{
        display:flex;
        gap:25px;
        flex:1;                /* 🔥 ocupa espacio disponible */
        justify-content:center; /* 🔥 lo centra */
      }
      
      
      .menu a{
        color:white;
        text-decoration:none;
        font-weight:bold;
        transition:.3s;
      }
      
      .menu a:hover{
        color:#00aaff;
      }

      .menu a.active {
              background: #003366;   /* color de fondo destacado */
              color: #fff;           /* texto blanco */
              border-radius: 6px;
              padding: 5px 10px;
            }

            .menu-toggle{
              display:none;
              font-size:1.6rem;
              cursor:pointer;
            }
            
            /* ✅ MOBILE */
            @media (max-width: 900px){
            
              /* ===== HAMBURGER ===== */
              .menu-toggle{
                display:block !important;
                font-size:1.6rem;
                cursor:pointer;
                z-index:1001;
              }
            
              /* ===== NAVBAR ===== */
              .navbar{
                padding:10px 15px;
              }
            
              .logo span{
                font-size:0.9rem;
              }
            
              /* ===== MENU MOBILE ===== */
              .menu{
                display:none;
                position:absolute;
                top:60px;
                left:0;
                width:100%;
                background:rgba(0,0,0,0.95);
                flex-direction:column;
                align-items:center;
                gap:15px;
                padding:20px 0;
              }
            
              .menu.show{
                display:flex;
              }
            
              /* ===== USER INFO ===== */
                .user-info{
                    display:flex;
                    align-items:center;
                    gap:8px;
                    white-space:nowrap;
                    flex-shrink:0;   /* 🔥 NO se encoge */
                  }
            }



            @media (max-width: 900px){
            
              .logo span{
                display:none; /* 🔥 oculta texto largo */
              }
            
              .logo img{
                height:35px;
              }
            
              .user-info span{
                font-size:0.75rem;
              }
            
            }

            @media (max-width: 900px){
              .sop-table th,
              .sop-table td{
                font-size:0.75rem;
                padding:10px 8px;
              }
            }
      
      /* ===== BANNER ===== */
      .banner{
        text-align:center;
        padding:40px 20px 20px;
        color:white;
      }
      
      .banner h1{
        margin:0;
        font-size:2.2rem;
      }
      
      .banner p{
        margin:4px 0;
        opacity:0.9;
      }
      
      .cta-btn{
        display:inline-block;
        margin-top:15px;
        padding:10px 25px;
        border-radius:30px;
        background:linear-gradient(135deg,#0072C6,#005a9e);
        color:white;
        text-decoration:none;
        font-weight:bold;
        transition:.3s;
      }
      
      .cta-btn:hover{
        transform:scale(1.05);
      }
      
      /* ===== WELCOME ===== */
      #welcome-msg{
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: #00d1ff;
        color: white;
        padding: 10px 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        font-weight: bold;
        z-index: 3000;
        opacity: 0;
        transition: all 0.5s ease;
      }
      
      #welcome-msg.show{
        opacity: 1;
        top: 80px;
      }
      
      /* ===== BUSCADOR ===== */
      .search-filter-container{
        max-width:950px;
        margin:30px auto;
        padding:0 20px;
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
        align-items:center;
      }
      
      .search-filter-container input,
      .search-filter-container select{
        width:250px;
        padding:12px 15px;
        border-radius:30px;
        border:none;
        font-size:1rem;
        box-shadow:0 8px 20px rgba(0,0,0,0.25);
        outline:none;
      }
      
      /* ===== BOTONES DEPARTAMENTO ===== */
      .dept-filter-bar{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
        width:100%;
        margin-top:10px;
      }
      
      .dept-filter{
        padding:8px 16px;
        border-radius:20px;
        border:none;
        background:white;
        box-shadow:0 6px 14px rgba(0,0,0,0.15);
        font-size:.85rem;
        cursor:pointer;
        transition:.25s;
      }
      
      .dept-filter:hover{
        transform:scale(1.05);
      }
      
      .dept-filter.active{
        background:#0072C6;
        color:white;
      }
      
      /* ===== CONTENEDOR SOP ===== */
      .sop-container{
        max-width:1050px;
        margin:40px auto 80px;
        padding:0 20px;
      }
      
      .sop-info{
        background:white;
        padding:12px 18px;
        border-radius:12px;
        margin-bottom:10px;
        box-shadow:0 6px 20px rgba(0,0,0,0.15);
        font-size:.9rem;
      }
      
      /* ===== TABLA ===== */
      .table-scroll{
        max-height:550px;
        overflow-y:auto;
      }

      .sop-table{
              width:100%;
              border-collapse:collapse;
            }

      
      .sop-table tbody tr{
      cursor:pointer;
      }
      
      .sop-table thead th{
        position:sticky;
        top:0;
        background:#1e293b;
        color:#cbd5e1;
        padding:14px 18px;
        font-size:.75rem;
        text-transform:uppercase;
      }
      
      .sop-table td{
        padding:16px 18px;
        border-bottom:1px solid #f1f5f9;
      }
      .sop-table td:last-child{
        text-align:right;
        white-space:nowrap;
      }

      .sop-table td:nth-child(2){
        word-break:break-word;
      }

      .sop-table tbody tr {
          background: rgba(255, 255, 255, 0.6); /* blanco translúcido */
      }
      
      .sop-table tbody tr:nth-child(even) {
          background: rgba(255, 255, 255, 0.5);
      }
      
      .sop-table tbody tr:hover {
          background: rgba(255, 255, 255, 0.8); /* más visible al pasar el mouse */
      }

      

      /* ===== NOMBRE SOP (COLUMNA PROCEDIMIENTO) ===== */
.sop-nombre {
  font-weight: 600;              /* más negrita pero elegante */
  font-size: 15px;               /* un poco más grande */
  color: #1f2d3d;                /* color profesional */
  letter-spacing: 0.3px;         /* mejora lectura */
  transition: all 0.2s ease;     /* animación suave */
}

/* Efecto al pasar el mouse */
.sop-nombre:hover {
  color: #007bff;                /* azul moderno */
  cursor: pointer;
  transform: translateX(3px);    /* pequeño movimiento */
}

/* Opcional: que toda la fila reaccione */
tr:hover .sop-nombre {
  color: #007bff;
}
      /* ===== BOTON ===== */
      .sop-btn{
        display:inline-flex;
        align-items:center;
        gap:6px;
        padding:8px 16px;
        border-radius:10px;
        background:linear-gradient(135deg,#0072C6,#005a9e);
        color:white;
        text-decoration:none;
        font-size:.85rem;
      }
      
      .sop-btn:hover{
        transform:scale(1.05);
      }
      
      /* ===== BADGES ===== */
      .dept-badge{
        padding:6px 12px;
        border-radius:999px;
        font-size:.75rem;
        font-weight:600;
      }
      
      .dept-carpinteria{background:#e0f2fe;color:#0369a1;}
      .dept-administracion{background:#ede9fe;color:#5b21b6;}
      .dept-comercial{background:#dcfce7;color:#166534;}
      .dept-stone{background:#fef3c7;color:#92400e;}
      .dept-maquinarias{background:#fee2e2;color:#991b1b;}
      .dept-vehiculos{background:#e5e7eb;color:#374151;}
      .dept-ecopower{background:#cffafe;color:#0e7490;}
      .dept-houzz-pro{background:#f3e8ff;color:#7e22ce;}
      .dept-medidas{background:#f3e8ff;color:#7e22ce;}
      .dept-taller{background:#dcfce7;color:#166534;}
      
      /* ===== LOGIN MODAL ===== */
      #loginModal{
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.5);
        justify-content:center;
        align-items:center;
        z-index:9999;
      }
      
      #loginModal .modal-content{
        background:#1e1e2f;
        padding:30px 25px;
        border-radius:12px;
        width:95%;
        max-width:380px;
        text-align:center;
        color:#fff;
      }
      

      #loginModal select,
      #loginModal input{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:14px;
        box-sizing:border-box;
        height:42px; /* 🔥 clave para igualar altura */
      }
            
      #loginModal button{
        width:100%;
        padding:10px;
        background:#ffcc00;
        border:none;
        border-radius:8px;
        font-weight:bold;
        cursor:pointer;
      }

      .video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -1; /* queda detrás de todo */
}

.video-background video {
    width: 100%;
    height: 100%;
    object-fit: cover; /* mantiene proporción y recorta si es necesario */
}

</style>
</head>

<!-- LOGIN MODAL (UNO SOLO ✔️) -->
<div id="loginModal">
  <div class="modal-content">
    <h2>Iniciar sesión</h2>
    <select id="loginUser">
      <option value="">Seleccione usuario</option>
    </select>

    <input type="password" id="loginPass" placeholder="Clave">

    <div id="loginError" style="color:red; display:none;">Usuario o clave incorrecta</div>

    <button id="loginBtn">Entrar</button>
  </div>
</div>

<script>

/* ===== USUARIOS (NO TOCADO) ===== */
const usuarios = [
  {usuario:"Damian Molina", clave:"Dam1975", rol:"editor", depto:"Comercial", correo:"damian@artemisamarble.com"},
  {usuario:"Alberto Molina", clave:"Alb1975", rol:"editor", depto:"Administracion", correo:"frontdesk@artemisamarble.com"},
  {usuario:"Gabriel Batista", clave:"Gab1975", rol:"editor", depto:"Comercial", correo:"sales@artemisamarble.com"},
  {usuario:"Wendy Romanach", clave:"Wen1975", rol:"editor", depto:"Administración", correo:"accounting@artemisamarble.com"},
  {usuario:"Carlos Herrera", clave:"Art2026", rol:"admin", depto:"Control", correo:"control@artemisamarble.com"},
  {usuario:"Jenny Perez", clave:"Jen1975", rol:"editor", depto:"Comercial", correo:"jenny@artemisamarble.com"},
  {usuario:"Eliana Pineda", clave:"Eli1975", rol:"editor", depto:"Comercial", correo:"jenny@artemisamarble.com"},
  {usuario:"Yoandry Perez", clave:"Yoa1975", rol:"editor", depto:"Comercial", correo:"yoandry@artemisamarble.com"},
  {usuario:"Krishna Rojas", clave:"Kri1975", rol:"editor", depto:"Diseño", correo:"jobs@artemisamarble.com"},
  {usuario:"Juan Pablo", clave:"Jua1975", rol:"editor", depto:"Diseño", correo:"sales3@artemisamarble.com"},
  {usuario:"Yozusi Urdaneta", clave:"Yoz1975", rol:"editor", depto:"Gerencia", correo:"wood@artemisamarble.com"}
      
];

let currentUser = null;
let SOP_INDEX = [];

/* ===== MENU ===== */
function toggleMenu(){
  document.querySelector('.menu').classList.toggle('show');
}

/* ===== LOGIN ===== */
function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

function populateUsers(){
  const select = document.getElementById("loginUser");
  select.innerHTML = '<option value="">Seleccione usuario</option>';
  usuarios.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.usuario;
    opt.textContent = u.usuario;
    select.appendChild(opt);
  });
}


document.getElementById("loginBtn").addEventListener("click", ()=> {
  const userName = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;

  const user = usuarios.find(u=>u.usuario===userName && u.clave===pass);

  if(user){
    currentUser = user;
    localStorage.setItem("usuario", user.usuario);
    closeLogin();
    mostrarBienvenida(user.usuario);
    // 👉 Aquí es donde debes agregar:
    mostrarUsuario(user); 
  }else{
    document.getElementById("loginError").style.display = "block";
  }
});
      
function mostrarUsuario(user){
  const userDiv = document.getElementById("userInfo");
  const userNameSpan = document.getElementById("userName");

  userNameSpan.textContent = user.usuario; // mostrar nombre
  userDiv.style.display = "flex";          // mostrar bloque
}
      
function mostrarBienvenida(nombre){
  const msg = document.getElementById("welcome-msg");
  msg.textContent = `Bienvenido, ${nombre}`;
  msg.classList.add("show");
  setTimeout(()=> msg.classList.remove("show"),3000);
}

function logout(){
  currentUser = null;
  localStorage.removeItem("usuario");
  document.getElementById("userInfo").style.display = "none";
window.location.href = "https://marbleartemisa.github.io/sop-site/";
}


      
/* ===== SOP DATA ===== */
fetch('SOP_INDEX.json?v=' + Date.now())
.then(res=>res.json())
.then(data=>{
  SOP_INDEX = data;
  sortByDepartment();
  renderSOP();
});

function sortByDepartment(){
  SOP_INDEX.sort((a,b)=>{
    if(a.department < b.department) return -1;
    if(a.department > b.department) return 1;
    return (a.title||"").localeCompare(b.title||"");
  });
}

      

function renderSOP(filtered){
  const container = document.getElementById("sopContainer");
  const list = filtered || SOP_INDEX;

  let html = `
  <div class="sop-info">
  Mostrando <strong>${list.length}</strong> SOP
  </div>

  <table class="sop-table">
  <thead>
  <tr>
  <th onclick="sortTable('department')">Departamento</th>
  <th onclick="sortTable('title')">Procedimiento</th>
  <th>Acción</th>
  </tr>
  </thead>
  <tbody>
  `;

  list.forEach(sop=>{
    html += `
            <tr onclick="openSOP('${sop.url}')" style="cursor:pointer;">
              <td data-label="Departamento">${getDepartmentBadge(sop.department)}</td>
              <td data-label="Procedimiento" class="sop-nombre">${sop.title}</td>
              <td>
                <a class="sop-btn" 
                   href="/sop-site/viewer.html?doc=${sop.url}"
                   onclick="event.stopPropagation()">
                Ver
                </a>
              </td>
            </tr>
    `;
  });

      
  html += `</tbody></table>`;
  container.innerHTML = html;
}

/* ===== BADGES ===== */
function getDepartmentBadge(dep){

  if(dep==="produccion") dep="carpinteria";
  if(dep==="instalacion") dep="stone";

  const names={
    carpinteria:"Carpintería",
    administracion:"Administración",
    comercial:"Comercial",
    stone:"Stone",
    maquinarias:"Maquinarias",
    vehiculos:"Vehículos",
    ecopower:"Ecopowertech",
    taller:"Taller",
    medidas:"Diseño-Medidas",
    "houzz-pro":"Houzz Pro"
  };

  return `<span class="dept-badge dept-${dep}">${names[dep]||dep}</span>`;
}

/* ===== FILTROS ===== */
document.getElementById("searchInput").addEventListener("input",filterSOP);
document.getElementById("deptFilter").addEventListener("change",filterSOP);

function filterSOP(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const dept = document.getElementById("deptFilter").value;

  const filtered = SOP_INDEX.filter(sop=>{
    return (!dept || sop.department===dept) &&
    (sop.title.toLowerCase().includes(search));
  });

  renderSOP(filtered);
}

function filterDept(dep){
  document.getElementById("deptFilter").value = dep;
  filterSOP();
}

// 🔹 Destacar opción de menú según URL
function destacarMenu() {
  const links = document.querySelectorAll(".menu a");
  const path = window.location.pathname; // ruta actual
  links.forEach(link => {
    if (link.getAttribute("href") === path) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  destacarMenu();
});

/* ===== SORT ===== */
function sortTable(field){
  SOP_INDEX.sort((a,b)=>{
    return (a[field]||"").localeCompare(b[field]||"");
  });
  renderSOP();
}

/* ===== EDITAR SOP ===== */
function editSOP(){
  if(!currentUser){
    alert("Debe iniciar sesión");
    openLogin();
    return;
  }

  const pass = prompt("Ingrese su clave");
  if(pass === currentUser.clave){
    window.location.href="/sop-site/sop-viewer-edit/";
  }else{
    alert("Clave incorrecta");
  }
}

function openSOP(url){
  window.location.href = "/sop-site/viewer.html?doc=" + url;
}

/* ===== INIT ===== */
window.addEventListener("DOMContentLoaded", ()=>{

  populateUsers();

  const savedUser = localStorage.getItem("usuario");
  if(savedUser){
    currentUser = usuarios.find(u=>u.usuario===savedUser);
    if(currentUser) {
      mostrarBienvenida(currentUser.usuario);
      mostrarUsuario(currentUser);
    }
  }else{
    openLogin();
  }

  // ENTER para login
  document.getElementById("loginPass").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
      e.preventDefault();
      document.getElementById("loginBtn").click();
    }
  });

  // ✅ 👇 AQUÍ MISMO
  document.querySelectorAll('.menu a').forEach(link=>{
    link.addEventListener('click', ()=>{
      document.querySelector('.menu').classList.remove('show');
    });
  });

});
      
</script>  
</body>
