<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEMISA MARBLE & CABINETS - Biblioteca SOP</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>
  <nav class="menu">
    <a href="#">Inicio</a>
    <a href="#">Registrar SOP</a>
    <a href="#">Aportes SOP</a>
    <a href="#" onclick="openLogin('editor')">Editar SOP</a>
    <a href="#" onclick="openLogin('admin')">Admin</a>
  </nav>
  <div class="user-actions">
    <span id="userInfo"></span>
    <button onclick="logout()" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>

<!-- BANNER -->
<section class="banner">
  <h1>Biblioteca de Procedimientos Operativos Estándar</h1>
  <p>ARTEMISA MARBLE & CABINETS</p>
  <a href="#sopContainer" class="cta-btn">Ver SOP</a>
</section>

<!-- FILTROS -->
<section class="filters">
  <input type="text" id="searchInput" placeholder="Buscar SOP...">
  <div class="dept-buttons">
    <button onclick="filterDept('')" class="dept-filter active">Todos</button>
    <button onclick="filterDept('comercial')" class="dept-filter">Comercial</button>
    <button onclick="filterDept('produccion')" class="dept-filter">Producción</button>
    <button onclick="filterDept('instalacion')" class="dept-filter">Instalación</button>
    <button onclick="filterDept('administracion')" class="dept-filter">Administración</button>
    <button onclick="filterDept('maquinarias')" class="dept-filter">Maquinarias</button>
    <button onclick="filterDept('vehiculos')" class="dept-filter">Vehículos</button>
    <button onclick="filterDept('houzz-pro')" class="dept-filter">Houzz Pro</button>
    <button onclick="filterDept('medidas')" class="dept-filter">Medidas</button>
    <button onclick="filterDept('taller')" class="dept-filter">Taller</button>
  </div>
</section>

<!-- TABLA SOP -->
<section class="sop-section">
  <table id="sopTable">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre SOP</th>
        <th>Departamento</th>
        <th>Última actualización</th>
        <th>Responsable</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="sopContainer">
      <!-- SOP dinámicos desde main.js -->
    </tbody>
  </table>
</section>

<!-- VIDEOS -->
<section class="videos">
  <video autoplay muted loop playsinline>
    <source src="seleccion video 5.MP4" type="video/mp4">
  </video>
  <iframe src="https://www.youtube.com/embed/ZaGJEKPt-A0" allowfullscreen></iframe>
  <video autoplay muted loop playsinline>
    <source src="seleccion video super 1.mp4" type="video/mp4">
  </video>
</section>

<!-- CARRUSEL -->
<section class="carousel-premium">
  <div class="carousel-track-premium">
    <div class="slide"><img src="ABQM0471.JPG" alt="Imagen 1"></div>
    <div class="slide"><img src="outlet.png" alt="Outlet"></div>
    <div class="slide"><img src="VanitiesBath.png" alt="Vanities & Bath"></div>
    <div class="slide"><img src="IMG_2393.JPG" alt="Imagen 4"></div>
    <div class="slide"><img src="IHCH5272.JPG" alt="Imagen 5"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  © 2026 ARTEMISA MARBLE & CABINETS Rev 2.0
</footer>

<!-- LOGIN MODAL -->
<div id="loginModal" class="login-modal" style="display:none;"></div>

<script src="main.js" defer></script>
</body>
</html>
