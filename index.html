<!-- SECCIÓN DE VIDEOS DENTRO DEL DISEÑO EXISTENTE -->
<div class="container">
  <h2>Videos Destacados</h2>
  <div class="video-carousel">
    <button class="prev">&#10094;</button>
    <div class="carousel-track">
      <div class="carousel-item">
        <video src="video1.mp4" controls></video>
      </div>
      <div class="carousel-item">
        <video src="video2.mp4" controls></video>
      </div>
      <div class="carousel-item">
        <video src="video3.mp4" controls></video>
      </div>
    </div>
    <button class="next">&#10095;</button>
  </div>
</div>

<style>
.video-carousel {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  margin-top: 20px;
  background: rgba(255,255,255,0.92); /* mantiene el estilo de tus contenedores */
  backdrop-filter: blur(10px);
  padding: 15px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

.carousel-track {
  display: flex;
  transition: transform 0.4s ease-in-out;
}

.carousel-item {
  min-width: 100%;
  padding: 10px;
}

.carousel-item video {
  width: 100%;
  border-radius: 10px;
}

.video-carousel button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: var(--color-primary);
  border: none;
  color: white;
  font-size: 2rem;
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 50%;
  z-index: 10;
  opacity: 0.8;
  transition: opacity 0.3s;
}

.video-carousel button:hover {
  opacity: 1;
}

.video-carousel .prev { left: 10px; }
.video-carousel .next { right: 10px; }

@media(max-width:768px){
  .video-carousel button { font-size: 1.5rem; }
}
</style>

<script>
const track = document.querySelector('.video-carousel .carousel-track');
const items = Array.from(track.children);
const nextBtn = document.querySelector('.video-carousel .next');
const prevBtn = document.querySelector('.video-carousel .prev');
let index = 0;

function updateCarousel(){
  track.style.transform = `translateX(-${index * 100}%)`;
}

nextBtn.addEventListener('click', ()=>{
  index = (index + 1) % items.length;
  updateCarousel();
});

prevBtn.addEventListener('click', ()=>{
  index = (index - 1 + items.length) % items.length;
  updateCarousel();
});
</script>
