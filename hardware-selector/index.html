<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selector de Hardware SOP | Artemisa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Inter,sans-serif;background:#111;color:#fff;}

.navbar{
  position:sticky;top:0;
  background:rgba(0,0,0,0.7);
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.container{max-width:1000px;margin:30px auto;padding:20px;}

.card{
  background:#fff;
  color:#111;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.item{
  background:#f5f5f5;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
  border:2px solid transparent;
}

.item.active{
  border-color:#0072C6;
  background:#eaf4ff;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#0072C6;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:15px;
  padding:15px;
  background:#f1f1f1;
  border-radius:10px;
}
.success{color:green;font-weight:bold;}
.warning{color:orange;font-weight:bold;}
.danger{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="navbar">
  <div>ARTEMISA SOP</div>
</div>

<div class="container">

<!-- RESULTADO -->
<div class="card">
  <h3>Compatibilidad</h3>
  <button onclick="runSOP()">Ver compatibilidad</button>
  <div id="result" class="result">Selecciona opciones</div>
</div>

<!-- GABINETES -->
<div class="card">
<h3>Gabinete</h3>
<div class="grid" id="cabinetGrid">

  <div class="item" onclick="selectCab('12', this)">12”</div>
  <div class="item" onclick="selectCab('15', this)">15”</div>
  <div class="item" onclick="selectCab('18', this)">18”</div>
  <div class="item" onclick="selectCab('24', this)">24”</div>
  <div class="item" onclick="selectCab('36', this)">36”</div>

</div>
</div>

<!-- HARDWARE -->
<div class="card">
<h3>Hardware</h3>
<div class="grid" id="sysGrid">

  <div class="item" onclick="selectSys('trash', this)">Trash</div>
  <div class="item" onclick="selectSys('24FC', this)">Full Circle</div>
  <div class="item" onclick="selectSys('24KS', this)">Kidney</div>
  <div class="item" onclick="selectSys('24PC', this)">Pie Cut</div>
  <div class="item" onclick="selectSys('lemans', this)">LeMans</div>
  <div class="item" onclick="selectSys('magic', this)">Magic</div>

</div>
</div>

</div>

<script>

let selectedCab = null;
let selectedSys = null;
  const SOP = {

trash: {
  "12": {
    status: "best",
    model: "Rev-A-Shelf 12” Single",
    cabinet: "12",
    type: "Single Bin System",
    capacity: "1 x 27–35 Qt",
    dimensions: `Bote: 14” L x 9.5” W x 18” H`,
    technical: "Sistema compacto para espacios pequeños"
  },

  "15": {
    status: "ok",
    model: "Rev-A-Shelf 15” Double",
    cabinet: "15",
    type: "Double Bin System",
    capacity: "50 Qt",
    dimensions: `Bote: 14.7” L x 10.7” W x 22.5” H`,
    technical: "Sistema estándar residencial"
  }
},

lazy: {
  "24FC": {
    status: "best",
    model: "Lazy Susan Full Circle",
    cabinet: "24",
    type: "Full Circle",
    capacity: "20 lbs por bandeja",
    dimensions: "24” diámetro",
    technical: "Gira completamente dentro del gabinete"
  },

  "24KS": {
    status: "best",
    model: "Kidney Shape",
    cabinet: "30–33",
    type: "270° Rotation",
    capacity: "Compact",
    dimensions: "24 x 14.3",
    technical: "Puertas fijas al gabinete"
  },

  "24PC": {
    status: "best",
    model: "Pie Cut",
    cabinet: "24",
    type: "Door Mounted",
    capacity: "Integrado",
    dimensions: "24 x 24",
    technical: "Puerta gira con bandeja"
  }
},

lemans: {
  "36": {
    status: "best",
    model: "LeMans II",
    cabinet: "36",
    type: "Corner Pull-Out",
    capacity: "Alta capacidad",
    dimensions: "19-3/4” profundidad mínima",
    technical: "Extracción articulada"
  }
},

magic: {
  "36": {
    status: "best",
    model: "Magic Corner",
    cabinet: "36",
    type: "Mechanical Corner",
    capacity: "Alta carga",
    dimensions: "38–44” ancho",
    technical: "Sistema de extracción total"
  }
}

};

/* =========================
   SELECTORES
========================= */

function selectCab(val, el){
  selectedCab = val;

  document.querySelectorAll("#cabinetGrid .item")
    .forEach(e => e.classList.remove("active"));

  if(el) el.classList.add("active");
}

function selectSys(val, el){
  selectedSys = val;

  document.querySelectorAll("#sysGrid .item")
    .forEach(e => e.classList.remove("active"));

  if(el) el.classList.add("active");
}

/* =========================
   MOTOR SOP FINAL
========================= */

function runSOP(){

  if(!selectedCab || !selectedSys){
    document.getElementById("result").innerHTML =
      `<div class="warning">Selecciona gabinete y hardware</div>`;
    return;
  }

  const data = SOP[selectedSys]?.[selectedCab];

  if(!data){
    document.getElementById("result").innerHTML =
      `<div class="danger">❌ No compatible</div>`;
    return;
  }

  showResult(data);
}

function showResult(data){

let html = "";

if(data.status === "best") html += `<div class="success">✔ RECOMENDADO</div>`;
else if(data.status === "ok") html += `<div class="warning">⚠ COMPATIBLE</div>`;
else html += `<div class="danger">❌ NO COMPATIBLE</div>`;

html += `<br><b>${data.model}</b><br>`;
html += `Gabinete: ${data.cabinet}"<br>`;
html += `Tipo: ${data.type}<br>`;
html += `Capacidad: ${data.capacity}<br>`;
html += `Dimensiones: ${data.dimensions}<br>`;
html += `Tech: ${data.technical}<br>`;

document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
