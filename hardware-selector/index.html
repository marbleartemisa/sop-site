<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selector de Hardware SOP | Artemisa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
*{box-sizing:border-box;}
html,body{margin:0;overflow-x:hidden;font-family:'Inter',sans-serif;}

body{
  background:#0f172a;
  color:#1f2937;
}

/* ===== NAVBAR (COPIA EXACTA DE TU SISTEMA) ===== */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:40px;
}

.menu{
  display:flex;
  gap:25px;
  flex:1;
  justify-content:center;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.menu a:hover{
  color:#00aaff;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

/* ===== CARD ===== */
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  margin-bottom:20px;
}

/* ===== SELECTS ===== */
select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

/* ===== BOTÓN ===== */
button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#0072C6,#005a9e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

/* ===== RESULTADO ===== */
.result{
  margin-top:15px;
  padding:15px;
  background:#f1f5f9;
  border-left:5px solid #0072C6;
  border-radius:10px;
  white-space:pre-line;
}

/* ===== TITULO ===== */
h1{
  color:white;
  text-align:center;
  margin-top:30px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:20px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>

  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a>
    <a href="/sop-site/analisis/">Análisis SOP</a>
    <a href="/sop-site/hardware-selector/">Selector Hardware</a>
    <a href="/sop-site/admin/">Admin</a>
  </div>
</div>

<!-- HEADER -->
<h1>Selector de Hardware SOP</h1>
<div class="subtitle">Sistema de compatibilidad de gabinetes y herrajes</div>

<!-- CONTENIDO -->
<div class="container">

  <div class="card">
    <label>Tipo de gabinete</label>
    <select id="cabinet">
      <option value="">Seleccionar</option>
      <option value="12">12” Base</option>
      <option value="15">15” Base</option>
      <option value="18">18” Base</option>
      <option value="24">24” Base</option>
      <option value="36">36” Corner</option>
    </select>

    <label>Sistema</label>
    <select id="system">
      <option value="">Seleccionar</option>
      <option value="trash">Trash Can</option>
      <option value="lazy">Lazy Susan</option>
      <option value="lemans">LeMans</option>
      <option value="magic">Magic Corner</option>
    </select>

    <button onclick="calc()">Generar recomendación</button>

    <div id="result" class="result"></div>
  </div>

</div>

<script>

function calc(){

let cab = document.getElementById("cabinet").value;
let sys = document.getElementById("system").value;

let out = "";

if(sys==="trash"){
  if(cab==="12"){
    out="Trash Can Single\n- 12 inch pull-out\n- 1 bin";
  } else if(cab==="15"){
    out="Trash Can Double Compact\n- 15 inch system\n- 2 bins";
  } else if(cab==="18"){
    out="Trash Can Double Standard\n- 18 inch heavy duty\n- 2 bins";
  } else {
    out="No compatible";
  }
}

if(sys==="lazy"){
  if(cab==="24"){
    out="Lazy Susan Compact\n- 24 inch system";
  } else if(cab==="36"){
    out="Lazy Susan Standard\n- 32–36 inch system";
  } else {
    out="No recomendado";
  }
}

if(sys==="lemans"){
  out = (cab==="36")
  ? "LeMans Standard\n- 18–21 inch system\n- 110° door required"
  : "Solo recomendado en 36 inch corner";
}

if(sys==="magic"){
  out = (cab==="36")
  ? "Magic Corner Standard\n- 18–20 inch system\n- Leveling critical"
  : "Preferido en 36 inch corner";
}

document.getElementById("result").innerText = out;

}

</script>

</body>
</html>
