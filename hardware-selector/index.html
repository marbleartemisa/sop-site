<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selector de Hardware SOP | Artemisa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
*{box-sizing:border-box;}
html,body{margin:0;overflow-x:hidden;font-family:'Inter',sans-serif;}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  position:relative;
  min-height:100vh;
  color:#1f2937;
}

/* BACKGROUND OVERLAY */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background-image:url('/sop-site/wall0.png');
  background-position:center;
  background-repeat:no-repeat;
  background-size:cover;

  z-index:-2;
}

/* OSCURECIMIENTO IGUAL QUE SOP PRINCIPAL */
body::after{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background:rgba(0,0,0,0.25);

  z-index:-1;
}

/* ===== NAVBAR (COPIA EXACTA DE TU SISTEMA) ===== */
.navbar{
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(8px);
  padding:10px 30px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  height:40px;
}

.menu{
  display:flex;
  gap:25px;
  flex:1;
  justify-content:center;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.menu a:hover{
  color:#00aaff;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}

/* ===== CARD ===== */
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  margin-bottom:20px;
}

/* ===== SELECTS ===== */
select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

/* ===== BOTÓN ===== */
button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#0072C6,#005a9e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

/* ===== RESULTADO ===== */
.result{
  margin-top:15px;
  padding:15px;
  background:#f1f5f9;
  border-left:5px solid #0072C6;
  border-radius:10px;
  white-space:pre-line;
}

/* ===== TITULO ===== */
h1{
  color:white;
  text-align:center;
  margin-top:30px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:20px;
}
.ux-card{
  background: rgba(255,255,255,0.95);
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  line-height:1.6;
  font-size:14px;
}

/* TITULOS */
.ux-card b{
  font-size:16px;
  color:#0f172a;
}

/* LINKS DE MARCAS COMO BOTONES */
.ux-card a{
  display:inline-block;
  margin-top:6px;
  margin-right:6px;
  padding:6px 10px;
  border-radius:8px;
  background:#0072C6;
  color:white !important;
  text-decoration:none;
  font-size:12px;
  transition:0.2s;
}

.ux-card a:hover{
  background:#005a9e;
  transform:scale(1.03);
}

/* SEPARADORES VISUALES */
.ux-card br{
  line-height:1.8;
}

/* ALERTAS UX */
.warning{
  background:#fff7ed;
  border-left:4px solid #f97316;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.danger{
  background:#fef2f2;
  border-left:4px solid #ef4444;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.success{
  background:#ecfdf5;
  border-left:4px solid #10b981;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA MARBLE & CABINETS</span>
  </div>

  <div class="menu">
    <a href="/sop-site/">Inicio</a>
    <a href="/sop-site/registrar-sop/">Registrar SOP</a>
    <a href="/sop-site/Aportes/">Aportes SOP</a>
    <a href="/sop-site/analisis/">Análisis SOP</a>
    <a href="/sop-site/hardware-selector/">Selector Hardware</a>
    <a href="/sop-site/admin/">Admin</a>
  </div>
</div>

<!-- HEADER -->
<h1>Selector de Hardware SOP</h1>
<div class="subtitle">Sistema de compatibilidad de gabinetes y herrajes</div>

<!-- CONTENIDO -->
<div class="container">

  <div class="card">
    <label>Tipo de gabinete</label>
    <select id="cabinet">
      <option value="">Seleccionar</option>
      <option value="12">12” Base</option>
      <option value="15">15” Base</option>
      <option value="18">18” Base</option>
      <option value="24">24” Base</option>
      <option value="36">36” Corner</option>
    </select>

    <label>Sistema</label>
    <select id="system">
      <option value="">Seleccionar</option>
      <option value="trash">Trash Can</option>
      <option value="lazy">Lazy Susan</option>
      <option value="lemans">LeMans</option>
      <option value="magic">Magic Corner</option>
    </select>

    <button onclick="calc()">Generar recomendación</button>

    <div id="result" class="result"></div>
  </div>

</div>

<script>

function calc(){

let cab = document.getElementById("cabinet").value;
let sys = document.getElementById("system").value;

let out = "";

function brandLinks(type){
  if(type==="trash"){
    return `
    <b>Marcas disponibles:</b><br>
    🔗 <a href="https://www.rev-a-shelf.com/" target="_blank">Rev-A-Shelf</a><br>
    🔗 <a href="https://www.hafele.com/us/en/" target="_blank">Häfele</a><br>
    🔗 <a href="https://www.blum.com/" target="_blank">Blum (limitado a sistemas similares)</a>
    `;
  }

  if(type==="lazy"){
    return `
    <b>Marcas disponibles:</b><br>
    🔗 <a href="https://www.rev-a-shelf.com/" target="_blank">Rev-A-Shelf Lazy Susan</a><br>
    🔗 <a href="https://www.hafele.com/us/en/" target="_blank">Häfele Corner Systems</a>
    `;
  }

  if(type==="lemans"){
    return `
    <b>Marcas disponibles:</b><br>
    🔗 <a href="https://www.hafele.com/us/en/" target="_blank">Häfele LeMans</a><br>
    🔗 <a href="https://www.rev-a-shelf.com/" target="_blank">Rev-A-Shelf Corner Pull-Out</a>
    `;
  }

  if(type==="magic"){
    return `
    <b>Marcas disponibles:</b><br>
    🔗 <a href="https://www.hafele.com/us/en/" target="_blank">Häfele Magic Corner</a><br>
    🔗 <a href="https://www.rev-a-shelf.com/" target="_blank">Rev-A-Shelf Magic Corner Systems</a>
    `;
  }

  return "";
}

/* ===================== TRASH ===================== */
if(sys==="trash"){
  if(cab==="12"){
    out = `
🗑 <b>Trash Can SINGLE</b><br><br>

<b>Especificaciones:</b><br>
- Ancho mínimo: 12” (305 mm)<br>
- 1 cubo (15–20L)<br>
- Full extension slides obligatorios<br><br>

<b>Limitaciones:</b><br>
- No compatible con doble bin<br>
- Requiere fondo limpio sin plumbing<br><br>

<b>Recomendación:</b> Uso residencial / light commercial<br><br>

${brandLinks("trash")}
`;
  }

  else if(cab==="15"){
    out = `
🗑 <b>Trash Can DOUBLE Compact</b><br><br>

<b>Especificaciones:</b><br>
- Ancho mínimo: 15” (381 mm)<br>
- 2 bins pequeños (10–15L)<br><br>

<b>Limitaciones:</b><br>
- No apto para bins grandes<br>
- Requiere gabinete reforzado<br><br>

<b>Recomendación:</b> Cocina estándar<br><br>

${brandLinks("trash")}
`;
  }

  else if(cab==="18"){
    out = `
🗑 <b>Trash Can DOUBLE Standard</b><br><br>

<b>Especificaciones:</b><br>
- Ancho mínimo: 18” (457 mm)<br>
- 2 bins (15–20L)<br>
- Heavy duty slides<br><br>

<b>Limitaciones:</b><br>
- Necesita profundidad mínima 21”<br><br>

<b>Recomendación:</b> Uso profesional<br><br>

${brandLinks("trash")}
`;
  }

  else {
    out="❌ No compatible con Trash Can";
  }
}

/* ===================== LAZY SUSAN ===================== */
if(sys==="lazy"){
  if(cab==="24"){
    out = `
🍃 <b>Lazy Susan Compact</b><br><br>

<b>Especificaciones:</b><br>
- 24” diámetro mínimo<br>
- Sistema de 2 niveles<br><br>

<b>Limitaciones:</b><br>
- No carga pesada<br><br>

${brandLinks("lazy")}
`;
  }

  else if(cab==="36"){
    out = `
🍃 <b>Lazy Susan Standard</b><br><br>

<b>Especificaciones:</b><br>
- 32”–36” diámetro<br>
- 2 o 3 niveles<br>
- Base reforzada MDF 3/4”<br><br>

<b>Limitaciones:</b><br>
- Requiere nivelación perfecta<br><br>

${brandLinks("lazy")}
`;
  }

  else {
    out="❌ No recomendado";
  }
}

/* ===================== LEMANS ===================== */
if(sys==="lemans"){
  if(cab==="36"){
    out = `
🍋 <b>LeMans Corner System</b><br><br>

<b>Especificaciones:</b><br>
- Gabinete: 36” corner (900x900 mm)<br>
- Bandejas extraíbles 18”–21”<br>
- Apertura puerta: 110° obligatorio<br><br>

<b>Limitaciones:</b><br>
- No funciona con 90° hinges<br>
- Requiere espacio libre interno preciso<br><br>

${brandLinks("lemans")}
`;
  } else {
    out="⚠ Solo recomendado en 36 inch corner";
  }
}

/* ===================== MAGIC CORNER ===================== */
if(sys==="magic"){
  if(cab==="36"){
    out = `
🧩 <b>Magic Corner System</b><br><br>

<b>Especificaciones:</b><br>
- Gabinete corner 36”<br>
- Sistema doble extracción<br>
- Rieles sincronizados<br><br>

<b>Limitaciones:</b><br>
- Sensible a desalineación<br>
- Requiere instalación profesional<br><br>

${brandLinks("magic")}
`;
  } else {
    out="⚠ Preferido en 36 inch corner";
  }
}

document.getElementById("result").innerHTML = `
<div class="ux-card">
  ${out}
</div>
`;
}

</script>

</body>
</html>
