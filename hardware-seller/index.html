<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hardware Seller - SOP</title>

<link rel="stylesheet" href="styles.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR (tu estándar) -->
<div class="navbar">
  <div class="logo">
    <img src="/sop-site/logo.png">
    <span>ARTEMISA HARDWARE</span>
  </div>

  <div class="menu">

    <a href="/sop-site/">Inicio</a>

    <div class="dropdown">
      <button class="drop-btn" onclick="toggleDropdown(this)">
        SOP <i class="fa-solid fa-chevron-down"></i>
      </button>

      <div class="dropdown-content">
        <a href="/sop-site/registrar-sop/">Registrar SOP</a>
        <a href="/sop-site/Aportes/">Aportes SOP</a>
        <a href="/sop-site/analisis/">Análisis SOP</a>
        <a href="/sop-site/admin/">Admin</a>
      </div>
    </div>

    <div class="dropdown">
      <button class="drop-btn" onclick="toggleDropdown(this)">
        Helpers <i class="fa-solid fa-chevron-down"></i>
      </button>

      <div class="dropdown-content">
        <a href="/sop-site/hardware-seller/">List of items</a>
        <a href="/sop-site/hardware-library/">Hardware Library</a>
      </div>
    </div>

  </div>
</div>

<!-- MAIN -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside id="sidebar"></aside>

  <!-- DETAIL -->
  <main id="detail">

    <div class="empty">
      <i class="fa-solid fa-hand-pointer"></i>
      <h2>Select a hardware item</h2>
      <p>Choose from the left list</p>
    </div>

  </main>

</div>

<script src="app.js"></script>
</body>
</html>
