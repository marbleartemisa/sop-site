<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor SOP PRO - Artemisa</title>

<style>
body{
  margin:0;
  background:#f1f5f9;
  font-family:"Segoe UI",Arial,sans-serif;
  display:flex;
}

/* CONTENEDOR GENERAL */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  background:#0f172a;
  color:white;
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{
  background:#2563eb;
  color:white;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* HEADER */
.doc-header{
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tool{
  background:white;
  border:1px solid #d1d5db;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* DOCUMENTO */
.doc-area{
  display:flex;
  justify-content:center;
  padding:10px;
}

.doc-frame{
  width:100%;
  max-width:900px;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* TEXTO SELECCIONADO */
.comment-mark{
  background:#fde68a;
  cursor:pointer;
}

/* PANEL COMENTARIOS */
.sidebar{
  width:320px;
  background:white;
  border-left:1px solid #e5e7eb;
  padding:10px;
  overflow:auto;
}

.comment-box{
  border:1px solid #e5e7eb;
  padding:8px;
  margin-bottom:8px;
  border-radius:6px;
  background:#f9fafb;
}

.comment-box:hover{
  background:#f3f4f6;
}
</style>
</head>

<body>

<div class="main">

<div class="topbar">
  <div>ARTEMISA SOP • VIEWER PRO</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="addComment()">💬 Comentar</button>
    <button class="tool" onclick="clearComments()">🗑 Limpiar</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame" id="docContent"></div>
</div>

</div>

<!-- PANEL DERECHO -->
<div class="sidebar">
  <h3>Comentarios</h3>
  <div id="commentList"></div>
</div>

<script>

// ===============================
// CARGAR DOCUMENTO
// ===============================
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc") || "sop.html";

const container = document.getElementById("docContent");

fetch(doc)
  .then(res => res.text())
  .then(html => {
    container.innerHTML = html;
    loadComments();
  });


// ===============================
// AGREGAR COMENTARIO
// ===============================
function addComment(){
  const selection = window.getSelection();

  if(!selection.rangeCount){
    alert("Selecciona texto");
    return;
  }

  const range = selection.getRangeAt(0);

  if(range.collapsed){
    alert("Selecciona texto válido");
    return;
  }

  const text = selection.toString();
  const comment = prompt("Escribe tu comentario:");
  if(!comment) return;

  const id = "c" + Date.now();

  const span = document.createElement("span");
  span.className = "comment-mark";
  span.dataset.id = id;

  try{
    range.surroundContents(span);
  }catch(e){
    alert("No se puede comentar ese bloque (intenta seleccionar menos)");
    return;
  }

  span.innerText = text;

  saveComment({
    id,
    text,
    comment
  });

  selection.removeAllRanges();
  renderComments();
}


// ===============================
// GUARDAR COMENTARIOS
// ===============================
function saveComment(data){
  const comments = JSON.parse(localStorage.getItem(doc) || "[]");
  comments.push(data);
  localStorage.setItem(doc, JSON.stringify(comments));
}


// ===============================
// CARGAR COMENTARIOS
// ===============================
function loadComments(){
  const comments = JSON.parse(localStorage.getItem(doc) || "[]");

  comments.forEach(c=>{
    highlightText(c);
  });

  renderComments();
}


// ===============================
// RESALTAR TEXTO GUARDADO
// ===============================
function highlightText(c){
  const content = container.innerHTML;

  if(content.includes(c.text)){
    container.innerHTML = content.replace(
      c.text,
      `<span class="comment-mark" data-id="${c.id}">${c.text}</span>`
    );
  }
}


// ===============================
// PANEL LATERAL
// ===============================
function renderComments(){
  const list = document.getElementById("commentList");
  list.innerHTML = "";

  const comments = JSON.parse(localStorage.getItem(doc) || "[]");

  comments.forEach(c=>{
    const div = document.createElement("div");
    div.className = "comment-box";

    div.innerHTML = `
      <b>${c.text}</b><br>
      ${c.comment}
    `;

    div.onclick = ()=>{
      const el = document.querySelector(`[data-id="${c.id}"]`);
      if(el){
        el.scrollIntoView({behavior:"smooth", block:"center"});
        el.style.background = "#fca5a5";
        setTimeout(()=> el.style.background="#fde68a", 1000);
      }
    };

    list.appendChild(div);
  });
}


// ===============================
// LIMPIAR
// ===============================
function clearComments(){
  if(confirm("Eliminar todos los comentarios?")){
    localStorage.removeItem(doc);
    location.reload();
  }
}

</script>

</body>
</html>
