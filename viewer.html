<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<style>
/* ===== BODY & GENERAL ===== */
body {
    margin: 0;
    background: #eef2f7;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== TOPBAR ===== */
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
}
.brand { font-weight: 600; letter-spacing: .4px; font-size: 15px; }
.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

/* ===== DOC HEADER & NAV ===== */
.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}
.tool:hover { background: #2563eb; color: white; }
.tool.disabled { opacity: .5; pointer-events: none; }

/* ===== DOC AREA ===== */
.doc-area { display: flex; justify-content: center; padding: 10px 20px 40px; }
.doc-frame {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 80vh;
    overflow: visible;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}
iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== COMMENTS LAYER ===== */
#commentsLayer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 450;
}
.floating-comment {
  position: absolute; /* relativo al contenedor del iframe */
  pointer-events: auto;
  z-index: 999;
}
.floating-comment div {
  background: rgba(255,255,255,0.9);
  border-left: 4px solid #dc2626; /* borde rojo */
  color: #dc2626; /* texto rojo */
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
  font-style: italic;
  max-width: 220px;
  word-wrap: break-word;
}
.floating-comment textarea {
  width: 200px;
  height: 60px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.9);
  font-style: italic;
  font-size: 12px;
  resize: none;
}

/* ===== CLICK LAYER ===== */

#clickLayer {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:9999; /* 🔥 subirlo */
    cursor: crosshair;
    background: rgba(255,0,0,0.0); /* invisible pero activo */
    display:none;
}

/* ===== COMMENT SIDEBAR ===== */
#commentSidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    height: 100%;
    background: white;
    box-shadow: -10px 0 30px rgba(0,0,0,.2);
    padding: 20px;
    transform: translateX(100%);
    transition: .35s ease;
    z-index: 200;
    overflow-y: auto;
}
#commentSidebar.active { transform: translateX(0); }
#toggleSidebarBtn {
    position: fixed;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    z-index: 300;
}
select, input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    margin-bottom: 12px;
    font-size: 14px;
}
select:focus, input:focus, textarea:focus { border-color: #2563eb; outline: none; background: white; }

/* ===== COMMENT BOX ===== */
.comment-box {
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #f1f5f9;
    border-left: 4px solid #2563eb;
}

/* ===== LOADER ===== */
.comments-loader { display: none; text-align: center; padding: 18px; color: #6b7280; font-size: 13px; }
.spinner {
    width: 22px;
    height: 22px;
    border: 3px solid #e5e7eb;
    border-top: 3px solid #2563eb;
    border-radius: 50%;
    margin: 0 auto 8px;
    animation: spin 1s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== LOGIN OVERLAY ===== */
#loginOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}
.login-card {
    background: white;
    padding: 35px;
    border-radius: 16px;
    width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
}
#loginMessage { color: red; font-size: 13px; margin-bottom: 10px; }

.login-card button {
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}
#loginOverlay .login-card button#loginBtn { background: #2563eb; color: white; }
#loginOverlay .login-card button#loginBtn:hover { background: #1e40af; }
#loginOverlay .login-card button.cancelBtn { background: #e5e7eb; color: #111; }
#loginOverlay .login-card button.cancelBtn:hover { background: #cbd5e1; }

.login-card select,
.login-card input[type="password"] {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  margin-bottom: 12px;
  font-size: 14px;
  box-sizing: border-box;
}
.login-card select:focus,
.login-card input:focus { border-color: #2563eb; outline: none; background: white; }

/* ===== MODAL NUEVO COMENTARIO ===== */
#commentModal {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    max-width:90%;
    background:white;
    z-index:1000;
    border-radius:14px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" onclick="showLogin()">🔒 Editar</button>
    <button class="tool" id="commentBtn" onclick="commentSelectedText()">💬 Comentar</button>
      <button class="tool" onclick="exitEditMode()">❌ Salir edición</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="clickLayer"></div>
    <div id="commentsLayer"></div>
  </div>
</div>

<div id="commentSidebar">
  <div id="commentsLoader" class="comments-loader">
    <div class="spinner"></div>
    Cargando comentarios...
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;">💬 Comentarios</h3>
    <span style="cursor:pointer; font-size:18px;" onclick="closeSidebar()">✖</span>
  </div>
  <div id="commentList"></div>
  <label>Empleado</label>
  <select id="commentUser"></select>
  <label>Tipo</label>
  <select id="commentType">
    <option value="Error">Error</option>
    <option value="Mejora">Mejora</option>
    <option value="Sugerencia">Sugerencia</option>
  </select>
  <label>Estado</label>
  <select id="commentStatus">
    <option value="Pendiente">Pendiente</option>
    <option value="Revisado">Revisado</option>
    <option value="Aprobado">Aprobado</option>
  </select>
</div>

<div id="loginOverlay">
  <div class="login-card">
    <h3>🔒 Acceso de edición</h3>
    <div id="loginMessage"></div>
    <select id="loginUser">
      <option value="">Seleccionar usuario</option>
      <option>Damian Molina</option>
      <option>Alberto Molina</option>
      <option>Gabriel Batista</option>
      <option>Jenny Perez</option>
      <option>Yoandry Perez</option>
      <option>Wendy Romanach</option>
      <option>Otros</option>
    </select>
    <input type="password" id="loginPass" placeholder="Contraseña">
    <div style="margin-top:15px;text-align:right;">
         <button id="loginBtn" onclick="checkLogin()">Ingresar</button>
        <button class="cancelBtn" onclick="closeLogin()">Cancelar</button>
    </div>
  </div>
</div>

<div id="commentModal">
  <h3>💬 Nuevo comentario</h3>
  <textarea id="commentInput" placeholder="Escribe tu comentario..."></textarea>
  <div style="margin-top:15px;text-align:right;">
    <button onclick="closeCommentModal()" style="margin-right:10px;">Cancelar</button>
    <button id="saveCommentBtn" onclick="saveComment()">Guardar</button>
  </div>
</div>

<button id="toggleSidebarBtn">💬</button>

<script>
let editMode = false;
let currentUser = "";
let currentPage = 1;
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc") || "";
let idSOP = params.get("id") || "";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
const frame = document.getElementById("frame");

const users = {
  "Damian Molina":"Dam1975",
  "Alberto Molina":"Alb1975",
  "Gabriel Batista":"Gab1975",
  "Jenny Perez":"Jen1975",
  "Yoandry Perez":"Yoa1975",
  "Wendy Romanach":"Wen1975",
  "Otros":"Otr1975"
};

// ====================== LOGIN ======================
function showLogin(){ document.getElementById("loginOverlay").style.display="flex"; }
function closeLogin(){ document.getElementById("loginOverlay").style.display="none"; }

function checkLogin(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const msg = document.getElementById("loginMessage");

  if(!user){ msg.innerText="Seleccione usuario"; return; }
  if(users[user]!==pass){ msg.innerText="Clave incorrecta"; return; }

  editMode = true; 
  currentUser = user;

  setEditModeUI(true);

  const clickLayer = document.getElementById("clickLayer");
  clickLayer.style.display = "block";

  // 🔥 CLAVE
  frame.style.pointerEvents = "none";

  clickLayer.onclick = function(e){
    const rect = frame.getBoundingClientRect();

    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    openCommentModal({x, y, page: currentPage});
  };

  document.getElementById("commentSidebar").classList.add("active");
  loadComments();

  closeLogin();
}

// ====================== EDIT MODE ======================
function exitEditMode(){
  editMode = false;

  document.getElementById("clickLayer").style.display = "none";
  frame.style.pointerEvents = "auto";

  document.getElementById("commentSidebar").classList.remove("active");

  // opcional: reset UI
  setEditModeUI(false);
}
    
function setEditModeUI(enabled){
  document.getElementById("commentUser").disabled = !enabled;
  document.getElementById("commentType").disabled = !enabled;
  document.getElementById("commentStatus").disabled = !enabled;
  const btn = document.getElementById("commentBtn");
  if(btn) btn.classList.toggle("disabled", !enabled);
}

document.getElementById("loginPass").addEventListener("keypress", e => {
  if(e.key === "Enter") checkLogin();
});

// ====================== SIDEBAR ======================
function closeSidebar(){ document.getElementById("commentSidebar").classList.remove("active"); }
document.getElementById("toggleSidebarBtn").addEventListener("click", () => {
  document.getElementById("commentSidebar").classList.toggle("active");
     // 🔥 salir de edición también
  exitEditMode();
});

    
// ====================== MODAL ======================
function openCommentModal(data){
  const modal = document.getElementById("commentModal");
  modal.style.display="block";
  modal.dataset.x = data.x;
  modal.dataset.y = data.y;
  modal.dataset.page = data.page;
  document.getElementById("commentInput").focus(); // ✅ focus automático
  document.getElementById("commentInput").value = "";
}
function closeCommentModal(){ 
  document.getElementById("commentModal").style.display = "none"; 
}

// ====================== GUARDAR COMENTARIO ======================
async function saveComment(){
  const modal = document.getElementById("commentModal");
  const btn = document.getElementById("saveCommentBtn");
  if(btn.disabled) return;
  btn.disabled = true;

  const text = document.getElementById("commentInput").value.trim();
  if(!text){ alert("Comentario vacío"); btn.disabled=false; return; }

  const newComment = {
    id_comment: Date.now().toString(),
    usuario: currentUser || "Anónimo",
    tipo: document.getElementById("commentType").value,
    estado_revision: "Pendiente",
    comentario: text,
    x: parseFloat(modal.dataset.x),
    y: parseFloat(modal.dataset.y),
    page: parseInt(modal.dataset.page)
  };

  try {
    const res = await fetch(SCRIPT_URL, {
      method:"POST",
      body: JSON.stringify({...newComment, id_sop:idSOP, tipo:"comentario"})
    });
    const result = await res.json();
    if(result.success){
      if(!window.loadedComments) window.loadedComments=[];
      window.loadedComments.push(newComment);
      renderCommentsForPage(currentPage);
      closeCommentModal();
    } else alert("Error guardando comentario: "+result.error);
  } catch(err){ alert("Error guardando comentario: "+err); }
  finally{ btn.disabled=false; }
}

// ====================== RENDER COMENTARIOS ======================
function renderCommentsForPage(pageNumber){
  if(!window.loadedComments) return;
  const iframeDoc = frame.contentDocument || frame.contentWindow.document;
  if(!iframeDoc || !iframeDoc.body) return;
  iframeDoc.body.style.position="relative";

  let commentsContainer = iframeDoc.getElementById("commentsLayerInside");
  if(!commentsContainer){
    commentsContainer = iframeDoc.createElement("div");
    commentsContainer.id="commentsLayerInside";
    commentsContainer.style.position="absolute";
    commentsContainer.style.top="0";
    commentsContainer.style.left="0";
    commentsContainer.style.width="100%";
    commentsContainer.style.height="100%";
    commentsContainer.style.pointerEvents="none";
    commentsContainer.style.zIndex="9998";
    iframeDoc.body.appendChild(commentsContainer);
  }
  commentsContainer.innerHTML="";

  const docWidth = iframeDoc.documentElement.scrollWidth;
  const docHeight = iframeDoc.documentElement.scrollHeight;

  window.loadedComments
    .filter(c => Number(c.page)===pageNumber)
    .forEach(c=>{
      const el = iframeDoc.createElement("div");
      el.className="floating-comment";
      el.style.top=(c.y*100)+"%";
      el.style.left=(c.x*100)+"%";
      el.innerHTML=`<div>[${c.tipo}] ${c.comentario}</div>`;
      commentsContainer.appendChild(el);
    });
}

// ====================== CARGAR COMENTARIOS ======================
async function loadComments(){
  const loader = document.getElementById("commentsLoader");
  loader.style.display="block";
  try {
    const res = await fetch(SCRIPT_URL+"?action=getComments&id_sop="+idSOP);
    const data = await res.json();
    window.loadedComments = data.comments || [];
    renderCommentsForPage(currentPage);
  } catch(err){ console.error("Error cargando comentarios:",err); }
  finally{ loader.style.display="none"; }
}

// ====================== DOC ======================
if(doc){
  frame.src = decodeURIComponent(doc);
}
</script>

</body>
</html>
