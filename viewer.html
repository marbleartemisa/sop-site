<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f7;
}

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #0f172a;
    color: white;
    padding: 12px 20px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
}

.topbar .brand {
    font-weight: 600;
    font-size: 15px;
}

.topbar .back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.viewer-container {
    max-width: 1100px;
    margin: 70px auto 40px auto;
    position: relative;
}

iframe {
    width: 100%;
    height: 80vh;
    border: none;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

.buttons-top {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 8px;
}

.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.tool:hover {
    background: #2563eb;
    color: white;
}

.tool.disabled {
    opacity: 0.5;
    pointer-events: none;
}

/* Botones flotantes Anterior / Siguiente */
#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.3s;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: -10px; }
#nextDocBtn { right: -10px; }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand" id="title">Documento SOP</div>
    <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="viewer-container">
    <iframe id="frame"></iframe>
    <div class="buttons-top">
        <button class="tool" onclick="openNew()">Abrir</button>
        <button class="tool" onclick="downloadDoc()">Descargar</button>
        <button class="tool" onclick="printDoc()">Imprimir</button>
    </div>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
const frame = document.getElementById("frame");
if(doc) frame.src = doc;

// Abrir en nueva pestaña
function openNew() { if(doc) window.open(doc, "_blank"); }

// Descargar
function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

// Imprimir
function printDoc() { frame.contentWindow.print(); }

// ======================
// Navegación SOP
// ======================
fetch('SOP_INDEX.json')
.then(res => res.json())
.then(data => {
    if (!data.length) return;

    if (!doc) doc = data[0].url;

    const sopList = data.map(s => s.url);
    let currentIndex = sopList.indexOf(doc);
    if(currentIndex === -1) currentIndex = 0;

    const currentSOP = data[currentIndex];
    document.getElementById("title").innerText = currentSOP.title.toUpperCase();

    window.prevSOP = function() {
        if (currentIndex > 0) {
            const prev = data[currentIndex - 1];
            window.location.href = `viewer.html?doc=${prev.url}&id=${prev.id}`;
        }
    };

    window.nextSOP = function() {
        if (currentIndex < data.length - 1) {
            const next = data[currentIndex + 1];
            window.location.href = `viewer.html?doc=${next.url}&id=${next.id}`;
        }
    };

    const prevBtn = document.getElementById("prevDocBtn");
    const nextBtn = document.getElementById("nextDocBtn");
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === data.length - 1;
})
.catch(err => console.error("Error cargando SOP_INDEX.json:", err));
</script>

</body>
</html>
