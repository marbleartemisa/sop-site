<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>

<style>


body {
    max-width: 900px !important;
    margin: 0 auto !important;
    padding: 40px 0 !important;
    background: #eef2f7;
    font-family: "Segoe UI", Arial, sans-serif !important;
     transform-origin: top center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

  
    
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

.brand {
    font-weight: 600;
    letter-spacing: .4px;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.doc-header .tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.doc-header .tool:hover {
    background: #2563eb;
    color: white;
}

.doc-area {
    display: flex;
    justify-content: center;
    padding: 10px 20px 40px;
}

.doc-frame {
    width: 100%;
    max-width: 1100px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    overflow: hidden;
    position: relative;
}

iframe {
    width: 100%;
    height: 95vh; /* <- altura casi completa de la pantalla */
    border: none;
}

#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: background 0.3s;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
const frame = document.getElementById("frame");
frame.onload = function () {
    try {
        const docFrame = frame.contentDocument || frame.contentWindow.document;

        const style = docFrame.createElement("style");
       

style.innerHTML = `
    * {
        font-family: inherit !important;
    }

    body {
        max-width: 900px !important;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif !important;

        line-height: 1.6 !important;
        font-size: 16px !important;
        letter-spacing: 0.2px !important;
        color: #1f2937 !important;

        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: optimizeLegibility !important;
    }

    h1, h2, h3, h4 {
        font-weight: 600 !important;
        letter-spacing: 0.2px !important;
        color: #0f172a !important;
    }

    p {
        margin: 10px 0 !important;
        line-height: 1.65 !important;
    }

    ul, ol {
        padding-left: 20px !important;
    }

    li {
        margin-bottom: 6px !important;
    }

    strong {
        font-weight: 600 !important;
    }
    a {
    color: #1d4ed8 !important;
    text-decoration: none !important;
    font-weight: 500;
    }
    
    a:hover {
        text-decoration: underline !important;
    }
    
    a[href^="#"] {
        color: #0f172a !important;
        font-weight: 600;
    }
    /* =========================
   FIX HEADER PRIMERA PAGINA
   ========================= */

   

/* Empuja el encabezado superior (línea + texto) */

body > *:first-child {
    text-align: center !important;
    font-size: 12px !important;
    color: #334155 !important;
}

/* Mejora título principal */
h1 {
    text-align: center !important;
    margin-top: 40px !important;
    margin-bottom: 40px !important;
}

/* Control de línea horizontal del encabezado */
hr {
    margin-top: 60px !important;
    margin-bottom: 30px !important;
}

`;        
        docFrame.head.appendChild(style);
    } catch (e) {
        console.log("No se pudo modificar el iframe:", e);
    }
};
if(doc) frame.src = doc;


    
function openNew() {
    if(doc) window.open(doc, "_blank");
}

function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function printDoc() {
    if(frame.contentWindow) frame.contentWindow.print();
}

// ======================
// NAVIGACION SOP
// ======================
fetch('SOP_INDEX.json')
  .then(res => res.json())
  .then(data => {
    if (!data.length) return;

    if (!doc) doc = data[0].url;

    const sopList = data.map(s => s.url);
    let currentIndex = sopList.indexOf(doc);
    if (currentIndex === -1) currentIndex = 0;

    const currentSOP = data[currentIndex];
    document.getElementById("title").innerText = currentSOP.title.toUpperCase();

    window.prevSOP = function() {
      if(currentIndex > 0) {
        const prev = data[currentIndex-1];
        window.location.href = `viewer.html?doc=${prev.url}&id=${prev.id}`;
      }
    };

    window.nextSOP = function() {
      if(currentIndex < data.length-1) {
        const next = data[currentIndex+1];
        window.location.href = `viewer.html?doc=${next.url}&id=${next.id}`;
      }
    };

    // deshabilitar botones si estamos en límites
    document.getElementById("prevDoc").classList.toggle("disabled", currentIndex === 0);
    document.getElementById("nextDoc").classList.toggle("disabled", currentIndex === data.length-1);
  })
  .catch(err => console.error("Error cargando SOP_INDEX.json:", err));
</script>

</body>
</html>
