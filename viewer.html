<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer SOP con Comentarios Mejorado</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  h2 { text-align:center; margin: 20px 0; }

  #sop-container { 
    position: relative; 
    width: 80%; 
    margin: 20px auto; 
    border: 1px solid #ccc; 
    background:#fff; 
    min-height:600px;
  }

  iframe { width: 100%; height: 600px; border: none; display:block; }

  /* Layer para detectar clics */
  #click-layer {
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    cursor: crosshair;
    z-index: 10;
  }

  .comentario {
    position: absolute;
    background: rgba(255,0,0,0.8);
    color:#fff;
    border-radius: 4px;
    padding: 2px 6px;
    font-size:12px;
    pointer-events:none;
    z-index: 20;
  }

  #modal {
    display:none; 
    position: fixed; 
    top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.6); 
    justify-content:center; 
    align-items:center; 
    z-index: 100;
  }
  #modal-content {
    background:#fff; 
    padding:20px; 
    border-radius:5px; 
    width:300px; 
  }
  #comentario-text { width:100%; height:80px; margin-top:5px; }
  #btn-save, #btn-cancel { margin-top:10px; margin-right:5px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>

<h2>Viewer SOP con Comentarios Mejorado</h2>

<div id="sop-container">
  <iframe id="sop-frame" src="https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html"></iframe>
  <div id="click-layer"></div>
</div>

<!-- Modal para escribir comentario -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

const ID_SOP = "SOP-1774461381359-0";
const USUARIO = "TuNombre";
const CORREO = "tucorreo@empresa.com";

let comentarios = [];
let clickX = 0, clickY = 0;

// Detectar clic en el layer transparente
document.getElementById('click-layer').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;
  document.getElementById('modal').style.display = 'flex';
});

// Guardar comentario
document.getElementById('btn-save').addEventListener('click', async () => {
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo antes de guardar");

  comentarios.push({x:clickX, y:clickY, comentario:texto});
  dibujarComentarios();

  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";

  // Guardar en Sheet
  try {
    await fetch(SHEET_API, {
      method:"POST",
      body: JSON.stringify({
        tipo: "comentario",
        id_sop: ID_SOP,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: clickX,
        y: clickY,
        page: 1,
        url_doc: document.getElementById('sop-frame').src
      })
    });
    console.log("Comentario guardado en Sheet");
  } catch(err) {
    console.error("Error guardando comentario:", err);
  }
});

// Cancelar comentario
document.getElementById('btn-cancel').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('comentario-text').value = "";
});

// Dibujar comentarios sobre el layer
function dibujarComentarios() {
  const layer = document.getElementById('sop-container');
  layer.querySelectorAll('.comentario').forEach(el => el.remove());
  comentarios.forEach(c => {
    const div = document.createElement('div');
    div.className = "comentario";
    div.style.left = c.x + "px";
    div.style.top = c.y + "px";
    div.textContent = c.comentario;
    layer.appendChild(div);
  });
}

// Cargar comentarios existentes
async function cargarComentariosExistentes() {
  try {
    const res = await fetch(`${SHEET_API}?comments=${ID_SOP}`);
    const data = await res.json();
    comentarios = data.map(c=>({x:c.x, y:c.y, comentario:c.comentario}));
    dibujarComentarios();
  } catch(err) {
    console.error("Error cargando comentarios:", err);
  }
}

// Inicializar
cargarComentariosExistentes();
</script>

</body>
</html>
