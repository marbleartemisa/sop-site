<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>

<style>
/* =========================
   LAYOUT PRINCIPAL (NO TOCAR)
   ========================= */
body {
    margin: 0;
    background: #eef2f7;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

.brand {
    font-weight: 600;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.doc-area {
    display: flex;
    justify-content: center;
    padding: 10px 20px 40px;
}

.doc-frame {
    width: 100%;
    max-width: 1100px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    overflow: hidden;
    position: relative;
}

iframe {
    width: 100%;
    height: 95vh;
    border: none;
}

button.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}

#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }

</style>
</head>

<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let doc = params.get("doc");

const frame = document.getElementById("frame");

frame.onload = function () {
    try {
        const docFrame = frame.contentDocument || frame.contentWindow.document;

        const style = docFrame.createElement("style");

        style.innerHTML = `
/* =========================
   ESTILO DEL DOCUMENTO (IFRAME)
   ========================= */

body {
    max-width: 900px !important;
    margin: 80px auto 60px auto !important;
    padding-top: 20px !important;
    font-family: "Segoe UI", Arial, sans-serif !important;
    line-height: 1.6 !important;
    font-size: 16px !important;
    color: #1f2937 !important;
}

/* Tipografía */
h1, h2, h3 {
    text-align: center !important;
    margin: 30px 0 !important;
}

/* Texto */
p {
    margin: 10px 0 !important;
}

ul {
    padding-left: 20px !important;
}

/* =========================
   FIX HEADER (SUAVE Y SEGURO)
   ========================= */

/* Solo afecta primeros bloques */
body > *:nth-child(1),
body > *:nth-child(2),
body > *:nth-child(3) {
    text-align: center !important;
    margin-bottom: 10px !important;
}

/* Línea */
hr {
    margin: 20px 0 !important;
    border: none !important;
    border-top: 1px solid #cbd5e1 !important;
}

/* Separación limpia */
hr + * {
    margin-top: 15px !important;
}
`;

        docFrame.head.appendChild(style);

    } catch (e) {
        console.log("Error iframe:", e);
    }
};

if (doc) frame.src = doc;

/* FUNCIONES */
function openNew() {
    if(doc) window.open(doc, "_blank");
}

function downloadDoc() {
    if (!doc) return;
    const a = document.createElement("a");
    a.href = doc;
    a.target = "_blank";
    a.click();
}

function printDoc() {
    frame.contentWindow.print();
}

/* NAV */
fetch('SOP_INDEX.json')
.then(res => res.json())
.then(data => {
    let index = data.findIndex(x => x.url === doc);
    if(index < 0) index = 0;

    document.getElementById("title").innerText = data[index].title;

    window.prevSOP = () => {
        if(index > 0){
            const prev = data[index-1];
            location.href = \`viewer.html?doc=\${prev.url}\`;
        }
    }

    window.nextSOP = () => {
        if(index < data.length-1){
            const next = data[index+1];
            location.href = \`viewer.html?doc=\${next.url}\`;
        }
    }
});
</script>

</body>
</html>
