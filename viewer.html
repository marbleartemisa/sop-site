<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<style>
body {
    margin: 0;
    background: #eef2f7;
    font-family: "Segoe UI", Arial, sans-serif;
}
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}
.brand { font-weight: 600; letter-spacing: .4px; font-size: 15px; }
.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}
.doc-header, .doc-nav {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.doc-nav div {
    background: white;
    border: 1px solid #e5e7eb;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.doc-nav div:hover { background: #f3f4f6; }
.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}
.tool:hover { background: #2563eb; color: white; }
.tool.disabled { opacity: .5; pointer-events: none; }
.doc-area { display: flex; justify-content: center; padding: 10px 20px 40px; }
.doc-frame {
    width: 100%;
    max-width: 1100px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    overflow: hidden;
    position: relative;
}
iframe { width: 100%; height: 80vh; border: none; }
#commentSidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    height: 100%;
    background: white;
    box-shadow: -10px 0 30px rgba(0,0,0,.2);
    padding: 20px;
    transform: translateX(100%);
    transition: .35s ease;
    z-index: 200;
    overflow-y: auto;
}
#commentSidebar.active { transform: translateX(0); }
#toggleSidebarBtn {
    position: fixed;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    z-index: 300;
}
select, input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    margin-bottom: 12px;
    font-size: 14px;
}
select:focus, input:focus, textarea:focus { border-color: #2563eb; outline: none; background: white; }
.comment-box {
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #f1f5f9;
    border-left: 4px solid #2563eb;
}
.comments-loader { display: none; text-align: center; padding: 18px; color: #6b7280; font-size: 13px; }
.spinner {
    width: 22px;
    height: 22px;
    border: 3px solid #e5e7eb;
    border-top: 3px solid #2563eb;
    border-radius: 50%;
    margin: 0 auto 8px;
    animation: spin 1s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#loginOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}
.login-card {
    background: white;
    padding: 35px;
    border-radius: 16px;
    width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
}
#loginMessage { color: red; font-size: 13px; margin-bottom: 10px; }
#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: background 0.3s;
}
#prevDocBtn:hover, #nextDocBtn:hover { background: rgba(0,0,0,0.7); }
#prevDocBtn { left: 0; } #nextDocBtn { right: 0; }
</style>
</head>
<body>

<iframe id="frameViewer" style="width:0;height:0;border:none;"></iframe>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" onclick="showLogin()">🔒 Editar</button>
    <button class="tool" onclick="commentSelectedText()">💬 Comentar</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="overlay"></div>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

<div id="commentSidebar">
  <div id="commentsLoader" class="comments-loader">
    <div class="spinner"></div>
    Cargando comentarios...
  </div>
  <div id="commentList"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;">💬 Comentarios</h3>
    <span style="cursor:pointer; font-size:18px;" onclick="closeSidebar()">✖</span>
  </div>
  <label>Empleado</label>
  <select id="commentUser">
    <option value="">Seleccione</option>
    <option>Damian Molina</option>
    <option>Alberto Molina</option>
    <option>Gabriel Batista</option>
    <option>Jenny Perez</option>
    <option>Yoandry Perez</option>
    <option>Wendy Romanach</option>
    <option>Otros</option>
  </select>
  <label>Tipo</label>
  <select id="commentType">
    <option value="Error">Error</option>
    <option value="Mejora">Mejora</option>
    <option value="Sugerencia">Sugerencia</option>
  </select>
  <label>Estado</label>
  <select id="commentStatus">
    <option value="Pendiente">Pendiente</option>
    <option value="Revisado">Revisado</option>
    <option value="Aprobado">Aprobado</option>
  </select>
  <hr>
</div>

<div id="loginOverlay">
  <div class="login-card">
    <h3>🔒 Acceso de edición</h3>
    <div id="loginMessage"></div>
    <select id="loginUser">
      <option value="">Seleccionar usuario</option>
      <option>Damian Molina</option>
      <option>Alberto Molina</option>
      <option>Gabriel Batista</option>
      <option>Jenny Perez</option>
      <option>Yoandry Perez</option>
      <option>Wendy Romanach</option>
      <option>Otros</option>
    </select>
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button onclick="checkLogin()">Ingresar</button>
    <button onclick="closeLogin()" style="background:#e5e7eb;color:#111;">Cancelar</button>
  </div>
</div>

<div id="commentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:600; align-items:center; justify-content:center;">
  <div style="background:white; width:500px; padding:25px; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.4);">
    <h3 style="margin-top:0;">💬 Nuevo comentario</h3>
    <textarea id="commentInput" placeholder="Escribe tu comentario..." style="width:100%; height:120px; border-radius:10px; border:1px solid #cbd5e1; padding:10px; resize:none;"></textarea>
    <div style="margin-top:15px; text-align:right;">
      <button onclick="closeCommentModal()" style="margin-right:10px;">Cancelar</button>
        <button onclick="submitComment()" style="background:#2563eb;color:white;border:none;padding:8px 14px;border-radius:8px;">Guardar</button>
    </div>
  </div>
</div>

<script>
// ======================
// CONFIGURACIÓN INICIAL
// ======================
let editMode = false;
let currentUser = "";
let selectedTextGlobal = "";
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
const frame = document.getElementById("frame");
setEditModeUI(false);
if(doc) frame.src = doc;
const users = {"Damian Molina":"Dam1975","Alberto Molina":"Alb1975","Gabriel Batista":"Gab1975","Jenny Perez":"Jen1975","Yoandry Perez":"Yoa1975","Wendy Romanach":"Wen1975","Otros":"Otr1975"};

// ======================
// FUNCIONES VISOR / DOCUMENTOS
// ======================
function openNew() { if(doc) window.open(doc, "_blank"); }
function downloadDoc(url) {
    if(!url) url=doc; if(!url) return alert("No hay documento");
    const type=getDocumentType(url); let pdfUrl=url;
    switch(type){
        case "gdoc": { const idDoc=url.match(/\/d\/(.*?)\//); if(idDoc) pdfUrl=`https://docs.google.com/document/d/${idDoc[1]}/export?format=pdf`; break; }
        case "gsheet": { const idSheet=url.match(/\/d\/(.*?)\//); if(idSheet) pdfUrl=`https://docs.google.com/spreadsheets/d/${idSheet[1]}/export?format=pdf`; break; }
        case "gslides": { const idSlide=url.match(/\/d\/(.*?)\//); if(idSlide) pdfUrl=`https://docs.google.com/presentation/d/${idSlide[1]}/export/pdf`; break; }
        case "gdrive": { const idDrive=url.match(/[-\w]{25,}/); if(idDrive) pdfUrl=`https://drive.google.com/uc?export=download&id=${idDrive[0]}`; break; }
        case "github": openIframePrint(url); return;
        default: alert("No se puede descargar este tipo de archivo"); return;
    }
    const link=document.createElement("a"); link.href=pdfUrl; link.target="_blank"; document.body.appendChild(link); link.click(); link.remove();
}
function printDoc(){ frame.contentWindow.print(); }
function getDocumentType(url){
    if(!url) return null;
    if(url.includes("docs.google.com/document")) return "gdoc";
    if(url.includes("docs.google.com/spreadsheets")) return "gsheet";
    if(url.includes("docs.google.com/presentation")) return "gslides";
    if(url.includes("drive.google.com")) return "gdrive";
    if(url.includes("github.io")) return "github";
    return "other";
}
function openIframePrint(url){ const f=document.getElementById("frameViewer"); if(f){ f.src=url; f.onload=()=>{ f.contentWindow.focus(); f.contentWindow.print(); }; } else alert("No se encontró el visor (iframe)."); }

// ======================
// LOGIN / EDICIÓN
// ======================
function showLogin(){ document.getElementById("loginOverlay").style.display="flex"; document.getElementById("loginMessage").innerText=""; }
function closeLogin(){ document.getElementById("loginOverlay").style.display="none"; }
function checkLogin(){
    const user=document.getElementById("loginUser").value;
    const pass=document.getElementById("loginPass").value;
    const msg=document.getElementById("loginMessage");
    if(!user){ msg.innerText="Seleccione un usuario"; return; }
    if(users[user]!==pass){ msg.innerText="Clave incorrecta"; return; }
    editMode=true; currentUser=user; setEditModeUI(true);
    document.getElementById("commentUser").value=user;
    document.getElementById("commentSidebar").classList.add("active");
    loadComments();
    closeLogin();
}
function setEditModeUI(enabled){
    document.getElementById("commentUser").disabled=!enabled;
    document.getElementById("commentType").disabled=!enabled;
    document.getElementById("commentStatus").disabled=!enabled;
    const btn=document.querySelector(".tool[onclick='commentSelectedText()']");
    if(enabled) btn.classList.remove("disabled"); else btn.classList.add("disabled");
}

// ======================
// COMENTARIOS
// ======================
function closeSidebar(){ document.getElementById("commentSidebar").classList.remove("active"); }
function commentSelectedText(){
    if(!editMode){ alert("Activa modo edición"); return; }
    const sel=frame.contentWindow.getSelection();
    if(!sel.toString()){ alert("Selecciona texto"); return; }
    selectedTextGlobal=sel.toString();
    createCorrectionLayer(sel);
}
function createCorrectionLayer(selection){
    const range=selection.getRangeAt(0);
    const rect=range.getBoundingClientRect();
    const iframeRect=frame.getBoundingClientRect();
    const layer=document.createElement("div");
    layer.style.position="fixed";
    layer.style.top=(rect.top+iframeRect.top)+"px";
    layer.style.left=(rect.left+iframeRect.left)+"px";
    layer.style.zIndex=9999;
    layer.innerHTML=`<div style="background:white;border:2px dashed red;padding:8px;border-radius:8px;box-shadow:0 5px 15px rgba(0,0,0,.3);width:260px;">
        <div style="font-size:12px;color:#dc2626;font-weight:600;margin-bottom:4px;">Corrección propuesta</div>
        <textarea style="width:100%;height:70px;border:none;outline:none;color:#dc2626;font-style:italic;resize:none;" placeholder="Escribe la corrección..."></textarea>
        <div style="text-align:right;margin-top:5px;"><button onclick="saveCorrection(this)">Guardar</button></div>
    </div>`;
    document.body.appendChild(layer);
}
function saveCorrection(btn){
    const layer=btn.closest("div").parentElement;
    const text=layer.querySelector("textarea").value;
    if(!text){ alert("Comentario vacío"); return; }
    layer.style.border="2px solid #dc2626";
    layer.querySelector("textarea").disabled=true;
}
async function loadComments(){
    const loader=document.getElementById("commentsLoader");
    loader.style.display="block";
    try{
        const res=await fetch(`${SCRIPT_URL}?comments=${idSOP}`);
        const data=await res.json();
        window.loadedComments=(data||[]).map(c=>({...c,id_comment:c.id_comment||c.ID}));
        renderComments(window.loadedComments);
    }catch(err){ console.error("Error cargando comentarios",err); renderComments([]);}
    loader.style.display="none";
}
function renderComments(comments){
    const list=document.getElementById("commentList");
    list.innerHTML="";
    if(!comments||comments.length===0){
        list.innerHTML=`<div class="no-comments">Sin comentarios</div>`;
        return;
    }
    comments.forEach(c=>{
        const div=document.createElement("div");
        div.className="comment-box";
        div.innerHTML=`
            <div><strong>${c.empleado || "Anónimo"}</strong> • <em>${c.tipo || "General"}</em></div>
            <div>${c.comentario || ""}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px;">Estado: ${c.estado || "Pendiente"}</div>
        `;
        list.appendChild(div);
    });
}

// ======================
// COMENTARIO MODAL
// ======================
function closeCommentModal(){ document.getElementById("commentModal").style.display="none"; }


function submitComment() {
    const commentText = document.getElementById("commentInput").value.trim();
    if (!commentText) {
        alert("Escribe un comentario");
        return;
    }

    if (!editMode) {
        alert("Activa el modo edición primero");
        return;
    }

    const user = document.getElementById("commentUser").value || currentUser || "Anónimo";
    const tipo = document.getElementById("commentType").value || "General";
    const estado = document.getElementById("commentStatus").value || "Pendiente";

    // Tomar texto seleccionado del iframe
    const frame = document.getElementById("frame");
    if (!frame || !frame.contentWindow) {
        alert("No se encontró el documento para seleccionar texto");
        return;
    }

    const sel = frame.contentWindow.getSelection();
    const selectedText = sel ? sel.toString() : "";

    // Crear comentario
    const newComment = {
        id_comment: Date.now().toString(),
        usuario: user,
        tipo: tipo,
        estado: estado,
        comentario: commentText,
        text_selected: selectedText,
        fecha: new Date().toLocaleString()
    };

    // Guardar en arreglo global
    if (!window.loadedComments) window.loadedComments = [];
    window.loadedComments.push(newComment);

    // Guardar en localStorage
    const existing = JSON.parse(localStorage.getItem(doc) || "[]");
    existing.push(newComment);
    localStorage.setItem(doc, JSON.stringify(existing));

    // Resaltar selección en iframe si hay texto
    if (selectedText) {
        highlightSelection(sel, newComment);
    }

    // Actualizar lista en sidebar
    renderComments(window.loadedComments);

    // Limpiar y cerrar modal
    document.getElementById("commentInput").value = "";
    closeCommentModal();

    alert("✅ Comentario guardado");
}
    
// ======================
// NAV SOP
// ======================
function prevSOP(){ alert("Navegar al SOP anterior"); }
function nextSOP(){ alert("Navegar al SOP siguiente"); }

// ======================
// SIDEBAR
// ======================
document.getElementById("toggleSidebarBtn")?.addEventListener("click",()=>{
    document.getElementById("commentSidebar").classList.toggle("active");
});
</script>

<button id="toggleSidebarBtn">💬</button>

</body>
</html>
