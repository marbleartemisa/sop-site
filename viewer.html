<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<style>
body{
  margin:0;
  background:#eef2f7;
  font-family:"Segoe UI",Arial,sans-serif;
}

/* TOPBAR */
.topbar{
  background:#0f172a;
  color:white;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:fixed;
  width:100%;
  top:0;
  z-index:100;
}

/* BOTONES */
.tool{
  background:white;
  border:1px solid #e2e8f0;
  padding:7px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}
.tool:hover{
  background:#2563eb;
  color:white;
}

/* DOCUMENTO */
.doc-frame{
  width:100%;
  max-width:1100px;
  background:white;
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
}

/* SIDEBAR MODERNO */
#commentSidebar{
  position:fixed;
  top:0;
  right:0;
  width:380px;
  height:100%;
  background:#ffffff;
  box-shadow:-10px 0 30px rgba(0,0,0,.2);
  padding:20px;
  transform:translateX(100%);
  transition:.35s ease;
  z-index:200;
  overflow-y:auto;
}

#commentSidebar.active{
  transform:translateX(0);
}

/* BOTÓN FLOTANTE 💬 */
#toggleSidebarBtn{
  position:fixed;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  background:#2563eb;
  color:white;
  border:none;
  border-radius:50%;
  width:50px;
  height:50px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  z-index:300;
}

/* FORMULARIOS BONITOS */
select, input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  background:#f8fafc;
  margin-bottom:12px;
  font-size:14px;
  transition:.2s;
}
select:focus, input:focus{
  border-color:#2563eb;
  outline:none;
  background:white;
}

/* CAJA COMENTARIOS */
.comment-box{
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  background:#f1f5f9;
  border-left:4px solid #2563eb;
}

/* LOGIN MODERNO */
#loginOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
}

#loginOverlay .login-card{
  background:white;
  padding:35px;
  border-radius:16px;
  width:360px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  text-align:center;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.login-card h3{
  margin-bottom:15px;
}

.login-card button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:600;
  cursor:pointer;
  margin-top:5px;
}
.login-card button:hover{
  background:#1d4ed8;
}
  .doc-header{
  max-width:1100px;
  margin:80px auto 20px auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.doc-area{
  display:flex;
  justify-content:center;
}

  .back{
  background:#2563eb;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

#loginMessage{
  color:red;
  font-size:13px;
  margin-bottom:10px;
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<!-- HERRAMIENTAS -->
<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" onclick="showLogin()">🔒 Editar</button>
    <button class="tool" onclick="commentSelectedText()">💬 Comentar</button>
  </div>
</div>

<!-- DOCUMENTO -->
<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<!-- SIDEBAR -->
<div id="commentSidebar">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
  <h3 style="margin:0;">💬 Comentarios</h3>
  <span style="cursor:pointer;font-size:18px;" onclick="closeSidebar()">✖</span>
</div>
  <label>Empleado</label>
  <select id="commentUser">
    <option value="">Seleccione</option>
    <option>Damian Molina</option>
    <option>Alberto Molina</option>
    <option>Gabriel Batista</option>
    <option>Jenny Perez</option>
    <option>Yoandry Perez</option>
    <option>Wendy Romanach</option>
    <option>Otros</option>
  </select>

  <label>Tipo</label>
  <select id="commentType">
    <option value="Error">Error</option>
    <option value="Mejora">Mejora</option>
    <option value="Sugerencia">Sugerencia</option>
  </select>

  <label>Estado</label>
  <select id="commentStatus">
    <option value="Pendiente">Pendiente</option>
    <option value="Revisado">Revisado</option>
    <option value="Aprobado">Aprobado</option>
  </select>

  <hr>
  <div id="commentList"></div>
</div>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-card">
    <h3>🔒 Acceso de edición</h3>

    <div id="loginMessage"></div>

    <select id="loginUser">
      <option value="">Seleccionar usuario</option>
      <option>Damian Molina</option>
      <option>Alberto Molina</option>
      <option>Gabriel Batista</option>
      <option>Jenny Perez</option>
      <option>Yoandry Perez</option>
      <option>Wendy Romanach</option>
      <option>Otros</option>
    </select>

    <input type="password" id="loginPass" placeholder="Contraseña">

    <button onclick="checkLogin()">Ingresar</button>
    <button onclick="closeLogin()" style="background:#e5e7eb;color:#111;">Cancelar</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";

const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id"); // id_sop 🔥

const frame = document.getElementById("frame");
let editMode=false;
let currentUser="";

if(doc) frame.src = doc;

// usuarios
const users = {
  "Damian Molina":"Dam1975",
  "Alberto Molina":"Alb1975",
  "Gabriel Batista":"Gab1975",
  "Jenny Perez":"Jen1975",
  "Yoandry Perez":"Yoa1975",
  "Wendy Romanach":"Wen1975",
  "Otros":"Otr1975"
};

// botones
function openNew(){window.open(doc,"_blank");}
function downloadDoc(){const a=document.createElement("a"); a.href=doc;a.download=""; a.click();}
function printDoc(){frame.contentWindow.print();}

// login
function showLogin(){ 
  document.getElementById("loginOverlay").style.display="flex"; 
  document.getElementById("loginMessage").innerText="";
}
function closeLogin(){ document.getElementById("loginOverlay").style.display="none"; }

function checkLogin(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const msg = document.getElementById("loginMessage");

  if(!user){msg.innerText="Seleccione un usuario"; return;}
  if(users[user]!==pass){msg.innerText="Clave incorrecta"; return;}

  editMode=true;
  currentUser=user;
  document.getElementById("commentUser").value=user;
  document.getElementById("commentSidebar").classList.add("active");


  loadComments(); // cargar desde sheet
  closeLogin();
}

// sidebar
function closeSidebar(){
  document.getElementById("commentSidebar").classList.remove("active");
  
}

// guardar comentario
async function commentSelectedText(){
  if(!editMode){ alert("Activa modo edición primero"); return; }

  const sel = frame.contentWindow.getSelection();
  const text = sel.toString().trim();
  if(!text){ alert("Selecciona un texto válido"); return; }

  const commentText = prompt("Escribe tu comentario:");
  if(!commentText || commentText.trim()===""){ alert("Comentario vacío"); return; }

  const type = document.getElementById("commentType").value;
  const status = document.getElementById("commentStatus").value;
  const now = new Date().toLocaleString();

  const payload = {
    tipo:"comentario",
    id_sop: idSOP,
    usuario: currentUser,
    comentario: commentText,
    tipo_comentario: type,
    estado: status,
    text_selected: text,
    context_before: text.substring(0,20),
    context_after: text.substring(text.length-20),
    url_doc: doc
  };

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if(data.success){
      saveLocalComment({...payload, date: now});
      highlightSelection(sel, payload);
      loadComments();
      alert("✅ Comentario guardado");
    }else{
      alert("❌ Error: " + data.error);
    }
  }catch(err){
    alert("❌ Error conexión");
  }
}

// backup local
function saveLocalComment(c){
  const list=JSON.parse(localStorage.getItem(doc)||"[]");
  list.push(c);
  localStorage.setItem(doc,JSON.stringify(list));
}

// cargar comentarios desde sheet
async function loadComments(){
  if(!idSOP) return;

  try{
    const res = await fetch(`${SCRIPT_URL}?comments=${idSOP}`);
    const data = await res.json();
    renderComments(data);
  }catch(err){
    console.error("Error cargando comentarios:", err);
  }
}

// render
function renderComments(comments){
  const list=document.getElementById("commentList");
  list.innerHTML="";
  comments.forEach(c=>{
    const div=document.createElement("div");
    div.className="comment-box";
    div.innerHTML=`
      <b>${c.usuario}</b> - <i>${c.comentario}</i><br>
      <mark>${c.texto}</mark><br>
      <small>📅 ${c.fecha} | 🏷 ${c.tipo} | ${c.estado}</small>
    `;
    list.appendChild(div);
  });
}

// resaltado
function highlightSelection(sel, comment){
  if(sel.rangeCount){
    const range = sel.getRangeAt(0);
    const mark = document.createElement("mark");
    mark.style.background="#fff176";
    mark.title = comment.comentario;
    range.surroundContents(mark);
    sel.removeAllRanges();
  }
}


function toggleSidebar(){
  const sb = document.getElementById("commentSidebar");
  const btn = document.getElementById("toggleSidebarBtn");

  sb.classList.toggle("active");

  if(sb.classList.contains("active")){
    btn.style.right = "395px";
  }else{
    btn.style.right = "15px";
  }
}
  
</script>
  <button id="toggleSidebarBtn" onclick="toggleSidebar()">💬</button>
</body>
</html>
