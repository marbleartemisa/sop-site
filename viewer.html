<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer SOP con Comentarios</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
  h2 { text-align:center; margin: 20px 0; }

  #sop-selector { width: 80%; margin: 10px auto; display:flex; gap:10px; }

  #sop-container { 
    position: relative; 
    width: 80%; 
    margin: 20px auto; 
    border: 1px solid #ccc; 
    background:#fff; 
    min-height:600px;
    overflow:auto;
  }

  #canvas-wrapper {
    position: relative;
  }

  canvas {
    display: block;
    width: 100%;
  }

  .comentario {
    position: absolute;
    background: rgba(255,0,0,0.7);
    color:#fff;
    border-radius:4px;
    padding:4px 6px;
    font-size:12px;
    pointer-events:none;
    max-width:200px;
    word-wrap:break-word;
  }

  /* Modal */
  #modal {
    display:none; 
    position: fixed; 
    top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.6); 
    justify-content:center; 
    align-items:center; 
    z-index: 9999;
  }

  #modal-content {
    background:#fff; 
    padding:20px; 
    border-radius:10px; 
    width:350px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    font-family: "Segoe UI", sans-serif;
  }

  #comentario-text {
    width:100%; 
    height:100px; 
    margin-top:10px; 
    padding:8px;
    border:1px solid #ccc; 
    border-radius:6px;
    font-size:14px;
    font-family: inherit;
    resize: vertical;
  }

  #btn-save, #btn-cancel {
    margin-top:12px; 
    margin-right:5px; 
    padding:8px 16px; 
    cursor:pointer; 
    border:none;
    border-radius:6px;
    font-size:14px;
  }

  #btn-save { background:#28a745; color:#fff; }
  #btn-cancel { background:#dc3545; color:#fff; }
  #btn-save:hover { background:#218838; }
  #btn-cancel:hover { background:#c82333; }

  #commentList {
    width: 80%; margin: 10px auto; background:#fff; padding:10px; border:1px solid #ccc; max-height:150px; overflow:auto;
  }
  #commentList div { border-bottom:1px solid #e5e7eb; padding:6px 0; }
</style>
</head>
<body>

<h2>Viewer SOP con Comentarios</h2>

<div id="sop-selector">
  <select id="sop-list"></select>
  <button onclick="cargarSOPActual()">Cargar SOP</button>
</div>

<div id="sop-container">
  <div id="canvas-wrapper"></div>
</div>

<div id="commentList"></div>

<!-- Modal -->
<div id="modal">
  <div id="modal-content">
    <h3>Escribe tu comentario</h3>
    <textarea id="comentario-text"></textarea>
    <div style="text-align:right;">
      <button id="btn-save">Guardar</button>
      <button id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const SHEET_API = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
const USUARIO = "TuNombre";
const CORREO = "tucorreo@empresa.com";

// Lista de SOPs
const SOPS = [
  {id:"SOP-1", url:"https://marbleartemisa.github.io/sop-site/administracion/SOP-COMPRA-SLABS/index.html", nombre:"SOP Compra Slabs"},
  {id:"SOP-2", url:"https://marbleartemisa.github.io/sop-site/administracion/SOP-VENTA-MARBLE/index.html", nombre:"SOP Venta Marble"}
];

let comentarios = [];
let currentSOP = SOPS[0];
let clickX=0, clickY=0;

// Llenar dropdown de SOPs
const select = document.getElementById('sop-list');
SOPS.forEach(s=> {
  const option = document.createElement('option');
  option.value = s.id;
  option.textContent = s.nombre;
  select.appendChild(option);
});
select.value = currentSOP.id;

// Cargar SOP actual
async function cargarSOPActual(){
  const sopSel = SOPS.find(s=>s.id===select.value);
  if(!sopSel) return;
  currentSOP = sopSel;
  await cargarSOP();
}

// Cargar SOP en canvas
async function cargarSOP(){
  try{
    comentarios = [];
    const response = await fetch(currentSOP.url);
    const html = await response.text();

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    tempDiv.style.width="800px";
    tempDiv.style.padding="20px";
    tempDiv.style.background="#fff";

    const wrapper = document.getElementById('canvas-wrapper');
    wrapper.innerHTML="";
    wrapper.appendChild(tempDiv);

    await new Promise(r=>setTimeout(r,500));

    const canvas = await html2canvas(tempDiv, {useCORS:true, scale:1});
    canvas.id = "sop-canvas";

    wrapper.innerHTML="";
    wrapper.appendChild(canvas);

    canvas.addEventListener('click', activarComentario);

    cargarComentariosExistentes();

  } catch(err){
    console.error(err);
    document.getElementById('canvas-wrapper').innerHTML = "<p style='color:red;'>No se pudo cargar el SOP.</p>";
  }
}

// Click sobre canvas
function activarComentario(e){
  const rect = e.target.getBoundingClientRect();
  clickX = e.clientX - rect.left;
  clickY = e.clientY - rect.top;

  const modal = document.getElementById('modal');
  modal.style.display='flex';
  document.getElementById('comentario-text').focus();
}

// Guardar comentario
document.getElementById('btn-save').addEventListener('click', async ()=>{
  const texto = document.getElementById('comentario-text').value.trim();
  if(!texto) return alert("Escribe algo antes de guardar");

  comentarios.push({x:clickX, y:clickY, comentario:texto});
  dibujarComentarios();
  actualizarListaComentarios();

  document.getElementById('modal').style.display='none';
  document.getElementById('comentario-text').value='';

  try{
    await fetch(SHEET_API,{
      method:"POST",
      body: JSON.stringify({
        tipo:"comentario",
        id_sop: currentSOP.id,
        usuario: USUARIO,
        correo: CORREO,
        comentario: texto,
        x: clickX,
        y: clickY,
        page:1,
        url_doc: currentSOP.url
      })
    });
    console.log("Comentario guardado en Sheet");
  }catch(err){
    console.error("Error guardando comentario:", err);
  }
});

// Cancelar comentario
document.getElementById('btn-cancel').addEventListener('click', ()=>{
  document.getElementById('modal').style.display='none';
  document.getElementById('comentario-text').value='';
});

// Dibujar comentarios sobre canvas
function dibujarComentarios(){
  const wrapper = document.getElementById('canvas-wrapper');
  wrapper.querySelectorAll('.comentario').forEach(el=>el.remove());
  comentarios.forEach(c=>{
    const div = document.createElement('div');
    div.className="comentario";
    div.style.left=c.x+"px";
    div.style.top=c.y+"px";
    div.textContent=c.comentario;
    wrapper.appendChild(div);
  });
}

// Lista lateral
function actualizarListaComentarios(){
  const list = document.getElementById('commentList');
  list.innerHTML="";
  comentarios.forEach(c=>{
    const div = document.createElement('div');
    div.innerHTML=`<b>${USUARIO}</b>: ${c.comentario}`;
    list.appendChild(div);
  });
}

// Cargar comentarios existentes
async function cargarComentariosExistentes(){
  try{
    const res = await fetch(`${SHEET_API}?comments=${currentSOP.id}`);
    const data = await res.json();
    comentarios = data.map(c=>({x:c.x, y:c.y, comentario:c.comentario}));
    dibujarComentarios();
    actualizarListaComentarios();
  }catch(err){
    console.error("Error cargando comentarios:", err);
  }
}

// Iniciar con SOP inicial
cargarSOPActual();
</script>

</body>
</html>
