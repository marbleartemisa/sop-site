<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<style>
body{
  margin:0;
  background:#f1f5f9;
  font-family:"Segoe UI",Arial,sans-serif;
}

/* TOPBAR */
.topbar{
  background:#0f172a;
  color:white;
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:fixed;
  width:100%;
  top:0;
  z-index:100;
}
.brand{font-weight:600;font-size:15px;}
.back{
  background:#2563eb;
  color:white;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
}

/* BARRA DE HERRAMIENTAS DEBAJO DEL TOPBAR */
.doc-header{
  max-width:1100px;
  margin:70px auto 20px auto; 
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.tool{
  background:white;
  border:1px solid #d1d5db;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* DOCUMENTO */
.doc-area{
  display:flex;
  justify-content:center;
}
.doc-frame{
  width:100%;
  max-width:1100px;
  background:white;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  position:relative;
}
iframe{
  width:100%;
  height:88vh;
  border:none;
}

/* OVERLAY */
#overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:10;
}

/* SIDEBAR */
#commentSidebar{
  position:fixed;
  top:60px;
  right:0;
  width:350px;
  height:calc(100% - 60px);
  background:white;
  box-shadow:-4px 0 10px rgba(0,0,0,.2);
  padding:15px;
  transform:translateX(100%);
  transition:.3s;
  z-index:50;
  overflow:auto;
}
#commentSidebar.active{transform:translateX(0);}
body.sidebar-open .doc-area,
body.sidebar-open .doc-header{margin-right:350px;}
.comment-box{
  border:1px solid #ddd;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  font-size:13px;
  background:#f9fafb;
}
.closeSidebar{
  cursor:pointer;
  float:right;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" onclick="adminLogin()">🔒 Editar</button>
    <button class="tool" onclick="activateComment()">💬 Comentar</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<div id="commentSidebar">
  <span class="closeSidebar" onclick="closeSidebar()">⬅</span>
  <h3>Comentarios</h3>
  <label>Empleado</label>
  <select id="commentUser">
    <option value="">Seleccione</option>
    <option>Damian Molina</option>
    <option>Alberto Molina</option>
    <option>Gabriel Batista</option>
    <option>Jenny Perez</option>
    <option>Yoandry Perez</option>
    <option>Wendy Romanach</option>
    <option>Otros</option>
  </select>

  <label>Tipo</label>
  <select id="commentType">
    <option value="Error">Error</option>
    <option value="Mejora">Mejora</option>
    <option value="Sugerencia">Sugerencia</option>
  </select>

  <label>Estado</label>
  <select id="commentStatus">
    <option value="Pendiente">Pendiente</option>
    <option value="Revisado">Revisado</option>
    <option value="Aprobado">Aprobado</option>
  </select>

  <hr>
  <div id="commentList"></div>
</div>

<script>
// VARIABLES
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
const frame = document.getElementById("frame");
const overlay = document.getElementById("overlay");
let editMode=false, commentMode=false;
let currentUser="";

// LISTA DE USUARIOS Y CONTRASEÑAS PROVISIONALES
const users = {
  "Damian Molina":"Dam1975",
  "Alberto Molina":"Alb1975",
  "Gabriel Batista":"Gab1975",
  "Jenny Perez":"Jen1975",
  "Yoandry Perez":"Yoa1975",
  "Wendy Romanach":"Wen1975",
  "Otros":"Otr1975"
};

if(doc) frame.src = doc;

// BOTONES
function openNew(){window.open(doc,"_blank");}
function downloadDoc(){const a=document.createElement("a"); a.href=doc;a.download=""; a.click();}
function printDoc(){frame.contentWindow.print();}

// LOGIN CON VALIDACION DE CONTRASEÑA
function adminLogin(){
  const user = prompt("Ingrese su nombre de usuario:");
  if(!user || !users[user]){
    alert("Usuario no válido"); return;
  }
  const pass = prompt("Ingrese contraseña para " + user);
  if(pass!==users[user]){ alert("Contraseña incorrecta"); return; }
  editMode=true;
  currentUser=user;
  document.getElementById("commentUser").value=user;
  document.getElementById("commentSidebar").classList.add("active");
  document.body.classList.add("sidebar-open");
  loadComments();
  alert("Modo edición activado para " + user);
}

// CERRAR SIDEBAR
function closeSidebar(){
  document.getElementById("commentSidebar").classList.remove("active");
  document.body.classList.remove("sidebar-open");
}

// ACTIVAR COMENTARIO
function activateComment(){
  if(!editMode){alert("Activa modo edición primero"); return;}
  commentMode=true;
  overlay.style.pointerEvents="auto";
  overlay.style.background="rgba(0,0,0,0.05)";
  alert("Selecciona texto dentro del documento");
}

// CLICK PARA COMENTAR (TEXTO SELECCIONADO)
overlay.addEventListener("click", function(e){
  if(!commentMode) return;

  const user = currentUser;
  if(!user){alert("Usuario no válido"); return;}

  const type = document.getElementById("commentType").value;
  const status = document.getElementById("commentStatus").value;

  const sel = frame.contentWindow.getSelection();
  const text = sel.toString().trim();
  if(!text){alert("Selecciona un texto válido"); resetOverlay(); return;}

  const now = new Date().toLocaleString();

  // Guardar comentario
  const comment = {text,user,type,status,date:now};
  saveComment(comment);

  // RESALTAR TEXTO
  highlightSelection(sel, comment);

  renderComments();
  resetOverlay();
});

// RESET OVERLAY
function resetOverlay(){
  commentMode=false;
  overlay.style.pointerEvents="none";
  overlay.style.background="transparent";
}

// GUARDAR
function saveComment(c){
  const list=JSON.parse(localStorage.getItem(doc)||"[]");
  list.push(c);
  localStorage.setItem(doc,JSON.stringify(list));
}

// CARGAR Y RENDER
function loadComments(){ renderComments(); }
function renderComments(){
  const list=document.getElementById("commentList");
  list.innerHTML="";
  const comments=JSON.parse(localStorage.getItem(doc)||"[]");
  comments.forEach(c=>{
    const div=document.createElement("div");
    div.className="comment-box";
    div.innerHTML=`<b>${c.user}</b><br>${c.text}<br><small>📅 ${c.date}<br>🏷 ${c.type} | ${c.status}</small>`;
    list.appendChild(div);
  });
}

// FUNCION PARA RESALTAR TEXTO
function highlightSelection(sel, comment){
  if(sel.rangeCount){
    const range=sel.getRangeAt(0);
    const mark=document.createElement("mark");
    mark.style.background="yellow";
    mark.title=`${comment.user} | ${comment.type} | ${comment.status}`;
    range.surroundContents(mark);
    sel.removeAllRanges();
  }
}
</script>
</body>
</html>
