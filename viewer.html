<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>

<style>


body {
    margin: 0;
    background: #eef2f7;

    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}
    
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

#readingProgress{
    position:fixed;

    top:58px;
    left:0;

    height:3px;

    width:0%;

    background:#2563eb;

    z-index:2000;
}

.brand {
    font-weight: 600;
    letter-spacing: .4px;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}


.doc-header {
    position: sticky;
    top: 60px;

    z-index: 900;

    width: calc(100vw - 40px);
    max-width: 1800px;

    margin: 70px auto 15px auto;

    background: rgba(255,255,255,.95);
    backdrop-filter: blur(12px);

    border: 1px solid #e5e7eb;

    border-radius: 14px;

    padding: 12px 18px;

    box-shadow: 0 8px 30px rgba(0,0,0,.08);

    display:flex;
    justify-content:space-between;
    align-items:center;
}


.doc-header .tool{
    background:white;

    border:1px solid #d1d5db;

    height:38px;

    min-width:38px;

    padding:0 14px;

    border-radius:10px;

    cursor:pointer;

    font-size:13px;

    font-weight:500;

    transition:.2s;
}

.doc-header .tool:hover{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
    transform:translateY(-1px);
}

.doc-area{
    display:flex;
    justify-content:center;

    padding:15px 20px 50px;

    min-height:calc(100vh - 130px);
}    
    
.doc-frame {
    width: 100%;
    max-width: 1800px;
    background: white;
    border-radius: 18px;
    box-shadow:
      0 30px 60px rgba(15,23,42,.12),
      0 10px 20px rgba(15,23,42,.08);
    overflow: hidden;
    position: relative;
}


iframe {
    width: 100%;
     height:calc(100vh - 150px);
    border: none;
    background: white;
}


    #prevDocBtn,
    #nextDocBtn{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:58px;
    height:58px;
    border:none;
    border-radius:50%;
    background:rgba(15,23,42,.75);
    backdrop-filter:blur(10px);
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.25s;
    z-index:999;
}

#prevDocBtn:hover,
#nextDocBtn:hover{
    transform:translateY(-50%) scale(1.08);
}

#prevDocBtn{
    left:20px;
}

#nextDocBtn{
    right:20px;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
<div>

    <button class="tool" onclick="zoomOut()">−</button>

    <button class="tool" id="zoomIndicator">
        100%
    </button>

    <button class="tool" onclick="zoomIn()">+</button>

    <button class="tool" onclick="resetZoom()">Reset</button>

    <button class="tool" onclick="openNew()">Abrir</button>

    <button class="tool" onclick="downloadDoc()">Descargar</button>

    <button class="tool" onclick="printDoc()">Imprimir</button>

    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>

    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>

</div>
</div>

<div id="readingProgress"></div>

    
<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

    

<script>
let params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
let zoomLevel = 1;
const ZOOM_STEP = 0.1;
const MAX_ZOOM = 2.5;
const MIN_ZOOM = 0.5;
const frame = document.getElementById("frame");

    
frame.onload = function () {

    try {

        const docFrame =
            frame.contentDocument ||
            frame.contentWindow.document;

        const style = docFrame.createElement("style");

        style.innerHTML = `
            ...
        `;

        docFrame.head.appendChild(style);

        applyZoom();

        // ==================================
        // BARRA DE PROGRESO DE LECTURA
        // ==================================

        frame.contentWindow.addEventListener("scroll", () => {

            const doc = frame.contentWindow.document.documentElement;

            const total =
                doc.scrollHeight - doc.clientHeight;

            const current =
                doc.scrollTop ||
                frame.contentWindow.pageYOffset;

            const percent =
                total > 0
                ? (current / total) * 100
                : 0;

            document.getElementById("readingProgress")
                .style.width = percent + "%";

        });

    } catch (e) {

        console.log(
            "No se pudo modificar el iframe:",
            e
        );

    }

};
if(doc) frame.src = doc;

// ======================
// ZOOM
// ======================

function applyZoom(){

    try{

        const docFrame =
            frame.contentDocument ||
            frame.contentWindow.document;

        docFrame.body.style.zoom = zoomLevel;

        document.getElementById("zoomIndicator")
            .innerText = Math.round(zoomLevel * 100) + "%";

    }catch(e){

        console.log("Zoom error:", e);

    }
}

function zoomIn(){

    zoomLevel += ZOOM_STEP;

    if(zoomLevel > MAX_ZOOM){
        zoomLevel = MAX_ZOOM;
    }

    applyZoom();
}

function zoomOut(){

    zoomLevel -= ZOOM_STEP;

    if(zoomLevel < MIN_ZOOM){
        zoomLevel = MIN_ZOOM;
    }

    applyZoom();
}

function resetZoom(){

    zoomLevel = 1;

    applyZoom();
}
    
function openNew() {
    if(doc) window.open(doc, "_blank");
}

function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function printDoc() {
    if(frame.contentWindow) frame.contentWindow.print();
}

// ======================
// NAVIGACION SOP
// ======================
fetch('SOP_INDEX.json')
  .then(res => res.json())
  .then(data => {
    if (!data.length) return;

    if (!doc) doc = data[0].url;

    const sopList = data.map(s => s.url);
    let currentIndex = sopList.indexOf(doc);
    if (currentIndex === -1) currentIndex = 0;

    const currentSOP = data[currentIndex];
    document.getElementById("title").innerText = currentSOP.title.toUpperCase();

    window.prevSOP = function() {
      if(currentIndex > 0) {
        const prev = data[currentIndex-1];
        window.location.href = `viewer.html?doc=${prev.url}&id=${prev.id}`;
      }
    };

    window.nextSOP = function() {
      if(currentIndex < data.length-1) {
        const next = data[currentIndex+1];
        window.location.href = `viewer.html?doc=${next.url}&id=${next.id}`;
      }
    };

document.addEventListener('wheel', function(e){
    if(!e.ctrlKey) return;
    e.preventDefault();
    if(e.deltaY < 0){
        zoomIn();
    }else{
        zoomOut();
    }
},{ passive:false });

    // deshabilitar botones si estamos en límites
    document.getElementById("prevDoc").classList.toggle("disabled", currentIndex === 0);
    document.getElementById("nextDoc").classList.toggle("disabled", currentIndex === data.length-1);
  })
  .catch(err => console.error("Error cargando SOP_INDEX.json:", err));
</script>

</body>
</html>
