<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>

<style>


body {
    margin: 0;
    background: #eef2f7;

    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}
    
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

.brand {
    font-weight: 600;
    letter-spacing: .4px;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.doc-header {
    max-width: 1800px;
    width: 100%;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

   
.doc-header .tool {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.doc-header .tool:hover {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(37,99,235,.25);
}

.doc-area {
    display: flex;
    justify-content: center;
    padding: 10px 20px 40px;
}

.doc-frame {
    width: 100%;
    max-width: 1800px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    overflow: hidden;
    position: relative;
}

iframe {
    width: 100%;
    height: 92vh;
    border: none;
    background: white;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
}

.divider {
    width: 1px;
    height: 26px;
    background: #e5e7eb;
    margin: 0 6px;
}
    
#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: background 0.3s;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}

/* =========================================================
   MOBILE UX — DOCUMENT VIEWER
   NO AFECTA DESKTOP
========================================================= */

@media (max-width: 768px) {

    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
        padding: 10px 12px;
        height: 52px;
    }

    .brand {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 65%;
    }

    .back {
        flex-shrink: 0;
        white-space: nowrap;
        padding: 6px 10px;
        font-size: 12px;
    }


    /* =========================================
       DOCUMENT HEADER
    ========================================= */

    .doc-header {

        margin: 65px 0 8px 0;

        padding: 0 10px;

        width: 100%;

        box-sizing: border-box;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 8px;

        flex-wrap: nowrap;

        overflow: hidden;
    }


    /* =========================================
       SOP NAME / TITLE
    ========================================= */

    .doc-header > *:first-child {

        min-width: 0;

        flex: 1 1 auto;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    /* =========================================
       TOOLBAR
       NO SALTA A SEGUNDA LINEA
    ========================================= */

    .toolbar {

        flex: 0 0 auto;

        display: flex;

        align-items: center;

        gap: 6px;

        flex-wrap: nowrap;

        margin-left: auto;

        max-width: 58vw;

        overflow-x: auto;

        overflow-y: hidden;

        white-space: nowrap;

        -webkit-overflow-scrolling: touch;

        scrollbar-width: none;

        padding-bottom: 2px;
    }


    /* Chrome / Safari */
    .toolbar::-webkit-scrollbar {
        display: none;
    }


    /* =========================================
       TOOL BUTTONS
    ========================================= */

    .doc-header .tool {

        flex: 0 0 auto;

        white-space: nowrap;

        padding: 7px 9px;

        font-size: 12px;

        border-radius: 8px;

        gap: 4px;
    }


    /* =========================================
       DIVIDER
    ========================================= */

    .divider {

        flex: 0 0 auto;

        height: 22px;

        margin: 0 2px;
    }


    /* =========================================
       DOCUMENT AREA
    ========================================= */

    .doc-area {

        padding: 5px 6px 20px;

    }


    /* =========================================
       DOCUMENT FRAME
    ========================================= */

    .doc-frame {

        width: 100%;

        border-radius: 8px;

    }


    /* =========================================
       IFRAME
    ========================================= */

    iframe {

        width: 100%;

        height: calc(100vh - 125px);

        min-height: 500px;

        border: none;

    }


    /* =========================================
       PREVIOUS / NEXT
    ========================================= */

    #prevDocBtn,
    #nextDocBtn {

        width: 34px;

        height: 34px;

        padding: 0;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 17px;

        z-index: 500;
    }


    #prevDocBtn {
        left: 4px;
    }


    #nextDocBtn {
        right: 4px;
    }

}
    
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>

  <!-- TOOLBAR MODERNA -->
  <div class="toolbar">

    <button class="tool" onclick="zoomOut()">−</button>

    <button class="tool" id="zoomIndicator">100%</button>

    <button class="tool" onclick="zoomIn()">+</button>

    <button class="tool" onclick="resetZoom()">Reset</button>

    <span class="divider"></span>

    <button class="tool" onclick="openNew()">Abrir</button>

    <button class="tool" onclick="downloadDoc()">Descargar</button>

    <button class="tool" onclick="printDoc()">Imprimir</button>

    <span class="divider"></span>

    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>

    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>

  </div>
</div>



    
<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
let zoomLevel = 1;
const ZOOM_STEP = 0.1;
const MAX_ZOOM = 2.5;
const MIN_ZOOM = 0.5;
const frame = document.getElementById("frame");

    
frame.onload = function () {
    try {
        const docFrame = frame.contentDocument || frame.contentWindow.document;

        const style = docFrame.createElement("style");
       

style.innerHTML = `
    * {
        font-family: inherit !important;
    }

    body {
        max-width: 900px !important;
        margin: 80px auto 60px auto !important; /* 👈 AUMENTA margen superior */
        padding-top: 20px !important; /* 👈 ESTO LO ARREGLA VISUALMENTE */
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif !important;

        line-height: 1.6 !important;
        font-size: 16px !important;
        letter-spacing: 0.2px !important;
        color: #1f2937 !important;

        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: optimizeLegibility !important;
    }

    

    h1, h2, h3, h4 {
        font-weight: 600 !important;
        letter-spacing: 0.2px !important;
        color: #0f172a !important;
    }

    p {
        margin: 10px 0 !important;
        line-height: 1.65 !important;
    }

    ul, ol {
        padding-left: 20px !important;
    }

    li {
        margin-bottom: 6px !important;
    }

    strong {
        font-weight: 600 !important;
    }
    a {
    color: #1d4ed8 !important;
    text-decoration: none !important;
    font-weight: 500;
    }
    
    a:hover {
        text-decoration: underline !important;
    }
    
    a[href^="#"] {
        color: #0f172a !important;
        font-weight: 600;
    }
    /* =========================
   FIX HEADER PRIMERA PAGINA
   ========================= */

/* Empuja el encabezado superior (línea + texto) */

body {
    padding-top: 60px !important; /* empuja TODO sin romper el layout */
}

/* Mejora título principal */
h1 {
    text-align: center !important;
    margin-top: 40px !important;
    margin-bottom: 40px !important;
}

/* Control de línea horizontal del encabezado */
hr {
     margin: 20px 0 !important;
    margin-bottom: 30px !important;
    position: static !important;
}

`;        
        docFrame.head.appendChild(style);
        applyZoom();
    } catch (e) {
        console.log("No se pudo modificar el iframe:", e);
    }
};
if(doc) frame.src = doc;

// ======================
// ZOOM
// ======================

function applyZoom(){

    try{

        const docFrame =
            frame.contentDocument ||
            frame.contentWindow.document;

        docFrame.body.style.zoom = zoomLevel;

        document.getElementById("zoomIndicator")
            .innerText = Math.round(zoomLevel * 100) + "%";

    }catch(e){

        console.log("Zoom error:", e);

    }
}

function zoomIn(){

    zoomLevel += ZOOM_STEP;

    if(zoomLevel > MAX_ZOOM){
        zoomLevel = MAX_ZOOM;
    }

    applyZoom();
}

function zoomOut(){

    zoomLevel -= ZOOM_STEP;

    if(zoomLevel < MIN_ZOOM){
        zoomLevel = MIN_ZOOM;
    }

    applyZoom();
}

function resetZoom(){

    zoomLevel = 1;

    applyZoom();
}
    
function openNew() {
    if(doc) window.open(doc, "_blank");
}

function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function printDoc() {
    if(frame.contentWindow) frame.contentWindow.print();
}

// ======================
// NAVIGACION SOP
// ======================
fetch('SOP_INDEX.json')
  .then(res => res.json())
  .then(data => {
    if (!data.length) return;

    if (!doc) doc = data[0].url;

    const sopList = data.map(s => s.url);
    let currentIndex = sopList.indexOf(doc);
    if (currentIndex === -1) currentIndex = 0;

    const currentSOP = data[currentIndex];
    document.getElementById("title").innerText = currentSOP.title.toUpperCase();

    window.prevSOP = function() {
      if(currentIndex > 0) {
        const prev = data[currentIndex-1];
        window.location.href = `viewer.html?doc=${prev.url}&id=${prev.id}`;
      }
    };

    window.nextSOP = function() {
      if(currentIndex < data.length-1) {
        const next = data[currentIndex+1];
        window.location.href = `viewer.html?doc=${next.url}&id=${next.id}`;
      }
    };

    // deshabilitar botones si estamos en límites
    document.getElementById("prevDoc").classList.toggle("disabled", currentIndex === 0);
    document.getElementById("nextDoc").classList.toggle("disabled", currentIndex === data.length-1);
  })
  .catch(err => console.error("Error cargando SOP_INDEX.json:", err));
</script>

</body>
</html>
