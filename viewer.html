<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer SOP Pro - Artemisa</title>
<style>
body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:#eef2f7; }
.topbar { background:#0f172a; color:white; padding:14px 28px; display:flex; justify-content:space-between; align-items:center; position:fixed; width:100%; top:0; z-index:100; }
.brand { font-weight:600; letter-spacing:.4px; font-size:15px; }
.back { background:#2563eb; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px; }
.sop-list { margin:100px auto 20px; width:90%; max-width:1100px; }
.sop-list table { width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,.1);}
.sop-list th, .sop-list td { padding:12px 10px; border-bottom:1px solid #e2e8f0; text-align:left; font-size:14px;}
.sop-list th { background:#f1f5f9; }
.sop-list tr:hover { background:#f0f9ff; cursor:pointer; }
.doc-area { display:none; justify-content:center; padding:10px 20px 40px; margin-top:80px; }
.doc-frame { position:relative; width:100%; max-width:1100px; height:80vh; overflow:visible; background:white; border-radius:12px; box-shadow:0 15px 40px rgba(0,0,0,.15); }
iframe { width:100%; height:100%; border:none; }
#commentsLayer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:450; }
.floating-comment { position:absolute; pointer-events:auto; z-index:999; }
.floating-comment div { background:rgba(255,255,255,0.9); border-left:4px solid #dc2626; color:#dc2626; padding:6px; border-radius:6px; font-size:12px; font-style:italic; max-width:220px; word-wrap:break-word; }
#loginOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg,#0f172a,#1e293b); display:none; align-items:center; justify-content:center; z-index:500; }
.login-card { background:white; padding:35px; border-radius:16px; width:360px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
.login-card button { padding:10px 20px; border-radius:8px; font-size:14px; border:none; cursor:pointer; transition:0.2s; }
#loginOverlay .login-card button#loginBtn { background:#2563eb; color:white; }
#loginOverlay .login-card button#loginBtn:hover { background:#1e40af; }
#loginOverlay .login-card button.cancelBtn { background:#e5e7eb; color:#111; }
#loginOverlay .login-card button.cancelBtn:hover { background:#cbd5e1; }
.login-card select, .login-card input[type="password"] { width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px; font-size:14px; box-sizing:border-box; }
#commentModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:500px; max-width:90%; background:white; z-index:1000; border-radius:14px; padding:25px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="#" id="backBtn" style="display:none;">⬅ Volver</a>
</div>

<!-- Lista de SOPs -->
<div class="sop-list" id="sopListContainer">
  <h2>📄 Lista de SOPs</h2>
  <table id="sopTable">
    <thead>
      <tr><th>Empleado</th><th>Objetivo</th><th>Areas</th><th>Estado</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Viewer -->
<div class="doc-area" id="docArea">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="commentsLayer"></div>
  </div>
  <div style="margin-top:10px; text-align:right;">
    <button onclick="showLogin()">🔒 Editar</button>
    <button onclick="closeViewer()">⬅ Volver al listado</button>
  </div>
</div>

<!-- Login -->
<div id="loginOverlay">
  <div class="login-card">
    <h3>🔒 Acceso de edición</h3>
    <div id="loginMessage" style="color:red;font-size:13px;margin-bottom:10px;"></div>
    <select id="loginUser"><option value="">Seleccionar usuario</option></select>
    <input type="password" id="loginPass" placeholder="Contraseña">
    <div style="margin-top:15px;text-align:right;">
         <button id="loginBtn" onclick="checkLogin()">Ingresar</button>
        <button class="cancelBtn" onclick="closeLogin()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal comentario -->
<div id="commentModal">
  <h3>💬 Nuevo comentario</h3>
  <textarea id="commentInput" placeholder="Escribe tu comentario..."></textarea>
  <div style="margin-top:15px;text-align:right;">
    <button onclick="closeCommentModal()" style="margin-right:10px;">Cancelar</button>
    <button id="saveCommentBtn" onclick="saveComment()">Guardar</button>
  </div>
</div>

<script>
// ====================== CONFIG ======================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6X0bRN4Ma6kIZoUkwcTwKh9Aqxv9NyrXx45xauMchS06AhwcQ2bnzWEBkwXu1pdO_/exec";
let sopData = [];
let loadedComments = [];
let editMode = false;
let currentUser = "";
let currentSOP = null;

const users = {
  "Damian Molina":"Dam1975",
  "Alberto Molina":"Alb1975",
  "Gabriel Batista":"Gab1975",
  "Jenny Perez":"Jen1975",
  "Yoandry Perez":"Yoa1975",
  "Wendy Romanach":"Wen1975",
  "Otros":"Otr1975"
};

// Llenar select usuarios
const loginSelect = document.getElementById("loginUser");
for(const u in users){
    const opt = document.createElement("option");
    opt.value = u;
    opt.textContent = u;
    loginSelect.appendChild(opt);
}

// ====================== FUNCIONES ======================
async function loadSOPs(){
  try{
    const res = await fetch(SCRIPT_URL + "?listSOPs=true");
    sopData = await res.json();
    const tbody = document.querySelector("#sopTable tbody");
    tbody.innerHTML = "";
    sopData.forEach(sop=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${sop.empleado}</td><td>${sop.objetivo}</td><td>${sop.areas}</td><td>${sop.estado}</td>`;
      tr.onclick = ()=> openViewer(sop);
      tbody.appendChild(tr);
    });
  }catch(err){ console.error("Error cargando SOPs:",err); }
}

function openViewer(sop){
  currentSOP = sop;
  document.getElementById("sopListContainer").style.display="none";
  document.getElementById("docArea").style.display="flex";
  document.getElementById("backBtn").style.display="inline";
  document.getElementById("frame").src = sop.links;
  loadComments();
}

function closeViewer(){
  currentSOP=null;
  document.getElementById("docArea").style.display="none";
  document.getElementById("sopListContainer").style.display="block";
  document.getElementById("backBtn").style.display="none";
}

function showLogin(){ document.getElementById("loginOverlay").style.display="flex"; }
function closeLogin(){ document.getElementById("loginOverlay").style.display="none"; }

function checkLogin(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const msg = document.getElementById("loginMessage");
  if(!user){ msg.innerText="Seleccione usuario"; return; }
  if(users[user]!==pass){ msg.innerText="Clave incorrecta"; return; }
  editMode = true; currentUser=user;
  closeLogin();
  alert("Modo edición activado. Ahora puede hacer comentarios.");
}

// ====================== COMENTARIOS ======================
function openCommentModal(data){
  const modal = document.getElementById("commentModal");
  modal.style.display="block";
  modal.dataset.x = data.x;
  modal.dataset.y = data.y;
}

function closeCommentModal(){ 
  document.getElementById("commentModal").style.display="none"; 
}

async function saveComment(){
  if(!currentSOP){ alert("Seleccione un SOP"); return; }
  const text = document.getElementById("commentInput").value.trim();
  if(!text){ alert("Comentario vacío"); return; }
  const newComment = {
    id_comment: Date.now().toString(),
    usuario: currentUser || "Anónimo",
    comentario: text,
    x: 0.5, // simplificado: centro del iframe
    y:0.5,
    page:1
  };
  try{
    await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({...newComment, id_sop:currentSOP.id_sop, tipo:"comentario"})});
    loadedComments.push(newComment);
    renderComments();
    closeCommentModal();
    document.getElementById("commentInput").value="";
  }catch(err){ console.error(err); alert("Error guardando comentario"); }
}

function renderComments(){
  const iframeDoc = document.getElementById("frame").contentDocument || document.getElementById("frame").contentWindow.document;
  const containerId = "commentsLayerInside";
  let container = iframeDoc.getElementById(containerId);
  if(!container){
    container = iframeDoc.createElement("div");
    container.id = containerId;
    container.style.position="absolute";
    container.style.top="0"; container.style.left="0"; container.style.width="100%"; container.style.height="100%"; container.style.pointerEvents="none";
    iframeDoc.body.style.position="relative";
    iframeDoc.body.appendChild(container);
  }
  container.innerHTML="";
  loadedComments.forEach(c=>{
    const el = iframeDoc.createElement("div");
    el.className="floating-comment";
    el.innerHTML=`<div>${c.comentario}</div>`;
    el.style.left = (c.x*iframeDoc.body.scrollWidth)+"px";
    el.style.top = (c.y*iframeDoc.body.scrollHeight)+"px";
    container.appendChild(el);
  });
}

// ====================== INICIAR ======================
loadSOPs();
</script>

</body>
</html>
