<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor SOP - Artemisa</title>

<style>
body{
  margin:0;
  background:#f1f5f9;
  font-family:"Segoe UI",Arial,sans-serif;
}

/* TOPBAR */
.topbar{
  background:#0f172a;
  color:white;
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-weight:600;
  font-size:15px;
}

.back{
  background:#2563eb;
  color:white;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
}

/* HEADER */
.doc-header{
  max-width:1100px;
  margin:20px auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tool{
  background:white;
  border:1px solid #d1d5db;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* DOCUMENTO */
.doc-area{
  display:flex;
  justify-content:center;
}

.doc-frame{
  width:100%;
  max-width:1100px;
  background:white;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  overflow:hidden;
  position:relative;
}

iframe{
  width:100%;
  height:88vh;
  border:none;
}

/* OVERLAY */
#overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  cursor:crosshair;
}

/* MARCADORES */
.marker{
  position:absolute;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  cursor:pointer;
}

/* SIDEBAR */
#commentSidebar{
  position:fixed;
  top:0;
  right:-320px;
  width:320px;
  height:100%;
  background:white;
  box-shadow:-4px 0 10px rgba(0,0,0,.2);
  padding:15px;
  transition:.3s;
  z-index:999;
  overflow:auto;
}

#commentSidebar.active{
  right:0;
}

.comment-box{
  border:1px solid #ddd;
  padding:8px;
  margin-bottom:8px;
  border-radius:6px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" onclick="adminLogin()">🔒 Editar</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <div id="overlay"></div>
  </div>
</div>

<!-- SIDEBAR -->
<div id="commentSidebar">
  <h3>Comentarios</h3>
  <div id="commentList"></div>
</div>

<script>

// ================== VARIABLES ==================
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");

const frame = document.getElementById("frame");
const overlay = document.getElementById("overlay");

let editMode = false;

// ================== CARGAR DOCUMENTO ==================
if(doc){
  frame.src = doc;
}

// ================== BOTONES ==================
function openNew(){ if(doc) window.open(doc,"_blank"); }
function downloadDoc(){
  if(doc){
    const a=document.createElement("a");
    a.href=doc;
    a.download="";
    a.click();
  }
}
function printDoc(){ if(doc) frame.contentWindow.print(); }

// ================== LOGIN ==================
function adminLogin(){
  const password = prompt("Ingrese contraseña");

  if(password === "Artemisa2026"){
    editMode = true;
    document.getElementById("commentSidebar").classList.add("active");
    overlay.style.display = "block";
    loadComments();
    alert("Modo edición activado");
  }else{
    alert("Acceso denegado");
  }
}

// ================== CREAR COMENTARIOS ==================
overlay.addEventListener("click", function(e){

  if(!editMode) return;

  const comment = prompt("Escribe el comentario:");
  if(!comment) return;

  const x = e.offsetX;
  const y = e.offsetY;

  const marker = document.createElement("div");
  marker.className = "marker";
  marker.style.left = x + "px";
  marker.style.top = y + "px";

  overlay.appendChild(marker);

  saveComment({x,y,comment});
  renderComments();
});

// ================== GUARDAR ==================
function saveComment(c){
  const list = JSON.parse(localStorage.getItem(doc) || "[]");
  list.push(c);
  localStorage.setItem(doc, JSON.stringify(list));
}

// ================== CARGAR ==================
function loadComments(){
  const comments = JSON.parse(localStorage.getItem(doc) || "[]");

  comments.forEach(c=>{
    const marker = document.createElement("div");
    marker.className = "marker";
    marker.style.left = c.x + "px";
    marker.style.top = c.y + "px";
    overlay.appendChild(marker);
  });

  renderComments();
}

// ================== SIDEBAR ==================
function renderComments(){
  const listEl = document.getElementById("commentList");
  listEl.innerHTML = "";

  const comments = JSON.parse(localStorage.getItem(doc) || "[]");

  comments.forEach(c=>{
    const div = document.createElement("div");
    div.className = "comment-box";
    div.innerText = c.comment;

    listEl.appendChild(div);
  });
}

</script>

</body>
</html>
