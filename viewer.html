<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>

<style>
body {
    margin: 0;
    background: #eef2f7;
    font-family: "Segoe UI", Arial, sans-serif;
}

.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

.brand {
    font-weight: 600;
    letter-spacing: .4px;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.tool:hover {
    background: #2563eb;
    color: white;
}

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}

.doc-area {
    display: flex;
    justify-content: center;
    padding: 10px 20px 40px;
}

.doc-frame {
    width: 100%;
    max-width: 1100px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    overflow: hidden;
    position: relative;
}

iframe {
    width: 100%;
    height: 80vh;
    border: none;
}

/* BOTONES ANTERIOR / SIGUIENTE SOBRE EL VISOR */
#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: background 0.3s;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <!-- BOTONES FLOTANTES ANTERIOR/SIGUIENTE -->
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");
const frame = document.getElementById("frame");
if(doc) frame.src = doc;

// ABRIR EN NUEVA PESTAÑA
function openNew() { window.open(doc, "_blank"); }

// DESCARGAR
function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

// IMPRIMIR
function printDoc() { frame.contentWindow.print(); }

// ======================
// NAVIGACION SOP
// ======================
fetch('SOP_INDEX.json')
  .then(res => res.json())
  .then(data => {
    if (!data.length) return;

    if (!doc) doc = data[0].url;

    const sopList = data.map(s => s.url);
    let currentIndex = sopList.indexOf(doc);
    if (currentIndex === -1) currentIndex = 0;

    const currentSOP = data[currentIndex];
    document.getElementById("title").innerText = currentSOP.title.toUpperCase();

    // ← anterior
    window.prevSOP = function() {
      if (currentIndex > 0) {
        const prev = data[currentIndex - 1];
        window.location.href = `viewer.html?doc=${prev.url}&id=${prev.id}`;
      }
    };

    // siguiente →
    window.nextSOP = function() {
      if (currentIndex < data.length - 1) {
        const next = data[currentIndex + 1];
        window.location.href = `viewer.html?doc=${next.url}&id=${next.id}`;
      }
    };

    // deshabilitar botones si estamos en límites
    const prevBtn = document.getElementById("prevDoc");
    const nextBtn = document.getElementById("nextDoc");
    if(prevBtn) prevBtn.classList.toggle("disabled", currentIndex === 0);
    if(nextBtn) nextBtn.classList.toggle("disabled", currentIndex === data.length - 1);

  })
  .catch(err => console.error("Error cargando SOP_INDEX.json:", err));
</script>

</body>
</html>
