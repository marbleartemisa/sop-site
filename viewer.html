<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP Pro - Artemisa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
<style>


body {
    margin: 0;
    background: #e5e9f2;

    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}
    
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
    box-sizing: border-box;
}

.brand {
    font-weight: 600;
    letter-spacing: .4px;
    font-size: 15px;
}

.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.doc-header .tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.doc-header .tool:hover {
    background: #2563eb;
    color: white;
}

.doc-area {
    display: flex;
    justify-content: center;
    padding: 10px 20px 40px;
}


.doc-frame {
    width: 100%;
    max-width: 1000px;
    background: #f8fafc;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    padding: 30px 0;
    position: relative;
}    
    
iframe {
    width: 100%;
    height: 95vh; /* <- altura casi completa de la pantalla */
    border: none;
}

#prevDocBtn, #nextDocBtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: background 0.3s;
}

#prevDocBtn:hover, #nextDocBtn:hover {
    background: rgba(0,0,0,0.7);
}

#prevDocBtn { left: 0; }
#nextDocBtn { right: 0; }

.tool.disabled {
    opacity: .5;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
    <button id="prevDocBtn" onclick="prevSOP()">⬅</button>
    <button id="nextDocBtn" onclick="nextSOP()">➡</button>
  </div>
</div>


<script>
let params = new URLSearchParams(window.location.search);
let doc = params.get("doc");
let idSOP = params.get("id");

const frame = document.getElementById("frame");

frame.onload = function () {
    try {
        const docFrame = frame.contentDocument || frame.contentWindow.document;

        const style = docFrame.createElement("style");

        style.innerHTML = `
            body {
                max-width: 900px !important;
                margin: 40px auto !important;
                display: block !important;

                background: white !important;
                padding: 60px 70px !important;
                border-radius: 10px !important;
                box-shadow: 0 10px 30px rgba(0,0,0,.08) !important;

                font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif !important;

                line-height: 1.6 !important;
                font-size: 16px !important;
                letter-spacing: 0.2px !important;
                color: #1f2937 !important;

                -webkit-font-smoothing: antialiased !important;
                -moz-osx-font-smoothing: grayscale !important;
                text-rendering: optimizeLegibility !important;
            }

            h1 {
                font-size: 26px !important;
                margin-bottom: 20px !important;
            }

            h2 {
                font-size: 20px !important;
                margin-top: 30px !important;
            }

            h3 {
                font-size: 17px !important;
                margin-top: 20px !important;
            }

            p {
                margin: 12px 0 !important;
            }
        `;

        docFrame.head.appendChild(style);

    } catch (e) {
        console.log("No se pudo modificar el iframe:", e);
    }
};

if (doc) frame.src = doc;


// ======================
// FUNCIONES
// ======================

function openNew() {
    if (doc) window.open(doc, "_blank");
}

function downloadDoc(url) {
    if (!url) url = doc;
    if (!url) return alert("No hay documento");

    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function printDoc() {
    if (frame.contentWindow) frame.contentWindow.print();
}


// ======================
// NAVIGACION SOP
// ======================

fetch('SOP_INDEX.json')
    .then(res => res.json())
    .then(data => {
        if (!data.length) return;

        if (!doc) doc = data[0].url;

        const sopList = data.map(s => s.url);
        let currentIndex = sopList.indexOf(doc);
        if (currentIndex === -1) currentIndex = 0;

        const currentSOP = data[currentIndex];
        document.getElementById("title").innerText =
            currentSOP.title.toUpperCase();

        window.prevSOP = function () {
            if (currentIndex > 0) {
                const prev = data[currentIndex - 1];
                window.location.href =
                    `viewer.html?doc=${prev.url}&id=${prev.id}`;
            }
        };

        window.nextSOP = function () {
            if (currentIndex < data.length - 1) {
                const next = data[currentIndex + 1];
                window.location.href =
                    `viewer.html?doc=${next.url}&id=${next.id}`;
            }
        };

        document.getElementById("prevDoc")
            .classList.toggle("disabled", currentIndex === 0);

        document.getElementById("nextDoc")
            .classList.toggle("disabled", currentIndex === data.length - 1);
    })
    .catch(err =>
        console.error("Error cargando SOP_INDEX.json:", err)
    );
</script>


</body>
</html>
