<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Viewer SOP - Artemisa</title>
<style>
/* ===== BODY & GENERAL ===== */
body {
    margin: 0;
    background: #eef2f7;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== TOPBAR ===== */
.topbar {
    background: #0f172a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
}
.brand { font-weight: 600; letter-spacing: .4px; font-size: 15px; }
.back {
    background: #2563eb;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}

/* ===== DOC HEADER & NAV ===== */
.doc-header {
    max-width: 1100px;
    margin: 80px auto 10px auto;
    padding: 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.tool {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}
.tool:hover { background: #2563eb; color: white; }
.tool.disabled { opacity: .5; pointer-events: none; }

/* ===== DOC AREA ===== */
.doc-area { display: flex; justify-content: center; padding: 10px 20px 40px; }
.doc-frame {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 80vh;
    overflow: hidden;
    background: white;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}
iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ARTEMISA SOP • VIEWER</div>
  <a class="back" href="/sop-site/">⬅ Biblioteca</a>
</div>

<div class="doc-header">
  <div id="title">Documento SOP</div>
  <div>
    <button class="tool" onclick="openNew()">Abrir</button>
    <button class="tool" onclick="downloadDoc()">Descargar</button>
    <button class="tool" onclick="printDoc()">Imprimir</button>
    <button class="tool" id="prevDoc" onclick="prevSOP()">← Anterior</button>
    <button class="tool" id="nextDoc" onclick="nextSOP()">Siguiente →</button>
  </div>
</div>

<div class="doc-area">
  <div class="doc-frame">
    <iframe id="frame"></iframe>
  </div>
</div>

<script>
// ===== VARIABLES =====
let currentPage = 1;
const params = new URLSearchParams(window.location.search);
let doc = params.get("doc") || "";
const frame = document.getElementById("frame");
if(doc) frame.src = doc;

// ===== NAVIGATION =====
function getDocUrlForPage(n){ return doc; }
function loadSOPPage(n){ currentPage=n; frame.src=getDocUrlForPage(n); }
function prevSOP(){ if(currentPage>1){ currentPage--; loadSOPPage(currentPage); } }
function nextSOP(){ currentPage++; loadSOPPage(currentPage); }

// ===== DOC FUNCTIONS =====
function openNew(){ window.open(doc,"_blank"); }
function downloadDoc(){
  const a = document.createElement("a");
  a.href = doc;
  a.download = doc.split("/").pop();
  a.click();
}
function printDoc(){ frame.contentWindow.print(); }
</script>

</body>
</html>
